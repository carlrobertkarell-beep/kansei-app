const RED_FLAGS = [
  {pattern: /nattsmärta|natt\s*smärta/i, label: 'Nattsmärta', msg: 'Smärta som väcker patienten på natten — kan indikera inflammatorisk artrit, infektion eller malignitet.'},
  {pattern: /oförklarlig\s*viktminskning|viktnedgång/i, label: 'Viktminskning', msg: 'Oförklarlig viktminskning — bör utredas för systemsjukdom.'},
  {pattern: /blåspåverkan|tarmpåverkan|inkontinens|urinretention/i, label: 'Blås/tarm', msg: 'Blås- eller tarmstörning — kan indikera cauda equina-syndrom. Akut remiss.'},
  {pattern: /sadelbedövning|perianal/i, label: 'Sadelbedövning', msg: 'Sadelbedövning — cauda equina-syndrom tills motsatsen bevisats. Akut remiss.'},
  {pattern: /feber|frossa|svettning\s*på\s*natten/i, label: 'Feber/svettning', msg: 'Feber eller kraftig svettning — kan indikera infektion eller systemsjukdom.'},
  {pattern: /steroidbehandling|immunosuppression|immundämpande/i, label: 'Immunosuppression', msg: 'Patient med immunosuppression — ökad risk för atypiska infektioner.'},
  {pattern: /cancer|tumör|malignitet|onkologi/i, label: 'Cancerhistorik', msg: 'Cancerhistorik — rygg-/ledsmärta kan vara metastas.'},
  {pattern: /neurologisk\s*bortfall|förlamning|pares|pareser/i, label: 'Neurologisk bortfall', msg: 'Neurologiska bortfall — prioritera neurologisk utredning.'},
  {pattern: /trauma|fall\s*från\s*höjd|trafikolycka/i, label: 'Allvarligt trauma', msg: 'Allvarligt trauma — uteslut fraktur.'},
  {pattern: /progressiv|tilltagande\s*svaghet/i, label: 'Progressiv svaghet', msg: 'Progressiv motorisk svaghet — neurologisk utredning prioriteras.'},
];

function checkRedFlags(soapText) {
  if (!soapText) return [];
  const found = [];
  RED_FLAGS.forEach(f => {
    if (f.pattern.test(soapText)) found.push(f);
  });
  return found;
}

function renderRedFlagBanner(flags) {
  if (!flags || !flags.length) return '';
  const items = flags.map(f => `<div class="rf-item"><strong>⚠ ${f.label}:</strong> ${f.msg}</div>`).join('');
  return `<div class="rf-banner">
    <div class="rf-title">🚩 Röda flaggor detekterade — granska innan behandling</div>
    ${items}
  </div>`;
}

// ── AUTOMATISK FRAMSTEGSNOTERING ──────────────────────────────────────────────

async function generateProgressNote(pat) {
  const visits = (pat.visits||[]);
  if (visits.length < 2) return null;

  const current = visits[0]; // most recent
  const prev = visits[1];

  const key = getKey();
  if (!key) return null;

  const prevSoap = prev.soap ? Object.entries(prev.soap).map(([k,v]) => `${k}: ${v}`).join('\n') : '';
  const currSoap = current.soap ? Object.entries(current.soap).map(([k,v]) => `${k}: ${v}`).join('\n') : '';
  const prevPain = prev.form?.pain ?? '—';
  const currPain = current.form?.pain ?? '—';
  const prevDate = prev.date || '—';
  const currDate = current.date || '—';

  const prompt = `Du är fysioterapeut. Skriv en kort automatisk framstegsnotering (3-5 meningar på svenska) baserat på dessa två besök.

Besök 1 (${prevDate}): NRS ${prevPain}/10
${prevSoap}

Besök 2 (${currDate}): NRS ${currPain}/10  
${currSoap}

Fokusera på: förändring i smärta, funktionsförbättring, compliance med övningar. Inga rubriker, ren löptext. Max 5 meningar.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:400, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    return (data.content||[]).map(b=>b.text||'').join('').trim();
  } catch(e) {
    return null;
  }
}

async function showProgressNote(patId) {
  const pat = S.patients.find(p => p.id === patId);
  if (!pat) return;

  // Show loading state
  const btn = document.getElementById('prog-btn-' + patId);
  if (btn) { btn.textContent = 'Genererar...'; btn.disabled = true; }

  const note = await generateProgressNote(pat);

  if (btn) { btn.textContent = '📊 Framstegsnotering'; btn.disabled = false; }

  if (!note) { alert('Kunde inte generera framstegsnotering. Kontrollera API-nyckeln.'); return; }

  // Show in modal
  document.getElementById('mtitle').textContent = 'Automatisk framstegsnotering';
  document.getElementById('mtext').textContent = note;
  document.getElementById('modal').classList.add('open');
  document.getElementById('mconfirm').textContent = 'Kopiera';
  document.getElementById('mconfirm').onclick = () => {
    navigator.clipboard.writeText(note).catch(() => {});
    closeModal();
    // Reset confirm button
    document.getElementById('mconfirm').textContent = 'OK';
    document.getElementById('mconfirm').onclick = closeModal;
  };
}

  <div class="ftr">${clinic.name} · ${clinic.address} · ${clinic.email}</div>
</div>
<script>window.onload=()=>{window.print();}<\/script>
</body>
</html>`;

  const w = window.open('', '_blank');
  if (w) {
    w.document.write(cardHtml);
    w.document.close();
  }
}

async function fetchClinHint(diag) {
  const el = document.getElementById('clin-suggest');
  if (!el) return;

  const hint = CLIN_HINTS[diag];
  if (!hint) { el.innerHTML = ''; return; }

  el.innerHTML = `<div style="background:#f0f8ff;border:1px solid #c8e0f0;border-radius:8px;padding:12px 14px;margin-bottom:4px">
    <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4a9aaa;margin-bottom:8px">🩺 Kliniskt beslutsstöd — ${e(diag)}</div>
    <div style="font-size:12px;color:#2a4a5a;margin-bottom:6px"><strong>Fas/approach:</strong> ${hint.phase}</div>
    <div style="font-size:12px;color:#2a4a5a;margin-bottom:6px"><strong>Dosering:</strong> ${hint.dose}</div>
    <div style="font-size:12px;color:#2a4a5a;margin-bottom:6px"><strong>Föreslagna övningar:</strong> <span style="color:#4a9aaa">${hint.suggest}</span></div>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:3px">
      ${hint.flags.map(f => `<div style="font-size:11px;color:#c07030;display:flex;gap:6px"><span>⚑</span><span>${f}</span></div>`).join('')}
    </div>
  </div>`;
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
let _authUser = null;

async function sbSignIn(email, password) {
  try {
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.access_token) {
      _authUser = data.user;
      localStorage.setItem('kansei:auth', JSON.stringify({ token: data.access_token, user: data.user, exp: Date.now() + (data.expires_in||3600)*1000 }));
      return { ok: true };
    }
    return { ok: false, msg: data.error_description || data.msg || 'Fel e-post eller lösenord.' };
  } catch(e) {
    return { ok: false, msg: 'Anslutningsfel — kontrollera internet.' };
  }
}

async function sbSignOut() {
  localStorage.removeItem('kansei:auth');
  _authUser = null;
  rLogin();
}

function getStoredAuth() {
  try {
    const a = JSON.parse(localStorage.getItem('kansei:auth')||'null');
    if (a && a.exp > Date.now()) return a;
    return null;
  } catch { return null; }
}

function rLogin() {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s-login').classList.add('active');
  // Hide topbar + fixed elements on login
  const tb = document.querySelector('.topbar');
  if (tb) tb.style.display = 'none';
  const cb = document.getElementById('crash-banner');
  if (cb) cb.style.display = 'none';
  const at = document.getElementById('autosave-toast');
  if (at) at.style.display = 'none';
  _unsavedChanges = false; // suppress unsaved warning
  document.getElementById('s-login').innerHTML = `
    <div class="login-wrap">
      <img src="${LOGO}" class="login-logo">
      <div class="login-title">Välkommen</div>
      <div class="login-sub">Logga in på Kansei Klinik</div>
      <input class="login-field" id="l-email" type="email" placeholder="E-postadress" autocomplete="email">
      <input class="login-field" id="l-pass" type="password" placeholder="Lösenord" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-btn" onclick="doLogin()">Logga in</button>
      <div class="login-err" id="l-err"></div>
      <div class="login-hint">Din data är krypterad och lagras på EU-servrar (Frankfurt).<br>GDPR-kompatibel hantering av patientdata.</div>
    </div>`;
  setTimeout(() => document.getElementById('l-email')?.focus(), 100);
}

async function doLogin() {
  const email = document.getElementById('l-email')?.value?.trim();
  const pass = document.getElementById('l-pass')?.value;
  const errEl = document.getElementById('l-err');
  if (!email || !pass) { if(errEl) errEl.textContent = 'Fyll i e-post och lösenord.'; return; }
  const btn = document.querySelector('.login-btn');
  if (btn) { btn.textContent = 'Loggar in...'; btn.disabled = true; }
  const result = await sbSignIn(email, pass);
  if (btn) { btn.textContent = 'Logga in'; btn.disabled = false; }
  if (result.ok) {
    const tb = document.querySelector('.topbar');
    if (tb) tb.style.display = '';
    const cb = document.getElementById('crash-banner');
    if (cb) cb.style.display = 'none'; // keep hidden unless crash occurs
    const at = document.getElementById('autosave-toast');
    if (at) at.style.display = '';
    loadPats(); S.apiKey = getKey(); startAutoSave(); go('dashboard');
    setTimeout(() => syncFromCloud(), 800);
  } else {
    if (errEl) errEl.textContent = result.msg;
  }
}

// Check for public plan link (#plan=xxx&visit=yyy)
const _hashParams = new URLSearchParams(window.location.hash.replace('#',''));
const _hashPatId = _hashParams.get('plan');
const _hashVisitId = _hashParams.get('visit');

if (_hashPatId && _hashVisitId) {
  // Public plan view — no login needed
  const tb = document.querySelector('.topbar');
  if (tb) tb.style.display = 'none';
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s-public-plan').classList.add('active');
  document.getElementById('s-public-plan').innerHTML = '<div class="pub-loading">⏳ Hämtar din rehabplan...</div>';
  loadPublicPlan(_hashPatId, _hashVisitId);
} else {
  const _storedAuth = getStoredAuth();
  if (_storedAuth) {
    _authUser = _storedAuth.user;
    loadPats(); S.apiKey = getKey(); startAutoSave(); go('dashboard');
    setTimeout(() => syncFromCloud(), 1500);
  } else {
    const tb = document.querySelector('.topbar');
    if (tb) tb.style.display = 'none';
    rLogin();
  }
}
