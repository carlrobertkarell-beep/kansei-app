<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    /* ── BRAND PALETTE ── */
    --ink:#0c0f18;
    --ink2:#161b2e;
    --ink3:#1e2640;
    --surface:#ffffff;
    --surface2:#f7f8fc;
    --surface3:#eef0f7;
    --surface4:#e4e7f2;
    --border:#dde1ef;
    --border2:#c8cedf;
    --muted:#8892a4;
    --subtle:#b4bbc8;

    /* ── ACCENT — VELA TEAL ── */
    --accent:#0d9b8a;
    --accent2:#0b8577;
    --accent3:#097568;
    --accent-light:#e6f7f5;
    --accent-dim:rgba(13,155,138,.1);
    --accent-glow:rgba(13,155,138,.06);

    /* ── SIDEBAR ── */
    --sb:#0c0f18;
    --sb2:#131620;
    --sb3:#1a1e2e;
    --sb4:#212638;
    --sb-border:rgba(255,255,255,.055);
    --sb-text:rgba(255,255,255,.38);
    --sb-text2:rgba(255,255,255,.65);
    --sb-text3:rgba(255,255,255,.92);

    /* ── SEMANTIC ── */
    --green:#0aab7c;--green-bg:#e8faf4;--green-text:#065f46;
    --amber:#e8960a;--amber-bg:#fdf7e8;--amber-text:#7c4a00;
    --red:#e53935;--red-bg:#fef1f1;--red-text:#8b1616;
    --blue:#2563eb;--blue-bg:#eff4ff;--blue-text:#1e3a8a;

    /* ── TYPOGRAPHY ── */
    --font:'Plus Jakarta Sans',system-ui,sans-serif;
    --font-serif:'Fraunces',Georgia,serif;
    --font-mono:'JetBrains Mono','DM Mono',monospace;

    /* ── SHADOWS ── */
    --shadow-xs:0 1px 2px rgba(12,15,24,.04);
    --shadow-sm:0 1px 4px rgba(12,15,24,.06),0 1px 2px rgba(12,15,24,.04);
    --shadow-md:0 4px 16px rgba(12,15,24,.08),0 1px 3px rgba(12,15,24,.05);
    --shadow-lg:0 12px 36px rgba(12,15,24,.1),0 4px 8px rgba(12,15,24,.05);
    --shadow-xl:0 24px 60px rgba(12,15,24,.14),0 8px 16px rgba(12,15,24,.07);
    --shadow-accent:0 4px 20px rgba(13,155,138,.2);

    /* ── RADIUS ── */
    --r-xs:4px;--r-sm:7px;--r-md:11px;--r-lg:15px;--r-xl:20px;--r-2xl:26px;

    /* ── TRANSITIONS ── */
    --t-fast:all .1s ease;--t-base:all .18s ease;--t-slow:all .3s ease;

    /* ── LAYOUT ── */
    --nav-w:228px;

    /* ── LEGACY ALIASES ── */
    --navy:var(--ink);
    --teal:var(--accent);
    --bg:var(--surface2);
    --bg2:var(--surface3);
    --text:var(--ink);
    --text2:#3a4155;
    --text3:#6b7488;
    --text4:#9aa2b2;
    --navy-light:var(--accent-light);
    --teal-bg:var(--accent-light);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{height:100%;scroll-behavior:smooth;}
  body{font-family:var(--font);background:var(--surface2);color:var(--ink);height:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeInOv{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(13,155,138,.3)}50%{box-shadow:0 0 0 6px rgba(13,155,138,0)}}

  .app-shell{display:flex;min-height:100vh;}
  .nav-sidebar{width:var(--nav-w);background:var(--sb);position:fixed;top:0;left:0;bottom:0;z-index:150;display:flex;flex-direction:column;transition:transform .25s ease;border-right:1px solid var(--sb-border);}
  .nav-logo{padding:22px 18px 18px;border-bottom:1px solid var(--sb-border);display:flex;align-items:center;gap:10px;}
  .nav-logo-img{height:20px;opacity:.85;}
  .nav-section{padding:10px 10px;flex:1;overflow-y:auto;}
  .nav-section::-webkit-scrollbar{width:3px;}
  .nav-section::-webkit-scrollbar-thumb{background:var(--sb-border);}
  .nav-label{font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-text);padding:14px 10px 5px;display:block;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);color:var(--sb-text2);font-size:12.5px;font-weight:500;cursor:pointer;transition:var(--t-fast);margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:var(--font);letter-spacing:-.01em;}
  .nav-item:hover{background:var(--sb3);color:var(--sb-text3);}
  .nav-item.active{background:linear-gradient(90deg,rgba(13,155,138,.18),rgba(13,155,138,.08));color:#3dccba;border-left:2px solid var(--accent);padding-left:8px;}
  .nav-item-icon{width:15px;height:15px;flex-shrink:0;opacity:.6;}
  .nav-item.active .nav-item-icon{opacity:1;}
  .nav-badge{margin-left:auto;background:var(--red);color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;font-family:var(--font-mono);min-width:16px;text-align:center;}
  .nav-footer{padding:12px 10px;border-top:1px solid var(--sb-border);}
  .nav-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);cursor:pointer;transition:var(--t-fast);}
  .nav-user:hover{background:var(--sb3);}
  .nav-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a8fc4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;font-family:var(--font-mono);letter-spacing:0;}
  .nav-user-name{font-size:12px;color:var(--sb-text2);font-weight:600;letter-spacing:-.01em;}
  .nav-user-clinic{font-size:10px;color:var(--sb-text);margin-top:1px;}
  .nav-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;flex-shrink:0;}
  .nav-sync-dot.error{background:var(--red);}
  .nav-sync-dot.syncing{animation:pulse .8s infinite;}

  .main-content{margin-left:var(--nav-w);flex:1;min-width:0;padding:0;}
  .page-header{padding:28px 32px 20px;margin-bottom:0;background:var(--surface);border-bottom:1px solid var(--border);}
  .page-header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-title{font-family:var(--font-serif);font-size:27px;color:var(--ink);font-weight:400;letter-spacing:-.02em;line-height:1.2;}
  .page-subtitle{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400;}
  .page-body{padding:24px 32px 56px;}

  .screen{display:none;animation:fadeUp .22s ease;}
  .screen.active{display:block;}

  .btn{padding:7px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);border:1px solid var(--border2);background:var(--surface);color:#475569;transition:var(--t-fast);white-space:nowrap;line-height:1.4;letter-spacing:-.01em;}
  .btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent);}
  .btn-p{background:var(--accent);border-color:var(--accent);color:white;font-weight:600;box-shadow:0 1px 3px rgba(13,155,138,.25);}
  .btn-p:hover{background:var(--accent2);border-color:var(--accent2);color:white;box-shadow:var(--shadow-accent);}
  .btn-ink{background:var(--ink);border-color:var(--ink);color:white;font-weight:600;}
  .btn-ink:hover{background:var(--ink2);}
  .btn-d{background:var(--surface);border-color:#fca5a5;color:var(--red);}
  .btn-d:hover{background:var(--red-bg);}
  .btn-ghost{background:transparent;border-color:var(--sb-border);color:var(--sb-text2);}
  .btn-ghost:hover{background:var(--sb3);color:white;}
  .btn-lg{padding:11px 22px;font-size:13.5px;border-radius:var(--r-md);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);}
  .card:hover{box-shadow:var(--shadow-sm);}
  .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
  .card-body{padding:0;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-xs);transition:var(--t-base);position:relative;overflow:hidden;}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#1a8fc4);opacity:0;transition:opacity .2s;}
  .kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .kpi-card:hover::before{opacity:1;}
  .kpi-val{font-size:30px;font-weight:700;font-family:var(--font-mono);color:var(--ink);line-height:1;letter-spacing:-.03em;margin-bottom:6px;}
  .kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .kpi-trend{font-size:10px;margin-top:5px;font-weight:600;}
  .kpi-trend.up{color:var(--green);}
  .kpi-trend.alert{color:var(--red);}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;}
  .dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .dash-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-xs);}
  .dash-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .dash-panel-title{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase;}
  .dash-panel-body{padding:4px 0;}
  .dash-row{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;transition:var(--t-fast);border-bottom:1px solid var(--border);}
  .dash-row:last-child{border-bottom:none;}
  .dash-row:hover{background:var(--surface2);}
  .dr-initials{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a8fc4);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);letter-spacing:0;}
  .dr-info{flex:1;min-width:0;}
  .dr-name{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-diag{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .dr-date{font-size:10px;color:var(--subtle);font-family:var(--font-mono);margin-top:2px;}
  .dash-empty{padding:28px 18px;text-align:center;font-size:12px;color:var(--subtle);font-style:italic;}
  .dash-stat-row{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--border);}
  .dash-stat-row:last-child{border-bottom:none;}
  .dash-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
  .dash-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#1a8fc4);border-radius:2px;transition:width .4s ease;}

  .dash-topbar{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px;}
  .dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .dash-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--shadow-xs);}
  .dash-kpi-val{font-size:28px;font-weight:700;font-family:var(--font-mono);color:var(--ink);line-height:1;letter-spacing:-.03em;margin-bottom:5px;}
  .dash-kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
  .dash-greeting{font-family:var(--font-serif);font-size:24px;color:var(--ink);font-weight:400;letter-spacing:-.02em;}
  .dash-date{font-size:12px;color:var(--muted);margin-top:3px;}
  .dash-quickbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .dash-qbtn{padding:8px 16px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);border:none;transition:var(--t-fast);letter-spacing:-.01em;}
  .dash-qbtn-primary{background:var(--accent);color:white;box-shadow:0 1px 4px rgba(13,155,138,.3);}
  .dash-qbtn-primary:hover{background:var(--accent2);box-shadow:var(--shadow-accent);}
  .dash-qbtn-secondary{background:var(--surface3);color:var(--ink2);border:1px solid var(--border);}
  .dash-qbtn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

  .trow{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--t-fast);}
  .trow:last-child{border-bottom:none;}
  .trow:hover{background:var(--surface2);}
  .trow-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1a8fc4);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);letter-spacing:0;}
  .trow-info{flex:1;min-width:0;}
  .trow-name{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trow-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trow-meta{text-align:right;flex-shrink:0;}
  .trow-empty{padding:32px 18px;text-align:center;font-size:12px;color:var(--subtle);font-style:italic;}

  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.04em;white-space:nowrap;}
  .badge-green{background:var(--green-bg);color:var(--green-text);}
  .badge-amber{background:var(--amber-bg);color:var(--amber-text);}
  .badge-red{background:var(--red-bg);color:var(--red-text);}
  .badge-blue{background:var(--blue-bg);color:var(--blue-text);}
  .badge-gray{background:var(--surface3);color:#64748b;}
  .phase-badge-1{background:#fef2f2;color:#991b1b;}
  .phase-badge-2{background:#fffbeb;color:#92400e;}
  .phase-badge-3{background:#ecfdf5;color:#065f46;}
  .pc-status{font-size:9.5px;padding:2px 8px;border-radius:20px;font-weight:600;}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;cursor:pointer;transition:var(--t-base);position:relative;box-shadow:var(--shadow-xs);}
  .pcard:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-3px);}
  .pcard:hover .pc-accent{opacity:1;}
  .pc-accent{width:100%;height:2px;border-radius:1px;margin-bottom:14px;background:linear-gradient(90deg,var(--accent),#1a8fc4);opacity:.35;transition:opacity .2s;}
  .pc-del{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--border2);font-size:14px;cursor:pointer;padding:3px 6px;border-radius:var(--r-sm);transition:var(--t-fast);}
  .pc-del:hover{color:var(--red);background:var(--red-bg);}
  .pc-name{font-family:var(--font-serif);font-size:18px;color:var(--ink);margin-bottom:4px;padding-right:24px;font-weight:400;letter-spacing:-.01em;line-height:1.3;}
  .pc-diag{font-size:11px;color:var(--accent);margin-bottom:13px;font-weight:600;letter-spacing:.01em;}
  .pc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
  .pc-tag{font-size:10px;color:var(--muted);background:var(--surface3);padding:2px 8px;border-radius:4px;font-weight:500;}
  .phase-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;}
  .pc-bot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);}
  .pc-visits{font-size:10px;color:var(--muted);font-family:var(--font-mono);}

  /* ── DETAIL — TWO COLUMN DESKTOP LAYOUT ── */
  .det-layout{display:grid;grid-template-columns:1fr 270px;gap:24px;align-items:start;}
  .det-aside{position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;}
  .det-action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-xs);}
  .det-action-card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .det-action-card-body{padding:12px 16px;display:flex;flex-direction:column;gap:7px;}
  .det-action-btn{width:100%;padding:10px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);border:1px solid var(--border);background:var(--surface);color:var(--ink2);transition:var(--t-fast);text-align:left;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .det-action-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
  .det-action-btn.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 1px 3px rgba(13,155,138,.25);}
  .det-action-btn.primary:hover{background:var(--accent2);border-color:var(--accent2);}
  .det-action-btn.danger{color:var(--red);border-color:#fca5a5;}
  .det-action-btn.danger:hover{background:var(--red-bg);}

  /* ── FORM SCREENS — CONTEXT HEADER ── */
  .form-screen-wrap{min-height:100vh;background:var(--surface2);}
  .form-screen-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:52px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;}
  .form-screen-header .fsh-back{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--font);padding:0;transition:color .15s;}
  .form-screen-header .fsh-back:hover{color:var(--accent);}
  .form-screen-header .fsh-sep{color:var(--border2);font-size:14px;}
  .form-screen-header .fsh-title{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em;}
  .form-screen-header .fsh-sub{font-size:11px;color:var(--muted);margin-left:4px;}
  .form-screen-body{max-width:740px;margin:0 auto;padding:32px 32px 80px;}
  .form-screen-body.narrow{max-width:580px;}
  .form-screen-body.wide{max-width:920px;}

  @media(max-width:960px){
    .det-layout{grid-template-columns:1fr;}
    .det-aside{position:static;}
    .form-screen-header{padding:0 16px;height:48px;}
    .form-screen-body{padding:20px 16px 64px;}
  }

  .det-hdr{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-xs);}
  .det-name{font-family:var(--font-serif);font-size:24px;color:var(--ink);font-weight:400;letter-spacing:-.02em;margin-bottom:3px;line-height:1.2;}

  /* ── CONSENT BLOCK ── */

  .vlbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:700;}
  .vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-xs);transition:var(--t-fast);}

  .vhdr{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:var(--t-fast);}

  .vdate{font-size:13px;color:var(--ink);font-weight:600;letter-spacing:-.01em;}
  .vexs{font-size:11px;color:var(--muted);margin-top:2px;}

  .vbody{padding:0 18px 18px;border-top:1px solid var(--border);}

  .vex-item:last-child{border-bottom:none;}
  .vex-num{font-family:var(--font-mono);font-size:10px;color:var(--subtle);}
  .vex-name{color:var(--ink);font-weight:500;}
  .vex-dose{font-family:var(--font-mono);font-size:10px;color:var(--muted);}

  .soap-card{margin-top:12px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-xs);}
  .soap-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);}
  .soap-card-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .soap-card-icd{font-family:var(--font-mono);font-size:10px;color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:20px;}
  .soap-row{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:11.5px;align-items:baseline;}

  .soap-l{font-family:var(--font-mono);font-size:9px;font-weight:700;width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .soap-l.S{background:#dbeafe;color:#1d4ed8;}
  .soap-l.O{background:#dcfce7;color:#166534;}
  .soap-l.A{background:#fef9c3;color:#854d0e;}
  .soap-l.P{background:#f3e8ff;color:#6b21a8;}

  .cx{max-width:1100px;margin:0 auto;padding:32px 36px 80px;}
  .fwrap{max-width:640px;margin:0 auto;padding:36px 0 80px;}
  .msoap-wrap{max-width:800px;margin:0 auto;padding:32px 0 80px;}
  .form-screen-body{max-width:640px;margin:0 auto;padding:32px 0 80px;}
  .form-screen-body.wide{max-width:860px;}
  .ftitle{font-family:var(--font-serif);font-size:25px;color:var(--ink);margin-bottom:4px;font-weight:400;letter-spacing:-.02em;}
  .fsub{color:var(--muted);font-size:12px;margin-bottom:24px;line-height:1.65;}
  .slabel{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;margin-top:20px;display:block;font-weight:700;}
  .field{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 13px;color:var(--ink);font-size:13px;font-family:var(--font);outline:none;transition:var(--t-fast);}

  .sllbl{font-size:12px;color:#475569;}
  .slval{font-size:13px;font-weight:700;font-family:var(--font-mono);color:var(--ink);}
  input[type=range]{width:100%;accent-color:var(--accent);}

  .chip.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:700;}
  .hint{font-size:11px;color:var(--muted);margin-bottom:5px;line-height:1.65;}
  .genbtn{width:100%;margin-top:22px;padding:14px;background:var(--ink);border:none;border-radius:var(--r-md);font-family:var(--font-serif);font-size:17px;color:white;cursor:pointer;letter-spacing:.01em;font-weight:400;transition:var(--t-fast);}
  .genbtn:hover:not(:disabled){background:var(--ink2);transform:translateY(-1px);box-shadow:var(--shadow-lg);}
  .genbtn:disabled{opacity:.35;cursor:not-allowed;}
  .errbox{background:var(--red-bg);border:1.5px solid #fca5a5;border-radius:var(--r-sm);padding:10px 14px;color:var(--red-text);margin-bottom:14px;font-size:12px;}

  .ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;}
  .ldtitle{font-family:var(--font-serif);font-size:21px;color:var(--ink);font-weight:400;letter-spacing:-.02em;}

  .ld-progress{width:240px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:10px 0;}
  .ld-bar{height:100%;background:linear-gradient(90deg,var(--accent),#1a8fc4);border-radius:2px;transition:width .5s ease;}

  .search-wrap{position:relative;}

  .search-inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:10px 14px 10px 38px;color:var(--ink);font-size:13px;font-family:var(--font);outline:none;transition:var(--t-fast);}
  .search-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .list-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:12px;}
  .list-title{font-family:var(--font-serif);font-size:25px;color:var(--ink);font-weight:400;letter-spacing:-.02em;}
  .list-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .empty{text-align:center;padding:72px 20px;}
  .empty-title{font-family:var(--font-serif);font-size:21px;color:var(--subtle);margin-bottom:14px;font-weight:400;}

  .swrap{max-width:480px;margin:0 auto;padding:32px 36px 80px;}
  .stitle{font-family:var(--font-serif);font-size:25px;color:var(--ink);font-weight:400;margin-bottom:4px;letter-spacing:-.02em;}
  .ssub{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.65;}
  .akwrap{position:relative;margin-bottom:8px;}
  .akinp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 44px 10px 13px;color:var(--ink);font-size:13px;font-family:var(--font-mono);outline:none;}
  .akinp:focus{border-color:var(--accent);}
  .aktgl{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:var(--font);}
  .akst{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:6px;}
  .akdot{width:6px;height:6px;border-radius:50%;}
  .akhint{font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:13px;}
  .akhint a{color:var(--accent);}
  .svconf{font-size:11px;color:var(--green);margin-left:10px;opacity:0;transition:opacity .3s;}
  .svconf.show{opacity:1;}

  .modal-ov{display:none;position:fixed;inset:0;background:rgba(8,12,22,.65);align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px);}
  .modal-ov.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;max-width:380px;width:90%;box-shadow:var(--shadow-xl);animation:scaleIn .2s ease;}
  .modal-title{font-family:var(--font-serif);font-size:21px;color:var(--ink);margin-bottom:7px;font-weight:400;letter-spacing:-.02em;}
  .modal-text{font-size:13px;color:#64748b;line-height:1.65;margin-bottom:20px;}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;}

  .meet-wrap{max-width:700px;margin:0 auto;padding:24px 28px 80px;}
  .meet-consent{background:white;border:1.5px solid var(--border);border-radius:var(--r-xl);padding:28px 32px;margin-top:24px;box-shadow:var(--shadow-sm);}
  .meet-consent-title{font-family:var(--font-serif);font-size:20px;color:var(--ink);margin-bottom:10px;font-weight:400;letter-spacing:-.01em;}
  .meet-consent-txt{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:20px;}
  .meet-consent-btn{display:flex;gap:9px;flex-direction:column;}
  .meet-title{font-family:var(--font-serif);font-size:23px;color:var(--ink);font-weight:400;margin-bottom:3px;letter-spacing:-.02em;}
  .meet-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}

  /* Status bar */
  .meet-status{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);margin-bottom:16px;}
  .meet-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--subtle);}
  .meet-status-dot.idle{background:var(--subtle);}
  .meet-status-dot.listening{background:#22c55e;animation:glow 1.5s ease-in-out infinite;}
  .meet-status-dot.processing{background:var(--amber);animation:pulse .6s infinite;}
  .meet-status-txt{font-size:12.5px;color:var(--ink);flex:1;}
  .meet-timer{font-family:var(--font-mono);font-size:13px;color:var(--muted);letter-spacing:.05em;}

  /* Transcript */
  .transcript-box{background:white;border:1.5px solid var(--border);border-radius:var(--r-lg);min-height:160px;max-height:320px;overflow-y:auto;padding:14px 16px;margin-bottom:16px;scroll-behavior:smooth;}
  .transcript-line{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--surface2);font-size:13px;line-height:1.6;}
  .transcript-line:last-child{border-bottom:none;}
  .tl-time{font-family:var(--font-mono);font-size:10px;color:var(--subtle);flex-shrink:0;padding-top:3px;min-width:36px;}
  .tl-text{color:var(--ink);flex:1;}
  .tl-text.interim{color:var(--muted);font-style:italic;}

  /* Control buttons */
  .meet-controls{margin-bottom:16px;}
  .rec-btn{width:100%;padding:13px 20px;border-radius:var(--r-md);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);border:none;transition:var(--t-fast);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;}
  .rec-btn.start{background:var(--accent);color:white;}
  .rec-btn.start:hover{background:var(--accent2);box-shadow:0 4px 16px rgba(13,155,138,.3);}
  .rec-btn.stop{background:#fef2f2;color:#dc2626;border:1.5px solid #fca5a5;}
  .rec-btn.stop:hover{background:#dc2626;color:white;border-color:#dc2626;}

  /* Notes */
  .meet-note-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;font-weight:700;}
  .meet-note{width:100%;border:1.5px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:13px;font-family:var(--font);color:var(--ink);line-height:1.65;resize:vertical;min-height:80px;outline:none;transition:border-color .15s;background:white;margin-bottom:16px;}
  .meet-note:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}

  /* Done button */
  .meet-done-btn{width:100%;padding:14px 20px;background:var(--ink);color:white;border:none;border-radius:var(--r-lg);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:var(--t-fast);letter-spacing:-.01em;margin-top:8px;}
  .meet-done-btn:hover{background:var(--accent);box-shadow:0 4px 20px rgba(13,155,138,.35);}
  .meet-done-btn:disabled{opacity:.4;cursor:not-allowed;}
  .meet-done-hint{font-size:10px;color:var(--muted);margin-top:7px;text-align:center;}

  .meet-panel{background:white;border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-xs);}
  .meet-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:var(--surface2);border-bottom:1px solid var(--border);}

  .meet-panel-body{padding:13px 15px;}
  .clinical-hint{padding:10px 13px;background:var(--accent-light);border:1px solid rgba(13,155,138,.2);border-radius:var(--r-sm);font-size:12px;color:var(--accent3);margin-bottom:9px;line-height:1.6;}
  .clinical-hint-urgent{padding:10px 13px;background:#fef2f2;border:1px solid #fca5a5;border-radius:var(--r-sm);font-size:12px;color:#dc2626;margin-bottom:9px;line-height:1.6;}

  /* Transcript on patient card */
  .visit-transcript-block{margin-top:10px;border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .visit-transcript-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;background:var(--surface2);cursor:pointer;user-select:none;}
  .visit-transcript-hdr-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .visit-transcript-body{padding:12px 14px;display:none;}
  .visit-transcript-body.open{display:block;}
  .vt-line{display:flex;gap:9px;padding:3px 0;font-size:12px;border-bottom:1px solid var(--surface2);}
  .vt-line:last-child{border-bottom:none;}
  .vt-time{font-family:var(--font-mono);font-size:10px;color:var(--subtle);flex-shrink:0;min-width:34px;padding-top:2px;}
  .vt-text{color:var(--ink);line-height:1.55;flex:1;}

  .soap-editor-ta{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 13px;font-size:13px;font-family:var(--font);color:var(--ink);line-height:1.65;resize:vertical;min-height:80px;outline:none;transition:border-color .15s;background:var(--surface);}
  .soap-editor-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .soap-section-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;margin-top:18px;display:block;font-weight:700;}

  .ee-list{margin-bottom:16px;}

  .ee-item.ul{border-color:var(--border);background:var(--surface);}
  .ee-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;flex-shrink:0;border:1.5px solid;}
  .lk .ee-num{background:white;color:var(--accent);border-color:var(--accent);}
  .ul .ee-num{background:var(--surface3);color:var(--muted);border-color:var(--border);}
  .ee-info{flex:1;}
  .ee-name{font-size:13px;font-weight:500;}
  .lk .ee-name{color:var(--ink);}
  .ul .ee-name{color:var(--muted);}
  .ee-dose{font-size:10px;color:var(--muted);margin-top:2px;font-family:var(--font-mono);}
  .ee-st{font-size:9px;margin-top:2px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;}
  .lk .ee-st{color:var(--accent);}
  .ul .ee-st{color:var(--muted);}
  .lkbtn{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid;font-family:var(--font);}
  .lkbtn.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
  .lkbtn.off{border-color:var(--border);background:var(--surface3);color:var(--muted);}
  .rinfo{background:var(--accent-dim);border:1.5px solid var(--accent);border-radius:var(--r-sm);padding:8px 14px;font-size:12px;color:var(--accent);text-align:center;margin-bottom:14px;font-weight:600;}

  .pub-loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:14px;}
  .zp-hero{background:linear-gradient(160deg,var(--ink) 0%,var(--ink2) 60%,#0d2437 100%);padding:32px 22px;color:white;position:relative;overflow:hidden;}

  .zp-hero-name{font-family:var(--font-serif);font-size:27px;font-weight:400;margin-bottom:5px;letter-spacing:-.02em;}
  .zp-hero-diag{font-size:13px;color:rgba(255,255,255,.55);font-style:italic;}
  .zp-section{padding:18px 16px 0;}
  .zp-section-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}
  .zp-ex-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow-xs);}
  .zp-ex-hdr{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;}
  .zp-ex-num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);}
  .zp-ex-name{font-size:13px;font-weight:600;color:var(--ink);flex:1;letter-spacing:-.01em;}
  .zp-ex-dose{font-size:11px;color:var(--muted);font-family:var(--font-mono);}

  .zp-footer{text-align:center;padding:22px;font-size:11px;color:var(--subtle);}

  /* ── PAYWALL ── */
  .zp-paywall{min-height:100vh;background:#080e18;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  .zp-paywall-logo{height:22px;opacity:.55;margin-bottom:40px;}
  .zp-paywall-eyebrow{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(13,155,138,.8);margin-bottom:14px;text-align:center;}
  .zp-paywall-title{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:300;color:white;text-align:center;line-height:1.2;letter-spacing:-.02em;margin-bottom:10px;max-width:320px;}
  .zp-paywall-sub{font-size:13px;color:rgba(255,255,255,.4);text-align:center;line-height:1.7;margin-bottom:36px;max-width:300px;}
  .zp-plan-cards{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
  .zp-plan-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);border-radius:16px;padding:18px 20px;cursor:pointer;transition:border-color .2s,background .2s;position:relative;text-decoration:none;display:block;}
  .zp-plan-card:hover{border-color:rgba(13,155,138,.5);background:rgba(13,155,138,.07);}
  .zp-plan-card.featured{border-color:rgba(13,155,138,.45);background:rgba(13,155,138,.1);}
  .zp-plan-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#0d9b8a;color:white;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 12px;border-radius:20px;white-space:nowrap;}
  .zp-plan-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);margin-bottom:3px;}
  .zp-plan-desc{font-size:11px;color:rgba(255,255,255,.38);margin-bottom:12px;line-height:1.5;}
  .zp-plan-price{font-size:26px;font-weight:700;color:white;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;}
  .zp-plan-price span{font-size:12px;font-weight:400;color:rgba(255,255,255,.4);margin-left:3px;}
  .zp-plan-features{margin-top:12px;display:flex;flex-direction:column;gap:5px;}
  .zp-plan-feat{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:7px;}
  .zp-plan-feat::before{content:'';width:5px;height:5px;border-radius:50%;background:rgba(13,155,138,.7);flex-shrink:0;}
  .zp-paywall-note{font-size:11px;color:rgba(255,255,255,.22);text-align:center;line-height:1.7;max-width:280px;}

  /* ── PAYMENT STATUS BADGE IN ADMIN ── */
  .pay-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
  .pay-badge.free{background:#eef5ff;color:#3a6aaa;}
  .pay-badge.active{background:#e6f7f5;color:#0d7a6a;}
  .pay-badge.expired{background:#fff0f0;color:#b03030;}
  .pay-badge.manual{background:#fff8e6;color:#8a5a00;}

  /* ── PER-EXERCISE CHECK ── */
  .zp-excard{background:var(--surface);border:1.5px solid var(--border);border-radius:13px;margin-bottom:9px;overflow:hidden;transition:border-color .2s,background .2s;}
  .zp-excard.done{border-color:rgba(13,155,138,.35);background:rgba(13,155,138,.03);}
  .zp-exhdr{display:flex;align-items:center;gap:0;padding:0;cursor:default;}
  .zp-exhdr-tap{display:flex;align-items:center;gap:13px;padding:14px 0 14px 16px;flex:1;min-width:0;cursor:pointer;}
  .zp-exnum{width:28px;height:28px;border-radius:50%;background:var(--ink);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);transition:background .2s;}
  .zp-excard.done .zp-exnum{background:var(--accent);}
  .zp-chevron{color:var(--subtle);font-size:16px;transition:transform .2s;flex-shrink:0;padding:14px 8px 14px 4px;}
  .zp-exhdr.open .zp-chevron{transform:rotate(90deg);}
  .zp-exbody{padding:0 16px 16px;border-top:1px solid var(--border);display:none;}
  .zp-exbody.open{display:block;}

  .zp-check-btn{width:44px;height:100%;min-height:56px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 12px 0 4px;-webkit-tap-highlight-color:transparent;}
  .zp-check-ring{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:border-color .18s,background .18s;background:transparent;}
  .zp-check-btn:hover .zp-check-ring,.zp-check-btn:active .zp-check-ring{border-color:var(--accent);}
  .zp-check-ring.checked{border-color:var(--accent);background:var(--accent);}
  .zp-check-ring svg{opacity:0;transition:opacity .15s;transform:scale(.8);transition:opacity .15s,transform .15s;}
  .zp-check-ring.checked svg{opacity:1;transform:scale(1);}

  /* ── SESSION PROGRESS STRIP ── */
  .zp-session-strip{margin:0 14px 12px;border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--border);}
  .zp-session-strip.active{border-color:rgba(13,155,138,.3);background:rgba(13,155,138,.04);}
  .zp-session-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .zp-session-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;}
  .zp-session-count{font-size:13px;font-weight:700;color:var(--ink);font-family:var(--font-mono);}
  .zp-session-count.done{color:var(--accent);}
  .zp-session-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .zp-session-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#1ab8a0);border-radius:3px;transition:width .3s ease;}

  .topbar{display:none;}
  .ham-menu{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:300;}
  .ham-backdrop{position:absolute;inset:0;background:rgba(8,12,22,.65);backdrop-filter:blur(5px);}
  .ham-panel{position:absolute;top:0;right:0;bottom:0;width:268px;background:var(--sb);padding:22px 16px;overflow-y:auto;}

  .sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--sb-text);padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.05);}
  .sync-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .sync-dot.error{background:var(--red);}
  .sync-dot.syncing{animation:pulse .6s infinite;background:var(--amber);}

  .diag-edit-ov{position:fixed;inset:0;background:rgba(8,12,22,.65);display:flex;align-items:center;justify-content:center;z-index:600;backdrop-filter:blur(6px);}
  .progress-note-ov{position:fixed;inset:0;background:rgba(8,12,22,.65);display:flex;align-items:flex-end;justify-content:center;z-index:600;backdrop-filter:blur(6px);}
  #dict-modal{z-index:700;}
  #prompt-editor-ov{z-index:800;}

  .pjdoc-section{margin-bottom:20px;}
  .pjdoc-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:700;}
  .pjdoc-text{font-size:13px;color:#334155;line-height:1.75;white-space:pre-wrap;}

  .sbs-col{flex:1;min-width:0;}
  .sbs-col-hdr{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);border-radius:var(--r-md) var(--r-md) 0 0;}

  .insight-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;}
  .insight-fill{height:100%;background:linear-gradient(90deg,var(--accent),#1a8fc4);border-radius:3px;}

  .npf-backdrop{position:fixed;inset:0;background:rgba(8,12,22,.65);z-index:400;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
  .npf-sheet{position:relative;z-index:1;background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:scaleIn .18s ease;}
  .npf-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0;}
  .npf-title{font-family:var(--font-serif);font-size:21px;color:var(--ink);font-weight:400;letter-spacing:-.02em;}
  .npf-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .npf-header{padding:10px 26px 20px;border-bottom:1px solid var(--border);}
  .npf-body{padding:20px 26px;}
  .npf-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:700;display:block;}
  .npf-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .npf-input{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;font-family:var(--font);color:var(--ink);background:var(--surface2);box-sizing:border-box;transition:var(--t-fast);outline:none;}
  .npf-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);background:var(--surface);}
  .npf-input::placeholder{color:var(--subtle);}
  .npf-footer{padding:0 26px 36px;display:flex;flex-direction:column;gap:9px;}
  .npf-btn-primary{background:var(--ink);color:white;border:none;border-radius:var(--r-md);padding:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:var(--t-fast);letter-spacing:-.01em;}
  .npf-btn-primary:hover{background:var(--ink2);transform:translateY(-1px);}
  .npf-btn-ghost{background:transparent;border:1.5px solid var(--border);border-radius:var(--r-md);padding:12px;font-size:13px;color:#64748b;cursor:pointer;font-family:var(--font);transition:var(--t-fast);}
  .npf-btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .npf-err{font-size:11px;color:var(--red-text);margin-bottom:9px;display:none;padding:9px 13px;background:var(--red-bg);border-radius:var(--r-sm);}

  .note-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;margin-top:14px;display:block;font-weight:700;}
  .note-inp{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:10px 13px;font-size:13px;font-family:var(--font);color:var(--ink);line-height:1.65;resize:vertical;min-height:72px;outline:none;transition:border-color .15s;background:var(--surface);}
  .note-inp:focus{border-color:var(--accent);}
  .srow{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .slbl{font-size:11px;color:var(--muted);font-weight:600;min-width:56px;}
  .ssel{flex:1;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:7px 11px;font-size:12px;font-family:var(--font);color:var(--ink);background:var(--surface);outline:none;cursor:pointer;}
  .ssel:focus{border-color:var(--accent);}

  .anomaly-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-xs);}
  .anomaly-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border);}
  .anomaly-title{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase;}
  .anomaly-item{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--t-fast);}
  .anomaly-item:last-child{border-bottom:none;}
  .anomaly-item:hover{background:var(--surface2);}

  @media(max-width:960px){
    .nav-sidebar{transform:translateX(-100%);}
    .nav-sidebar.open{transform:translateX(0);}
    .main-content{margin-left:0;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 4px;height:54px;background:var(--sb);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--sb-border);}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .dash-grid{grid-template-columns:1fr 1fr;}
    .dash-grid-2{grid-template-columns:1fr;}
    .dash-kpis{grid-template-columns:repeat(2,1fr);}
    .det-layout{grid-template-columns:1fr;}
    .det-aside{position:static;}
    .cx{padding:16px 16px 56px;}
    .meet-wrap{padding:20px 16px 56px;}
    .msoap-wrap{padding:20px 16px 56px;}
    .swrap{padding:20px 16px 56px;}
    .fwrap{padding:20px 16px 56px;}
  }
  @media(max-width:600px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .pgrid{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:1fr;}
    .dash-kpis{grid-template-columns:1fr 1fr;}
    .npf-row{grid-template-columns:1fr;}
    .cx{padding:14px 14px 56px;}
    .meet-wrap,.msoap-wrap,.fwrap,.swrap{padding:16px 14px 56px;}
  }
  @media print{
    .nav-sidebar,.topbar,.dcontrols{display:none!important;}
    .main-content{margin-left:0!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    .pjdoc-section{page-break-inside:avoid;}
  }

  /* ── INBOX SYSTEM ────────────────────────────────────────────────────────── */
  @keyframes inbox-slide-in { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes inbox-item-in  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .inbox-btn {
    position:relative; background:none; border:none; cursor:pointer;
    padding:7px; display:flex; align-items:center; justify-content:center;
    border-radius:8px; transition:background .15s;
  }
  .inbox-btn:hover { background:rgba(255,255,255,.1); }
  .inbox-btn svg { width:18px;height:18px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
  .inbox-badge {
    position:absolute; top:2px; right:2px;
    min-width:16px; height:16px; border-radius:8px;
    background:var(--red); color:white;
    font-size:9px; font-weight:700; line-height:16px;
    text-align:center; padding:0 4px;
    border:2px solid var(--sb);
  }
  .inbox-drawer {
    position:fixed; top:0; right:0; bottom:0; width:380px; max-width:100vw;
    background:var(--surface); border-left:1.5px solid var(--border);
    box-shadow:-8px 0 40px rgba(0,0,0,.15);
    z-index:600; display:flex; flex-direction:column;
    animation:inbox-slide-in .22s cubic-bezier(.22,1,.36,1) both;
  }
  .inbox-overlay { position:fixed;inset:0;z-index:599;background:rgba(0,0,0,.3); }
  .inbox-hdr {
    padding:18px 18px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .inbox-title { font-size:15px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
  .inbox-subtitle { font-size:11px; color:var(--muted); margin-top:2px; }
  .inbox-close {
    background:none;border:none;cursor:pointer;padding:6px;
    color:var(--muted);font-size:20px;line-height:1;border-radius:6px;
    transition:background .15s;
  }
  .inbox-close:hover { background:var(--surface3); }
  .inbox-tabs {
    display:flex; border-bottom:1px solid var(--border);
    flex-shrink:0; padding:0 14px;
  }
  .inbox-tab {
    padding:10px 12px; font-size:12px; font-weight:600; color:var(--muted);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .15s; white-space:nowrap; background:none; border-top:none;
    border-left:none; border-right:none; font-family:var(--font);
  }
  .inbox-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .inbox-body { flex:1; overflow-y:auto; padding:12px; }
  .inbox-item {
    border-radius:var(--r-md); border:1.5px solid var(--border);
    margin-bottom:10px; overflow:hidden; background:var(--surface);
    transition:border-color .15s, box-shadow .15s;
    animation:inbox-item-in .2s ease both;
  }
  .inbox-item.urgent { border-color:rgba(229,57,53,.3); background:var(--red-bg); }
  .inbox-item.ai-action { border-color:rgba(13,155,138,.2); background:rgba(13,155,138,.02); }
  .inbox-item.read { opacity:.6; }
  .inbox-item-hdr {
    padding:12px 13px 8px; display:flex; align-items:flex-start; gap:10px; cursor:pointer;
  }
  .inbox-item-hdr:hover { background:rgba(0,0,0,.02); }
  .inbox-item-icon {
    width:30px; height:30px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .inbox-item-icon svg { width:14px;height:14px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
  .inbox-item-content { flex:1; min-width:0; }
  .inbox-item-title { font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:2px; line-height:1.4; }
  .inbox-item-sub { font-size:11px; color:var(--muted); line-height:1.5; }
  .inbox-item-time { font-size:10px; color:var(--subtle); white-space:nowrap; margin-top:1px; }
  .inbox-item-actions { padding:0 13px 12px; display:flex; gap:6px; flex-wrap:wrap; }
  .inbox-act-btn {
    font-size:11px; font-weight:600; padding:5px 12px; border-radius:20px;
    cursor:pointer; font-family:var(--font); transition:all .15s; border:1.5px solid;
  }
  .inbox-act-primary { background:var(--ink); color:white; border-color:var(--ink); }
  .inbox-act-primary:hover { background:var(--accent); border-color:var(--accent); }
  .inbox-act-secondary { background:transparent; color:var(--ink); border-color:var(--border2); }
  .inbox-act-secondary:hover { border-color:var(--accent); color:var(--accent); }
  .inbox-act-ghost { background:transparent; color:var(--muted); border-color:transparent; font-size:10px; padding:5px 6px; }
  .inbox-act-ghost:hover { color:var(--red); }
  .inbox-ai-tag {
    display:inline-flex; align-items:center; gap:4px;
    font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent2); background:var(--accent-light);
    padding:2px 7px; border-radius:10px; margin-bottom:6px;
  }
  .inbox-empty {
    text-align:center; padding:52px 24px; color:var(--muted);
  }
  .inbox-empty svg { width:36px;height:36px;stroke:var(--border2);fill:none;stroke-width:1.5;margin:0 auto 14px;display:block; }
  .inbox-empty-title { font-size:14px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
  .inbox-empty-sub { font-size:12px; line-height:1.7; }

  /* ── AI BRIEFING ─────────────────────────────────────────────────────────── */
  @keyframes briefing-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes briefing-shimmer {
    0%{background-position:-200% 0} 100%{background-position:200% 0}
  }
  .briefing-wrap {
    margin-bottom:16px;
    border-radius:var(--r-lg);
    overflow:hidden;
    border:1.5px solid rgba(13,155,138,.2);
    animation:briefing-in .35s ease both;
  }
  .briefing-loading {
    background:linear-gradient(90deg,var(--accent-light) 25%,rgba(13,155,138,.08) 50%,var(--accent-light) 75%);
    background-size:200% 100%;
    animation:briefing-shimmer 1.4s ease infinite;
    padding:18px 18px;
    font-size:12px;color:var(--accent2);font-weight:500;
    display:flex;align-items:center;gap:10px;
  }
  .briefing-ready {
    background:linear-gradient(135deg,rgba(13,155,138,.06) 0%,rgba(13,155,138,.02) 100%);
  }
  .briefing-hdr {
    padding:13px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(13,155,138,.12);
    cursor:pointer;
  }
  .briefing-hdr-left {
    display:flex;align-items:center;gap:9px;
  }
  .briefing-icon {
    width:28px;height:28px;border-radius:8px;
    background:rgba(13,155,138,.15);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .briefing-icon svg { width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
  .briefing-title {
    font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent2);
  }
  .briefing-ts {
    font-size:10px;color:var(--muted);
  }
  .briefing-body { padding:14px 16px 16px; }
  .briefing-points { display:flex;flex-direction:column;gap:9px; }
  .briefing-point {
    display:flex;align-items:flex-start;gap:10px;
    font-size:13px;line-height:1.6;color:var(--ink);
  }
  .briefing-dot {
    width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px;
  }
  .briefing-dot.green  { background:var(--green); }
  .briefing-dot.amber  { background:var(--amber); }

const SB_URL = 'https://wyahrvaqqufkjogamckm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5YWhydmFxcXVma2pvZ2FtY2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3Mjg4MTUsImV4cCI6MjA4ODMwNDgxNX0.9GZM4hUO1qqDxxxLuFpv-yiZzSMoSC9cDG8a02ApX5c';

function sbHeaders() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,

function setSyncStatus(s, msg) {
  _syncStatus = s;
  const colors = {idle:'rgba(255,255,255,0.4)', syncing:'#f0c040', ok:'#60d080', error:'#f07060'};
  const html = msg ? `<span style="color:${colors[s]||colors.idle};font-size:11px">${msg}</span>` : '';

async function sbUpsertPat(pat) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients', {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ id: pat.id, data: pat, updated_at: new Date().toISOString() })
    });
    return res.ok;
  } catch(e) { return false; }
}

async function sbDeletePat(id) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders()
    });
    return res.ok;
  } catch(e) { return false; }
}

async function sbLoadAll() {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients?select=id,data,updated_at&order=updated_at.desc', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.map(r => {
      if (!r.data) return null;
      try {
        return typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
      } catch { return null; }
    }).filter(Boolean);
  } catch(e) { return null; }
}

// Keep Supabase project alive — ping once per session so free tier doesn't pause
// Supabase pauses after 7 days inactivity; this fires on every therapist login
async function sbKeepAlive() {
  try {
    const lastPing = localStorage.getItem('zenya:last-sb-ping');
    const now = Date.now();
    // Only ping if we haven't pinged in the last 24 hours
    if (lastPing && now - parseInt(lastPing) < 24 * 60 * 60 * 1000) return;
    await fetch(SB_URL + '/rest/v1/patients?select=id&limit=1', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    localStorage.setItem('zenya:last-sb-ping', String(now));
  } catch(e) {} // silent — never block app
}


async function syncToCloud() {
  if (_sbSyncing) return;
  _sbSyncing = true;
  setSyncStatus('syncing', 'Sparar...');
  let ok = true;
  for (const p of S.patients) {
    const r = await sbUpsertPat(p);
    if (!r) { ok = false; break; }
  }
  _sbSyncing = false;
  if (ok) {
    setSyncStatus('ok', 'Synkad');
    setTimeout(() => setSyncStatus('idle', ''), 3000);
  } else {
    setSyncStatus('error', 'Synkfel');
  }
}

async function syncFromCloud() {
  setSyncStatus('syncing', 'Hämtar...');
  const cloudPats = await sbLoadAll();
  if (!cloudPats) { setSyncStatus('error', 'Anslutningsfel'); return; }

  // Merge: newer wins, but never overwrite local data that has visits/plans with empty cloud
  const local = {};
  S.patients.forEach(p => local[p.id] = p);

  cloudPats.forEach(cp => {
    if (!cp || !cp.id) return;
    const lp = local[cp.id];
    if (!lp) {
      local[cp.id] = cp;
      try { localStorage.setItem('kansei-data:'+cp.id, JSON.stringify(cp)); } catch {}
    } else {
      const cloudNewer = (cp.updatedAt||0) > (lp.updatedAt||0);
      const localHasMoreData = (lp.visits||[]).length > (cp.visits||[]).length;
      if (cloudNewer && !localHasMoreData) {
        // Cloud is newer and not losing visits — use cloud
        local[cp.id] = cp;
        try { localStorage.setItem('kansei-data:'+cp.id, JSON.stringify(cp)); } catch {}
      } else if (cloudNewer && localHasMoreData) {
        // Cloud is newer but local has more visits — merge visits from both
        const cloudVisitIds = new Set((cp.visits||[]).map(v=>v.id));
        const extraLocalVisits = (lp.visits||[]).filter(v=>!cloudVisitIds.has(v.id));
        const merged = {...cp, visits:[...(cp.visits||[]), ...extraLocalVisits]
          .sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))};
        local[cp.id] = merged;
        try { localStorage.setItem('kansei-data:'+cp.id, JSON.stringify(merged)); } catch {}
      }
      // else: local is newer, keep local (already in local[])
    }
  });

  S.patients = Object.values(local).sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0));
  setSyncStatus('ok', cloudPats.length + ' patienter');
  setTimeout(() => setSyncStatus('idle', ''), 3000);

  // Re-render current screen
  if (S.screen === 'dashboard') rDashboard();
  else if (S.screen === 'list') rList();

  // Run inbox agent on fresh data
  setTimeout(() => runInboxAgent(S.patients), 500);
}

// stripe link key: `${tierId}_${lengthId}` e.g. 'bas_month', 'standard_quarter'
function getStripeLinks() {
  try { return JSON.parse(localStorage.getItem(STRIPE_LINKS_KEY)||'{}'); } catch { return {}; }
}
function saveStripeLinks(obj) {
  try { localStorage.setItem(STRIPE_LINKS_KEY, JSON.stringify(obj)); } catch {}
}
function saveStripeLinksFromUI() {
  const links = {};
  Object.keys(PAYMENT_TIERS).forEach(tid => {
    Object.keys(PAYMENT_LENGTHS).forEach(lid => {
      const key = tid + '_' + lid;
      const val = document.getElementById('stripe-' + key)?.value?.trim();
      if (val) links[key] = val;
    });
  });
  saveStripeLinks(links);

  if (s) { s.style.opacity = 1; setTimeout(() => s.style.opacity = 0, 2000); }

// Returns {ok, tier, features:[], expiresAt, freeUntil}
function zpCheckAccess(visit) {
  if (!visit) return { ok: false, tier: 'expired', features: [] };
  if (visit.accessOverride === 'unlimited') {
    const t = PAYMENT_TIERS[visit.paymentTier] || PAYMENT_TIERS.pro;
    return { ok: true, tier: 'manual', features: t.features };
  }
  if (visit.paidUntil && new Date(visit.paidUntil) > new Date()) {
    const t = PAYMENT_TIERS[visit.paymentTier];
    return { ok: true, tier: visit.paymentTier || 'bas', features: t ? t.features : ['stats','ai_messages'], expiresAt: visit.paidUntil };
  }
  const followupWeeks = visit.form?.followup || 4;
  if (visit.date) {
    const freeEnd = new Date(visit.date);
    freeEnd.setDate(freeEnd.getDate() + followupWeeks * 7);
    if (freeEnd > new Date()) return { ok: true, tier: 'free', features: [], freeUntil: freeEnd.toISOString() };
    return { ok: false, tier: 'expired', features: [], expiredAt: freeEnd.toISOString() };
  }
  return { ok: true, tier: 'free', features: [] };
}

// Quick helper — use anywhere in plan rendering
function zpHasFeature(visit, feature) {
  const a = zpCheckAccess(visit);
  return a.features.includes(feature);
}

// Build Stripe Payment Link URL: tierId_lengthId e.g. 'standard_quarter'
function zpPaymentUrl(tierLengthKey, patId, visitId) {
  const links = getStripeLinks();
  const base = links[tierLengthKey];
  if (!base) return null;
  const ref = encodeURIComponent(patId + ':' + visitId + ':' + tierLengthKey);
  return base + (base.includes('?') ? '&' : '?') + 'client_reference_id=' + ref;
}

// Returns {ok, tier, expiresAt, freeUntil}
function zpCheckAccess(visit) {
  if (!visit) return { ok: false };
  // Manual override — admin set paidUntil directly
  if (visit.accessOverride === 'unlimited') return { ok: true, tier: 'manual' };
  // Paid subscription active
  if (visit.paidUntil && new Date(visit.paidUntil) > new Date()) {
    return { ok: true, tier: visit.paymentTier || 'paid', expiresAt: visit.paidUntil };
  }
  // Free period: visit.date + followup weeks
  const followupWeeks = visit.form?.followup || 4;
  if (visit.date) {
    const freeEnd = new Date(visit.date);
    freeEnd.setDate(freeEnd.getDate() + followupWeeks * 7);
    if (freeEnd > new Date()) return { ok: true, tier: 'free', freeUntil: freeEnd.toISOString() };
    return { ok: false, tier: 'expired', expiredAt: freeEnd.toISOString() };
  }
  // No date set — always free
  return { ok: true, tier: 'free' };
}

// Build Stripe Payment Link URL with patient metadata
function zpPaymentUrl(planId, patId, visitId) {
  const links = getStripeLinks();
  const base = links[planId];
  if (!base) return null;
  const ref = encodeURIComponent(patId + ':' + visitId + ':' + planId);
  return base + (base.includes('?') ? '&' : '?') + 'client_reference_id=' + ref;
}

function parseBirthdate(val) {
  if (!val) return '';
  val = val.trim().replace(/\s/g,'');
  if (/^\d{6}$/.test(val)) {
    const yy = parseInt(val.slice(0,2));
    const yyyy = yy <= (new Date().getFullYear() % 100) ? 2000+yy : 1900+yy;
    return yyyy + '-' + val.slice(2,4) + '-' + val.slice(4,6);
  }
  if (/^\d{8}$/.test(val)) return val.slice(0,4)+'-'+val.slice(4,6)+'-'+val.slice(6,8);
  if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  return val;
}
function birthdateToYear(bd) {
  if (!bd) return 1980;
  const m = (bd+'').match(/^(\d{4})/);
  return m ? parseInt(m[1]) : 1980;
}

function savePat(p){
  const u={...p,updatedAt:Date.now()};
  // Write to ALL key formats so loadPats always finds it
  try{localStorage.setItem('kansei-data:'+u.id, JSON.stringify(u));}catch{}
  try{localStorage.setItem('pat:'+u.id, JSON.stringify(u));}catch{}
  try{localStorage.setItem(u.id, JSON.stringify(u));}catch{}
  const i=S.patients.findIndex(x=>x.id===u.id);
  if(i>=0)S.patients[i]=u;else S.patients.unshift(u);
  S.patients.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  markUnsaved();
  // Sync to Supabase in background
  sbUpsertPat(u).then(ok => {
    if(ok) setSyncStatus('ok','Sparad');
    else setSyncStatus('error','Synkfel');
    setTimeout(()=>setSyncStatus('idle',''),3000);
  });
  return u;
}
function loadPats(){
  const seen=new Set();
  const pats=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k)continue;
    // Match ALL patient key formats: kansei-data:xxx, pat:xxx, pat_xxx, kpat_xxx
    const isPatKey=k.startsWith('kansei-data:')||k.startsWith('pat:')||
                   (k.startsWith('pat_')&&!k.includes(':'))||
                   (k.startsWith('kpat_')&&!k.includes(':'));
    if(isPatKey){
      try{
        const v=localStorage.getItem(k);
        if(!v)continue;
        const p=JSON.parse(v);
        if(p&&p.id&&typeof p.id==='string'&&!seen.has(p.id)){
          seen.add(p.id);pats.push(p);
        }
      }catch{}
    }
  }
  S.patients=pats;
  S.patients.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  // Re-save under canonical key so future loads are consistent
  S.patients.forEach(p=>{try{localStorage.setItem('kansei-data:'+p.id,JSON.stringify(p));}catch{}});
}

// Create a new inbox item
// type: 'urgent' | 'ai_action' | 'info'
// category: 'pain_spike' | 'low_completion' | 'inactivity' | 'patient_reply' | 'plan_adjusted' | 'plan_progressed' | 'message_sent' | 'flag'
function addInboxItem(patId, patName, type, category, title, body, actions) {
  const items = getInbox();
  // Deduplicate — don't add same category for same patient within 24h
  const recent = items.find(x =>
    x.patId === patId && x.category === category &&
    Date.now() - x.ts < 24*60*60*1000
  );
  if (recent) return;
  const item = {
    id: 'ibx_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    patId, patName, type, category, title, body,
    actions: actions || [],
    ts: Date.now(),
    read: false,
  };
  items.unshift(item);
  // Keep max 100 items
  if (items.length > 100) items.splice(100);
  saveInbox(items);
  updateInboxBadge();
}

function markInboxRead(id) {
  const items = getInbox();
  const item = items.find(x => x.id === id);
  if (item) { item.read = true; saveInbox(items); updateInboxBadge(); }
}

function deleteInboxItem(id) {
  const items = getInbox().filter(x => x.id !== id);
  saveInbox(items); updateInboxBadge(); renderInboxDrawer();
}

function markAllRead() {
  const items = getInbox().map(x => ({...x, read:true}));
  saveInbox(items); updateInboxBadge(); renderInboxDrawer();

function getUnreadCount() {
  return getInbox().filter(x => !x.read && x.type !== 'info').length;

}

  const iconColor = isUrgent ? 'var(--red)' : 'var(--muted)';
  const iconBg    = isUrgent ? 'var(--red-bg)' : 'var(--surface3)';

  const actBtns = (item.actions||[]).map(a =>
    `<button class="inbox-act-btn inbox-act-${a.style||'secondary'}"
      onclick="inboxAction('${e(item.id)}','${e(a.fn)}')">${e(a.label)}</button>`
  ).join('');

  const delBtn = `<button class="inbox-act-btn inbox-act-ghost" onclick="event.stopPropagation();deleteInboxItem('${e(item.id)}')">Ta bort</button>`;

  const aiTag = isAiAction
    ? `<div class="inbox-ai-tag">AI agerade automatiskt</div>`
    : '';

  return `<div class="inbox-item ${isUrgent?'urgent':isAiAction?'ai-action':''} ${item.read?'read':''}"
    style="animation-delay:${idx*0.04}s">
    <div class="inbox-item-hdr" onclick="markInboxRead('${e(item.id)}');inboxOpenPatient('${e(item.patId)}')">

        <svg viewBox="0 0 24 24" stroke="${iconColor}" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${svg}</svg>

        ${aiTag}

      </div>
      <div class="inbox-item-time">${timeStr}</div>
    </div>
    ${actBtns || delBtn ? `<div class="inbox-item-actions">${actBtns}${delBtn}</div>` : ''}
  </div>`;
}

function formatInboxTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60*1000) return 'Just nu';
  if (diff < 60*60*1000) return Math.floor(diff/60000) + ' min';
  if (diff < 24*60*60*1000) return Math.floor(diff/3600000) + ' h';
  return new Date(ts).toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
}

function inboxOpenPatient(patId) {
  closeInbox();
  const p = S.patients.find(x => x.id === patId);
  if (p) { S.pat = p; go('detail'); }
}

function inboxAction(itemId, fnName) {
  markInboxRead(itemId);
  // fnName is a safe pre-defined string, not user input
  const safeFns = {
    'openDetail': () => { const item = getInbox().find(x=>x.id===itemId); if(item) inboxOpenPatient(item.patId); },
    'markRead':   () => { markInboxRead(itemId); renderInboxDrawer(); },
  };
  // For patId-scoped actions stored as 'fnname:patId:visitId'
  const [fn, patId, visitId] = fnName.split(':');
  if (fn === 'openDetail' && patId) {
    closeInbox();
    const p = S.patients.find(x => x.id === patId);
    if (p) { S.pat = p; go('detail'); }
  } else if (fn === 'adjustPlan' && patId && visitId) {
    closeInbox();
    const p = S.patients.find(x => x.id === patId);
    if (p) { S.pat = p; S.visitId = visitId; go('detail');
      setTimeout(() => analyzePlanAdjustment(patId, visitId), 400); }
  } else if (fn === 'openMsg' && patId) {
    closeInbox();
    const p = S.patients.find(x => x.id === patId);
    if (p) { S.pat = p; go('detail');
      setTimeout(() => { togMsgPanel(patId); }, 400); }
  } else if (safeFns[fn]) {
    safeFns[fn]();
  }
  renderInboxDrawer();
}

// ── AI AGENT — scans patients and creates inbox items ─────────────────────────

const AGENT_LAST_RUN_KEY = 'zenya:agent-last-run';

async function runInboxAgent(patients) {
  if (!getKey()) return;
  const lastRun = parseInt(localStorage.getItem(AGENT_LAST_RUN_KEY) || '0');
  // Run at most every 5 minutes to avoid hammering
  if (Date.now() - lastRun < 5 * 60 * 1000) {
    updateInboxBadge(); return;
  }
  localStorage.setItem(AGENT_LAST_RUN_KEY, String(Date.now()));

  for (const p of patients) {
    if (!(p.visits||[]).length) continue;
    await _agentScanPatient(p);
  }
  updateInboxBadge();
}

async function _agentScanPatient(p) {
  const logs = getPassLogs(p.id);
  const recentLogs = logs.slice(0, 7);
  const lastVisit  = p.visits?.[0];
  if (!lastVisit) return;

  // ── 1. PAIN SPIKE ─────────────────────────────────────────────────────────
  if (recentLogs.length >= 2) {
    const latest3 = recentLogs.slice(0, 3);
    const avgLatest = latest3.reduce((s,l) => s+(l.pain||0), 0) / latest3.length;
    const older = recentLogs.slice(3, 6);
    if (older.length) {
      const avgOlder = older.reduce((s,l) => s+(l.pain||0), 0) / older.length;
      if (avgLatest >= 7 || (avgLatest - avgOlder >= 2.5)) {
        addInboxItem(p.id, p.name, 'urgent', 'pain_spike',
          'Smärtökning detekterad',
          `Snittsmärta ${avgLatest.toFixed(1)}/10 senaste passen — ${older.length ? 'upp från ' + avgOlder.toFixed(1) : 'kritisk nivå'}`,
          [
            { label:'Öppna kundkort', style:'primary', fn:`openDetail:${p.id}` },
            { label:'Justera plan', style:'secondary', fn:`adjustPlan:${p.id}:${lastVisit.id}` },
          ]
        );
      }
    }
  }

  // ── 2. LOW COMPLETION ─────────────────────────────────────────────────────
  if (recentLogs.length >= 3) {
    const lowCount = recentLogs.slice(0,5).filter(l => l.done === 'few' || l.done === 'partial' || l.done === 'none').length;
    const rate = Math.round(lowCount / Math.min(recentLogs.length, 5) * 100);
    if (rate >= 60) {
      // AI auto-response: send encouragement, log as ai_action
      const alreadySent = (p.messages||[]).some(m =>
        m.type === 'ai_compliance' && Date.now() - new Date(m.ts).getTime() < 3*24*60*60*1000
      );
      if (!alreadySent) {
        await _agentSendComplianceMsg(p, rate);
      }
      addInboxItem(p.id, p.name, 'ai_action', 'low_completion',
        'Låg genomförandegrad — AI skickade uppmuntran',
        `${rate}% av senaste passen ofullständiga. AI har skickat meddelande.`,
        [{ label:'Granska meddelande', style:'secondary', fn:`openMsg:${p.id}` }]
      );
    }
  }

  // ── 3. INACTIVITY — auto-send message after 4+ days ─────────────────────
  if (recentLogs.length > 0) {
    const lastLog = recentLogs[0];
    const daysSince = Math.round((Date.now() - new Date(lastLog.ts||lastLog.date).getTime()) / (1000*60*60*24));
    if (daysSince >= 4) {
      const alreadySent = (p.messages||[]).some(m =>
        m.type === 'ai_inactivity' && Date.now() - new Date(m.ts).getTime() < 4*24*60*60*1000
      );
      if (!alreadySent) await _agentSendInactivityMsg(p, daysSince);
      if (daysSince >= 5) {
        addInboxItem(p.id, p.name, 'urgent', 'inactivity',
          `Inget loggat pass på ${daysSince} dagar`,
          'Patienten har inte rapporterat hemträning på ett tag.',
          [
            { label:'Skicka påminnelse', style:'primary', fn:`openMsg:${p.id}` },
            { label:'Öppna kundkort', style:'secondary', fn:`openDetail:${p.id}` },
          ]
        );
      }
    }
  }

  // ── 3b. PAIN SPIKE — auto-send check-in ──────────────────────────────────
  if (recentLogs.length >= 2) {
    const latest3 = recentLogs.slice(0, 3);
    const avgLatest = latest3.reduce((s,l) => s+(l.pain||0), 0) / latest3.length;
    if (avgLatest >= 7) {
      const alreadySent = (p.messages||[]).some(m =>
        m.type === 'ai_pain_checkin' && Date.now() - new Date(m.ts).getTime() < 3*24*60*60*1000
      );
      if (!alreadySent) await _agentSendPainCheckIn(p, avgLatest);
    }
  }

  // ── 3c. UPCOMING FOLLOWUP — remind 3 days before ─────────────────────────
  if (lastVisit?.form?.followup && lastVisit.date) {
    const followupDate = new Date(lastVisit.date);
    followupDate.setDate(followupDate.getDate() + (lastVisit.form.followup * 7));
    const daysUntil = Math.round((followupDate - Date.now()) / (1000*60*60*24));
    if (daysUntil >= 0 && daysUntil <= 3) {
      const alreadySent = (p.messages||[]).some(m =>
        m.type === 'ai_followup_reminder' && Date.now() - new Date(m.ts).getTime() < 4*24*60*60*1000
      );
      if (!alreadySent) await _agentSendFollowupReminder(p, daysUntil);
    }
  }

  // ── 4. PATIENT REPLY "FRÅGA HAR" ─────────────────────────────────────────
  const pendingQuestion = (p.messages||[]).find(m =>
    m.from === 'patient' && m.text === 'Jag har en fråga' && !m.read
  );
  if (pendingQuestion) {
    addInboxItem(p.id, p.name, 'urgent', 'patient_reply',
      'Patient har en fråga',
      'Patienten svarade "Fråga har" — kräver din uppmärksamhet.',
      [{ label:'Svara nu', style:'primary', fn:`openMsg:${p.id}` }]
    );
  }

  // ── 5. AUTO-PROGRESS — pain consistently low ─────────────────────────────
  if (recentLogs.length >= 4) {
    const last4 = recentLogs.slice(0, 4);
    const allLow = last4.every(l => (l.pain||10) <= 3);
    const allDone = last4.filter(l => l.done === 'all').length >= 3;
    if (allLow && allDone && lastVisit?.plan) {
      const alreadyProgressed = lastVisit.plan._agentProgressed &&
        Date.now() - new Date(lastVisit.plan._agentProgressed).getTime() < 7*24*60*60*1000;
      if (!alreadyProgressed) {
        await _agentProgressPlan(p, lastVisit);
      }
    }
  }
}
