async function applyPlanAdjustment(patId, visitId, resultEncoded) {
  const result = JSON.parse(decodeURIComponent(resultEncoded));
  const pat = S.patients.find(p=>p.id===patId)||S.pat;
  const visit = (pat?.visits||[]).find(v=>v.id===visitId);
  if (!pat||!visit?.plan) return;

  const key = getKey();
  const plan = {...visit.plan};
  let exercises = [...(plan.exercises||[])];

  // Collect add/replace types that need AI to generate new exercise details
  const needsGeneration = (result.adjustments||[]).filter(a=>a.type==='add'||a.type==='replace');

  // If we need new exercises, generate them first
  if (needsGeneration.length > 0 && key) {
    const loadOv = document.createElement('div');
    loadOv.style.cssText = 'position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;background:rgba(10,20,35,.6)';
    loadOv.innerHTML = `<div style="background:white;border-radius:12px;padding:24px 28px;text-align:center;max-width:300px">
      <div style="width:28px;height:28px;border:3px solid #dde6ee;border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px"></div>
      <div style="font-size:14px;font-weight:600;color:var(--navy)">Genererar nya övningar...</div>
    </div>`;
    document.body.appendChild(loadOv);

    try {
      const genPrompt = `Du är fysioterapeut. Generera detaljerade övningar för en rehabplan. Returnera ENBART giltig JSON utan backticks.

Patient: ${pat.name}, ${pat.diagnosis||''}
Befintliga övningar att ersätta/lägga till för:
${needsGeneration.map(a=>`- ${a.exerciseName}: ${a.change} (${a.reason})`).join('\n')}

För varje övning, returnera:
{"exercises":[{"name":"namn","purpose":"anatomisk motivering","whyThisForYou":"personlig förklaring","level":1,"startPosition":"position","steps":["steg1","steg2","steg3","steg4"],"sets":3,"reps":"10","rest":"60 sek","tip":"säkerhetsanmärkning","correctFeel":"känsla"}]}`;

      const res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({model:MODEL_HAIKU,max_tokens:1200,system:'Svara ALLTID med giltig JSON.',messages:[{role:'user',content:genPrompt}]})
      });
      const d = await res.json();
      const genResult = JSON.parse((d.content||[]).map(b=>b.text||'').join('').replace(/```json|```/g,'').trim());
      const newExercises = genResult.exercises||[];

      // Apply replace/add with generated data
      let genIdx = 0;
      needsGeneration.forEach(adj => {
        const newEx = newExercises[genIdx++];
        if (!newEx) return;
        if (adj.type==='replace' && exercises[adj.exerciseIndex]) {
          exercises[adj.exerciseIndex] = {...newEx, adjustmentNote:adj.change, adjustedAt:new Date().toISOString()};
        } else if (adj.type==='add') {
          exercises.push({...newEx, adjustmentNote:adj.change, adjustedAt:new Date().toISOString()});
        }
      });
    } catch(err) {
      console.warn('Exercise generation failed:', err);
    }
    loadOv.remove();
  }

  // Apply increase/decrease/remove adjustments
  (result.adjustments||[]).filter(a=>a.type!=='add'&&a.type!=='replace').forEach(adj => {
    const idx = adj.exerciseIndex;
    if ((adj.type==='increase'||adj.type==='decrease') && exercises[idx]) {
      exercises[idx] = {...exercises[idx], adjustmentNote:adj.change, adjustedAt:new Date().toISOString()};
      // Parse "3×15" or "3 set × 15 reps"
      const setsMatch = adj.change.match(/(\d+)\s*[×xX\*]\s*(\d+)/);
      if (setsMatch) { exercises[idx].sets=parseInt(setsMatch[1]); exercises[idx].reps=setsMatch[2]; }
      // Parse level change
      const levelMatch = adj.change.match(/nivå\s*(\d)/i);
      if (levelMatch) exercises[idx].level = parseInt(levelMatch[1]);
      // Parse rest
      const restMatch = adj.change.match(/(\d+)\s*sek\s*vila/i);
      if (restMatch) exercises[idx].rest = restMatch[1]+' sek';
    } else if (adj.type==='remove' && exercises[idx]) {
      exercises.splice(idx, 1);
    }
  });

  plan.exercises = exercises;

  // Apply patient message
  if (result.messageToPatient) {
    plan.therapistMessage = result.messageToPatient;
    plan.therapistMessageDate = new Date().toISOString();
  }

  plan.lastAdjusted = new Date().toISOString();
  plan.lastAdjustmentSummary = result.summary;

  const updPat = {...pat, visits:(pat.visits||[]).map(v=>v.id===visitId?{...v,plan}:v)};
  const saved = savePat(updPat);
  if (S.pat?.id===patId) { S.pat=saved; if(S.visitId===visitId) S.plan=plan; }

  document.getElementById('plan-adj-result-ov')?.remove();
  showAutoSaveToast('Plan uppdaterad — synlig för patienten direkt');
  rDetail();
}



async function loadPublicPlan(patId, visitId) {
  const el = document.getElementById('s-public-plan');
  if (!el) return;

  // In-memory cache
  try {
    if (_publicPlanCache && _publicPlanCache.patId === patId && _publicPlanCache.visitId === visitId) {
      renderPublicPlan(_publicPlanCache.plan, _publicPlanCache.pat);
      return;
    }
  } catch(e) { /* ignore cache check errors */ }

  el.innerHTML = `<div class="pub-loading">
    <div style="margin-bottom:12px">Hämtar din Hael-plan...</div>
    <div style="font-size:12px;color:#aaa">Ansluter till server — kan ta några sekunder</div>
  </div>`;

  // Helper: fetch with timeout
  async function fetchWithTimeout(url, opts, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try {
      const r = await fetch(url, { ...opts, signal: ctrl.signal });
      clearTimeout(t);
      return r;
    } catch(e) { clearTimeout(t); throw e; }
  }

  // 1. Try Supabase with 8s timeout
  try {
    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/patients?id=eq.${encodeURIComponent(patId)}&select=data`,
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } },
      8000
    );
    if (r.ok) {
      const rows = await r.json();
      if (rows && rows.length > 0 && rows[0].data) {
        const raw = rows[0].data;
        const pat = typeof raw === 'string' ? JSON.parse(raw) : raw;
        const visit = (pat?.visits||[]).find(v => v.id === visitId);
        if (visit?.plan) {
          // ── ACCESS CHECK ───────────────────────────────────────────────
          const access = zpCheckAccess(visit);
          if (!access.ok) {
            zpRenderPaywall(patId, visitId, pat);
            return;
          }
          // ───────────────────────────────────────────────────────────────
          _publicPlanCache = { patId, visitId, plan: visit.plan, pat };
          renderPublicPlan(visit.plan, pat);
          return;
        }
        // Fallback: visitId not found or plan missing — try most recent visit that has a plan
        const fallbackVisit = (pat?.visits||[]).find(v => v.plan && v.plan.exercises?.length > 0);
        if (fallbackVisit?.plan) {
          const access = zpCheckAccess(fallbackVisit);
          if (!access.ok) { zpRenderPaywall(patId, fallbackVisit.id, pat); return; }
          console.warn('visitId mismatch — using fallback visit', fallbackVisit.id, 'expected', visitId);
          _publicPlanCache = { patId, visitId: fallbackVisit.id, plan: fallbackVisit.plan, pat };
          renderPublicPlan(fallbackVisit.plan, pat);
          return;
        }
        // Nothing found — show diagnostic
        const visitIds = (pat?.visits||[]).map(v=>v.id).join(', ') || 'inga besök';
        el.innerHTML = `<div style="text-align:center;padding:80px 24px;font-family:var(--font)">
          <div style="font-family:var(--font-serif);font-size:26px;color:#0f2744;margin-bottom:12px">Plan ej tillgänglig</div>
          <div style="font-size:14px;color:#8a9aaa;line-height:1.7;margin-bottom:16px">Patienten hittades men ingen Hael-plan finns sparad i molnet.<br>Be behandlaren trycka "Ladda upp alla" i Inställningar och skicka länken igen.</div>
          <div style="font-size:10px;color:#bbb;font-family:monospace">visit=${visitId}<br>found=${visitIds}</div>
        </div>`;
        return;
      }
    }
  } catch(e) {
    console.warn('Supabase fetch failed:', e.name === 'AbortError' ? 'Timeout' : e.message);
  }

  // 2. Fallback: localStorage (same device)
  try {
    const raw = localStorage.getItem('kansei-data:' + patId);
    if (raw) {
      const pat = JSON.parse(raw);
      const visit = (pat?.visits||[]).find(v => v.id === visitId);
      if (visit?.plan) {
        _publicPlanCache = { patId, visitId, plan: visit.plan, pat };
        renderPublicPlan(visit.plan, pat);
        return;
      }
    }
  } catch(e) { console.warn('localStorage fallback failed:', e); }

  // 3. Nothing worked
  el.innerHTML = `<div style="text-align:center;padding:80px 24px;font-family:var(--font)">
    <div style="font-family:var(--font-serif);font-size:26px;color:#0f2744;margin-bottom:12px">Kunde inte ladda planen</div>
    <div style="font-size:14px;color:#8a9aaa;line-height:1.7;margin-bottom:24px">
      Kontrollera att du är online och försök igen.<br>
      Om problemet kvarstår, kontakta din behandlare.
    </div>
    <button onclick="loadPublicPlan('${patId.replace(/'/g,"\\'")}','${visitId.replace(/'/g,"\\'")}');"
      style="background:#0f2744;color:white;border:none;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font)">
      Försök igen
    </button>
  </div>`;
}

function renderPublicPlanProgressGraph(pat) {
  const visits = (pat.visits||[]).slice().reverse(); // oldest first
  const pts = visits.filter(v => v.form?.pain != null);
  if (pts.length < 2) return '';
  const W = 300, H = 56, PAD = 10;
  const n = pts.length;
  const xs = pts.map((_,i) => PAD + (i/(n-1))*(W-PAD*2));
  const ys = pts.map(v => PAD + ((10-v.form.pain)/10)*(H-PAD*2));
  const polyPts = xs.map((x,i) => `${x},${ys[i]}`).join(' ');
  const first = pts[0].form.pain, last = pts[pts.length-1].form.pain;
  const trend = last < first ? '#4a9860' : last > first ? '#c07070' : '#4a9aaa';
  const arrow = last < first ? '↓ Smärtan minskar' : last > first ? '↑ Smärtan ökar' : '→ Oförändrad';
  const diff = Math.abs(last - first);
  let dots = '';
  pts.forEach((v,i) => {
    dots += `<circle cx="${xs[i]}" cy="${ys[i]}" r="4" fill="${trend}" opacity=".9"/>`;
    if (i===0||i===n-1) {
      const anc = i===0?'start':'end';
      dots += `<text x="${xs[i]}" y="${H+2}" text-anchor="${anc}" font-size="9" fill="rgba(255,255,255,.7)" font-weight="700">${v.form.pain}/10</text>`;
      dots += `<text x="${xs[i]}" y="${H+13}" text-anchor="${anc}" font-size="8" fill="rgba(255,255,255,.4)">${v.date||''}</text>`;
    }
  });
  return `<div style="margin:12px 14px 0;background:var(--navy);border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <div style="font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px">Din smärtutveckling (NRS)</div>
    <div style="font-size:13px;font-weight:600;margin-bottom:12px" style="color:${trend}">
      <span style="color:${trend}">${arrow}${diff>0?' · '+diff+' enheter':''}</span>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H+18}" style="overflow:visible">
      <polyline points="${polyPts}" fill="none" stroke="${trend}" stroke-width="2.5" stroke-linejoin="round" opacity=".8"/>
      ${dots}
    </svg>
  </div>`;
}

function pubToggleEx(btn) {

// ── PER-EXERCISE SESSION LOGGING ──────────────────────────────────────────
function _zpSessionKey(patId, visitId) {
  const today = new Date().toISOString().slice(0,10);
  return 'zenya:exsession:' + patId + ':' + visitId + ':' + today;
}

function zpInitSession(patId, visitId, total) {
  let state = {};
  try { state = JSON.parse(localStorage.getItem(_zpSessionKey(patId, visitId)) || '{}'); } catch(e) {}
  const doneCount = Object.values(state).filter(Boolean).length;
  // Restore checked state for each exercise
  for (let i = 0; i < total; i++) {
    if (state[i]) _zpApplyCheck(i, true);
  }
  _zpUpdateStrip(doneCount, total);
}

function zpCheckEx(patId, visitId, idx, total) {
  // Load state
  const key = _zpSessionKey(patId, visitId);
  let state = {};
  try { state = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}

  // Toggle
  state[idx] = !state[idx];
  try { localStorage.setItem(key, JSON.stringify(state)); } catch(e) {}

  // Update UI
  _zpApplyCheck(idx, state[idx]);
  const doneCount = Object.values(state).filter(Boolean).length;
  _zpUpdateStrip(doneCount, total);

  // If all done — light up pass button
  if (doneCount === total) {
    const btn = document.getElementById('pub-pass-btn');
    if (btn && !btn.disabled) btn.classList.add('all-done');
    // Save completion data to session so pubLogPassDone can include it
    window._zpSessionState = { patId, visitId, state, total, completedAt: new Date().toISOString() };
  }
}

function _zpApplyCheck(idx, done) {
  const card = document.getElementById('zp-ex-' + idx);
  const ring = document.getElementById('zp-ring-' + idx);
  if (card) card.classList.toggle('done', done);
  if (ring) ring.classList.toggle('checked', done);
}

function _zpUpdateStrip(done, total) {
  const countEl = document.getElementById('zp-session-count');
  const barEl   = document.getElementById('zp-session-bar');
  const stripEl = document.getElementById('zp-session-strip');
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  if (countEl) {
    countEl.textContent = done + ' / ' + total;
    countEl.classList.toggle('done', done === total);
  }
  if (barEl) barEl.style.width = pct + '%';
  if (stripEl) stripEl.classList.toggle('active', done > 0);
}

// ── 1. SMART INTAG — Fri text → ifyllt formulär ───────────────────────────

function showSmartIntake() {
  const box = document.getElementById('smart-intake-box');
  if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

async function aiParseIntake() {
  const ta = document.getElementById('qi-textarea');
  const text = ta ? ta.value.trim() : '';
  if (!text) return;
  const key = getKey();
  if (!key) { alert('API-nyckel saknas.'); return; }
  const statusEl = document.getElementById('qi-status');
  if (statusEl) statusEl.textContent = 'Tolkar…';
  const btn = document.getElementById('qi-parse-btn');
  if (btn) btn.disabled = true;

  const prompt = `Du är en assistent som tolkar kliniska noteringar. Extrahera följande fält från texten nedan och svara ENBART med JSON utan backticks eller förklaringar.

Text: "${text}"

JSON-format (använd null om fältet inte finns):
{
  "name": "Patientens fullständiga namn",
  "birthdate": "Personnummer/födelsedatum i formatet YYYYMMDD eller YYYY-MM-DD, annars null",
  "diagnosis": "Närmaste match från listan: Ländryggssmärta, Nacksmärta/whiplash, Knäbesvär, Höftbesvär, Axelbesvär, Tennisarmbåge, Hälseneproblem, Plantarfasciit, Frozen shoulder, Spinal stenos, Diskbråck, Postoperativ rehab, Fibromyalgi, Osteoporos, Artros, Annan / fritext",
  "customDiag": "Om diagnosen är Annan / fritext, beskriv kort här annars null",
  "pain": 0-10 som heltal,
  "motivation": 1-10 som heltal (uppskatta om ej angett: 6),
  "history": "ingen" | "sporadisk" | "regelbunden",
  "knowledge": "låg" | "medel" | "hög",
  "location": "hem" | "gym",
  "followup": antal veckor som heltal (4 om ej angett),
  "exercises": antal övningar som heltal (5 om ej angett),
  "notes": "Övrig klinisk information som inte passar i ovanstående fält, annars tom sträng"
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:MODEL_HAIKU, max_tokens:600, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());

    if (parsed.name) S.form.name = parsed.name;
    if (parsed.birthdate) S.form.birthdate = parseBirthdate(parsed.birthdate);
    if (parsed.diagnosis) S.form.diagnosis = parsed.diagnosis;
    if (parsed.customDiag) S.form.customDiag = parsed.customDiag;
    if (parsed.pain != null) S.form.pain = parseInt(parsed.pain)||5;
    if (parsed.motivation != null) S.form.motivation = parseInt(parsed.motivation)||6;
    if (parsed.history) S.form.history = parsed.history;
    if (parsed.knowledge) S.form.knowledge = parsed.knowledge;
    if (parsed.location) S.form.location = parsed.location;
    if (parsed.followup) S.form.followup = parseInt(parsed.followup)||4;
    if (parsed.exercises) S.form.exercises = parseInt(parsed.exercises)||5;
    if (parsed.notes) S.form.notes = parsed.notes;

    if (statusEl) statusEl.textContent = 'Formulär ifyllt';
    rForm();
    showAutoSaveToast('Formulär ifyllt');
  } catch(err) {
    if (statusEl) statusEl.textContent = 'Fel — prova igen';
    console.error('Smart intake error:', err);
  }
  if (btn) btn.disabled = false;
}

// Generate SOAP draft from free text → preview modal → save to currentSOAP
async function aiGenerateSOAPFromIntake() {
  const ta = document.getElementById('qi-textarea');
  const text = ta ? ta.value.trim() : '';
  if (!text) { alert('Skriv eller diktera text först.'); return; }
  const key = getKey();
  if (!key) { alert('API-nyckel saknas.'); return; }

  const statusEl = document.getElementById('qi-status');
  const soapBtn = document.getElementById('qi-soap-btn');
  if (statusEl) statusEl.textContent = 'Genererar SOAP…';
  if (soapBtn) soapBtn.disabled = true;

  const prompt = `Du är leg. fysioterapeut. Omstrukturera nedanstående fritext till en klinisk SOAP-journalanteckning på svenska. Svara ENBART med JSON utan backticks.

Regler för klinisk terminologi:
- höger → dextra/dx, vänster → sinistra/sin
- framsida → anteriort, baksida → posteriort, insida → medialt, utsida → lateralt
- knäskål → patella, hälsena → tendo Achillis, inklämning → impingement
- menisk insida → medial menisk, menisk utsida → lateral menisk
- korsbandet fram → ACL (ligamentum cruciatum anterius), bak → PCL
- axelled → glenohumeralt, axelblad → scapula, nyckelben → clavicula
- rygg (länd) → lumbalt, rygg (bröst) → thorakalt, nacke → cervikalt
- Skriv löpande meningar i journalstil, inga liststrecken, inga rubriker inuti fälten
- Lägg bara information i det fält det hör hemma — hitta ingenting på
- Lämna fält som tom sträng om info saknas

Fritext: "${text}"

JSON:
{
  "S": "Subjektivt — patientens berättelse, symtom, smärtbeskrivning på klinisk svenska",
  "O": "Objektivt — undersökningsfynd, tester, rörelseomfång om angivet",
  "A": "Bedömning — klinisk diagnos med korrekt terminologi, funktionsnivå, ev differentialdiagnos",
  "P": "Plan — behandling, hemprogram, återbesök"
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL_HAIKU, max_tokens:900, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    const soap = JSON.parse(raw.replace(/```json|```/g,'').trim());
    if (statusEl) statusEl.textContent = '';
    openSOAPPreviewModal(soap);
  } catch(err) {
    if (statusEl) statusEl.textContent = 'Fel — prova igen';
    console.error('SOAP from intake error:', err);
  }
  if (soapBtn) soapBtn.disabled = false;
}

  ov.innerHTML = `

        <div style="font-size:11px;color:var(--text3)">AI har strukturerat och reformulerat din text kliniskt. Redigera innan du sparar.</div>
      </div>
      <button onclick="document.getElementById('soap-preview-ov').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1">×</button>

      <button onclick="saveSOAPDraftFromIntake()" style="flex:1;background:var(--navy);color:white;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">Spara som journalutkast →</button>
      <button onclick="document.getElementById('soap-preview-ov').remove()" style="background:none;border:1px solid var(--border);border-radius:9px;padding:12px 18px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text3)">Avbryt</button>
    </div>

function saveSOAPDraftFromIntake() {
  const soap = {};
  ['S','O','A','P'].forEach(l => {
    const ta = document.getElementById('soapp-'+l);
    if (ta) soap[l] = ta.value.trim();
  });
  // Store as journal draft in sessionStorage — same key as autoSaveJournalDraft
  const draftData = {
    patId: S.pat?.id || '',
    ts: Date.now(),
    soap,
    source: 'smart-intake'
  };
  try { sessionStorage.setItem('hael:journaldraft', JSON.stringify(draftData)); } catch {}
  // Also pre-fill currentSOAP if it exists
  if (typeof currentSOAP !== 'undefined' && currentSOAP) {
    currentSOAP.soap = {...(currentSOAP.soap||{}), ...soap};
  }
  document.getElementById('soap-preview-ov')?.remove();
  showAutoSaveToast('SOAP-utkast sparat');
}

let _qiSR = null;
function toggleQiDictation() {
  const btn = document.getElementById('qi-mic-btn');
  if (_qiSR) {
    _qiSR.stop(); _qiSR = null;
    if (btn) { btn.classList.remove('listening'); btn.innerHTML = '<span class="mic-btn-dot"></span> Diktera'; }
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Kräver Chrome.'); return; }
  const sr = new SR(); sr.lang='sv-SE'; sr.continuous=true; sr.interimResults=false;
  sr.onresult = ev => {
    const ta = document.getElementById('qi-textarea'); if (!ta) return;
    for (let i=ev.resultIndex;i<ev.results.length;i++) if (ev.results[i].isFinal) { ta.value += (ta.value?' ':'') + ev.results[i][0].transcript; }
  };
  sr.onend = () => { _qiSR=null; if(btn){btn.classList.remove('listening');btn.innerHTML='<span class="mic-btn-dot"></span> Diktera';} };
  sr.start(); _qiSR=sr;
  if (btn) { btn.classList.add('listening'); btn.innerHTML='<span class="mic-btn-dot"></span> Stoppa'; }
}

function markPromptDone(i) {
  const row = document.getElementById('dprow-'+i);
  const chk = document.getElementById('dpchk-'+i);
  if (!row || !chk) return;
  const done = row.dataset.done === '1';
  row.dataset.done = done ? '0' : '1';
  chk.style.background = done ? '' : 'var(--teal)';
  chk.style.borderColor = done ? '#b8c4d4' : 'var(--teal)';
  chk.innerHTML = done ? '' : '<svg width="9" height="7" viewBox="0 0 9 7"><polyline points="1,4 3.5,6.5 8,1" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  row.style.opacity = done ? '' : '.55';
}

function dictToggleRec() {
  const btn = document.getElementById('dict-rec-btn');
  const label = document.getElementById('dict-rec-label');
  const dot = document.getElementById('dict-rec-dot');

  if (_dictSR) {
    _dictSR.stop(); _dictSR = null;
    if (btn) { btn.style.background = '#1a5a3a'; }
    if (label) label.textContent = 'Fortsätt spela in';
    if (dot) { dot.style.background = 'white'; dot.style.animation = ''; }
    // Show AI and raw buttons if we have text
    const hasText = _dictRawText.trim().length > 0;
    const aiBtn = document.getElementById('dict-ai-btn');
    const rawBtn = document.getElementById('dict-raw-btn');
    if (aiBtn) aiBtn.style.display = hasText ? 'inline-flex' : 'none';
    if (rawBtn) rawBtn.style.display = hasText ? 'inline-flex' : 'none';
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Röstinmatning kräver Chrome på desktop.'); return; }
  const sr = new SR();
  sr.lang = 'sv-SE';
  sr.continuous = true;
  sr.interimResults = true;
  sr.onresult = (ev) => {
    const liveEl = document.getElementById('dict-live');
    const interimEl = document.getElementById('dict-interim');
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) {
        _dictRawText += ((_dictRawText && !_dictRawText.endsWith(' ')) ? ' ' : '') + ev.results[i][0].transcript;
        if (liveEl) liveEl.textContent = _dictRawText;
        if (interimEl) interimEl.textContent = '';
      } else {
        interim += ev.results[i][0].transcript;
      }
    }
    if (interimEl) interimEl.textContent = interim;
  };
  sr.onend = () => {
    if (_dictSR) return; // was manually stopped
    const aiBtn = document.getElementById('dict-ai-btn');
    const rawBtn = document.getElementById('dict-raw-btn');
    if (_dictRawText.trim()) {
      if (aiBtn) aiBtn.style.display = 'inline-flex';
      if (rawBtn) rawBtn.style.display = 'inline-flex';
    }
    if (label) label.textContent = 'Spela in igen';
    if (btn) btn.style.background = '#1a5a3a';
    if (dot) { dot.style.animation = ''; }
  };
  sr.start();
  _dictSR = sr;
  if (btn) btn.style.background = '#8a2020';
  if (label) label.textContent = 'Stoppa inspelning';
  if (dot) dot.style.animation = 'pulse 1s infinite';
  const aiBtn = document.getElementById('dict-ai-btn');
  if (aiBtn) aiBtn.style.display = 'none';
  const rawBtn2 = document.getElementById('dict-raw-btn');
  if (rawBtn2) rawBtn2.style.display = 'none';
  const previewWrap = document.getElementById('dict-preview-wrap');
  if (previewWrap) previewWrap.style.display = 'none';
  const insertBtn = document.getElementById('dict-insert-btn');
  if (insertBtn) insertBtn.style.display = 'none';
}

async function dictReformulate(letter) {
  const text = _dictRawText.trim();
  if (!text) return;
  const key = getKey();
  if (!key) { alert('API-nyckel saknas.'); return; }
  const statusEl = document.getElementById('dict-ai-status');
  const aiBtn = document.getElementById('dict-ai-btn');
  const insertBtn = document.getElementById('dict-insert-btn');
  const previewWrap = document.getElementById('dict-preview-wrap');
  const previewTa = document.getElementById('dict-preview-ta');
  if (statusEl) statusEl.textContent = 'Omformulerar…';
  if (aiBtn) aiBtn.disabled = true;

  const sectionName = {S:'Subjektivt (patientens berättelse)',O:'Objektivt (undersökningsfynd)',A:'Bedömning (diagnos och prognos)',P:'Plan (åtgärder och uppföljning)'}[letter];
  const prompt = `Du är leg. fysioterapeut som skriver kliniska journalanteckningar. Nedanstående text är en rösttranskription — den kan innehålla talspråk, taligenkänningsfel, dialektala uttryck eller ofullständiga meningar. Producera alltid en klinisk text utan att kommentera transkriptionskvaliteten.

Instruktioner:
- Tolka sannolika kliniska innebörder även vid fel (t.ex. "hösena"→tendo Achillis, "diskbrock"→diskbråck, "insidan knät"→medialt om genu)
- Anatomiska termer: höger→dextra/dx, vänster→sinistra/sin, framsida→anteriort, baksida→posteriort, insida→medialt, utsida→lateralt, knäskål→patella, hälsena→tendo Achillis, inklämning→impingement, menisk insida→medial menisk, korsbandet fram→ACL, bak→PCL, axelled→glenohumeralt, nacke→cervikalt, ländrygg→lumbalt, bröstrygg→thorakalt
- Journalstil: löpande meningar, direkt ton, inga rubriker
- Sektion: ${sectionName}
- Svara ENBART med den kliniska texten — ingen inledning, inga kommentarer

Transkription: "${text}"`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL_HAIKU, max_tokens:600, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const result = (data.content||[]).map(b=>b.text||'').join('').trim();
    if (previewWrap) previewWrap.style.display = 'block';
    if (previewTa) { previewTa.value = result; setTimeout(()=>{ previewTa.style.height='auto'; previewTa.style.height=previewTa.scrollHeight+'px'; },50); }
    if (insertBtn) insertBtn.style.display = 'inline-flex';
    if (statusEl) statusEl.textContent = '';
  } catch(err) {
    if (statusEl) statusEl.textContent = 'Fel — prova igen';
  }
  if (aiBtn) aiBtn.disabled = false;
}

function detectAnomalies(patients) {
  const alerts = [];
  const now = new Date();

  patients.forEach(p => {
    const visits = (p.visits||[]);
    if (!visits.length) return;

    const latestVisit = visits[0];
    const latestPain = latestVisit.form?.pain ?? latestVisit.soapMeta?.pain;
    const latestDate = latestVisit.date ? new Date(latestVisit.date) : null;

    // 1. NRS ökar mellan senaste besöken
    if (visits.length >= 2) {
      const prevPain = visits[1].form?.pain ?? visits[1].soapMeta?.pain;
      if (latestPain != null && prevPain != null && latestPain - prevPain >= 3) {
        alerts.push({pat:p, icon:'high', msg:`NRS ökade ${prevPain}→${latestPain} sedan förra besöket`, tag:'Smärtökning', tagColor:'#fde8e8', tagText:'#8a2020', severity:2});
      }
    }

    // 2. Tre besök i rad utan förbättring
    if (visits.length >= 3) {
      const pains = visits.slice(0,3).map(v => v.form?.pain ?? v.soapMeta?.pain).filter(x=>x!=null);
      if (pains.length === 3 && pains[0] >= pains[1] && pains[1] >= pains[2] && pains[0] >= 5) {
        alerts.push({pat:p, icon:'med', msg:`NRS stagnerad/ökande tre besök i rad (${[...pains].reverse().join('→')})`, tag:'Ingen progress', tagColor:'#fdf3d8', tagText:'#7a5000', severity:2});
      }
    }

    // 3. Missat återbesök >60 dagar
    if (latestDate) {
      const fw = latestVisit.form?.followup || 4;
      const dueDate = new Date(latestDate); dueDate.setDate(dueDate.getDate() + fw * 7);
      const overdueDays = Math.round((now - dueDate) / (1000*60*60*24));
      if (overdueDays > 60) {
        alerts.push({pat:p, icon:'low', msg:`Återbesök ${overdueDays} dagar försenat (planerat ${dueDate.toLocaleDateString('sv-SE')})`, tag:'Försenat', tagColor:'#e8f0fe', tagText:'#1a3a8a', severity:1});
      }
    }

    // 4. Hög smärta (≥8) utan plan
    if (latestPain >= 8 && !latestVisit.plan) {
      alerts.push({pat:p, icon:'crit', msg:`Smärta NRS ${latestPain}/10 — ingen Hael-plan skapad`, tag:'Åtgärd krävs', tagColor:'#fde8e8', tagText:'#8a2020', severity:3});
    }
  });

  // Sort by severity
  return alerts.sort((a,b) => b.severity - a.severity).slice(0,8);
}

function renderPlanReviewSection(patients) {
  // Find visits with active plans that have enough check-in data to warrant review
  const reviews = [];
  (patients||[]).forEach(pat => {
    (pat.visits||[]).filter(v=>v.plan).forEach(v => {
      const logs = getPassLogs(pat.id).filter(l=>l.visitId===v.id);
      if (logs.length < 2) return;
      const recent = logs.slice(0,5);
      const avgPain = recent.reduce((s,l)=>s+(l.pain||0),0)/recent.length;
      const lowCompletion = recent.filter(l=>l.done==='few'||l.done==='partial').length >= 2;
      const highPain = avgPain >= 6;
      const painRising = recent.length>=3 && recent[0].pain > recent[recent.length-1].pain + 1;
      const canProgress = avgPain <= 3 && recent.filter(l=>l.done==='all').length >= recent.length*0.8;
      const urgency = (highPain||painRising) ? 'high' : lowCompletion ? 'medium' : canProgress ? 'progress' : null;
      if (!urgency) return;
      // Don't re-surface if already adjusted after latest log
      const alreadyApplied = v.plan.lastAdjusted && new Date(v.plan.lastAdjusted) > new Date(logs[0].ts);
      if (alreadyApplied) return;
      reviews.push({ pat, visit:v, logs:recent, avgPain:Math.round(avgPain*10)/10, urgency });
    });
  });

  if (!reviews.length) return '';

  const urgencyColor = u => u==='high'?'#c05050':u==='medium'?'#c8a030':'#1a7a4a';
  const urgencyBg    = u => u==='high'?'#fdf5f5':u==='medium'?'#fffcf0':'#f2faf5';
  const urgencyLabel = u => u==='high'?'Hög smärta / stigande'
                          : u==='medium'?'Låg genomförandegrad'
                          : 'Redo att progrediera';

  return `<div class="anomaly-section" style="border-left-color:#4a7aaa;background:#f8faff">
    <div class="anomaly-hdr" style="border-bottom-color:#e0e8f5">
      <div class="anomaly-dot" style="background:#4a7aaa"></div>
      <div style="font-size:12px;font-weight:700;color:#1a3a6a">${reviews.length} plan${reviews.length>1?'er':''} väntar på granskning</div>
    </div>
    ${reviews.map(r => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #e8eef6;cursor:pointer"
           onclick="openPat('${r.pat.id}')">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--navy)">${e(r.pat.name)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:1px">${r.logs.length} pass loggade · NRS snitt ${r.avgPain}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:10px;font-weight:700;color:${urgencyColor(r.urgency)};background:${urgencyBg(r.urgency)};padding:3px 9px;border-radius:10px;white-space:nowrap">${urgencyLabel(r.urgency)}</span>
          <button onclick="event.stopPropagation();analyzePlanAdjustment('${r.pat.id}','${r.visit.id}')"
            style="background:var(--navy);color:white;border:none;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;border-radius:6px;white-space:nowrap">
            Analysera
          </button>
        </div>
      </div>`).join('')}
  </div>`;
}

// ── 4. KLINIKINSIKTER — Datadrivna mönster ───────────────────────────────

function analyzeClinicInsights(patients) {
  const exCount = {};
  const exImprovedCount = {};

  patients.forEach(p => {
    const visits = (p.visits||[]);
    // Find visits with plans where NRS improved vs previous
    visits.forEach((v, i) => {
      if (!v.plan?.exercises) return;
      const currPain = v.form?.pain;
      const prevPain = visits[i+1]?.form?.pain;
      const improved = currPain != null && prevPain != null && prevPain > currPain;
      v.plan.exercises.forEach(ex => {
        const key = (ex.name||'').toLowerCase().trim();
        exCount[key] = (exCount[key]||0) + 1;
        if (improved) exImprovedCount[key] = (exImprovedCount[key]||0) + 1;
      });
    });
  });

  // Score: times used + bonus for improvement correlation
  const scored = Object.entries(exCount).map(([name, count]) => ({
    name, count, improved: exImprovedCount[name]||0,
    score: count + (exImprovedCount[name]||0) * 1.5
  })).filter(x => x.count >= 2)
    .sort((a,b) => b.score - a.score)
    .slice(0, 6);

  return scored;
}

function renderClinicInsightsHTML(patients) {
  const insights = analyzeClinicInsights(patients);
  if (!insights.length) return '';
  const maxScore = insights[0]?.score || 1;
  return `<div class="insights-panel">

      <div style="font-size:12px;font-weight:700;color:var(--navy)">Klinikens mest använda övningar</div>

          <div style="margin-top:4px;height:4px;background:#eef0f3;border-radius:2px"><div class="insights-bar" style="width:${Math.round((ex.score/maxScore)*100)}%"></div></div>

// Storage helpers for pass logs (localStorage + Supabase sync)
const PASSLOG_KEY = (patId) => `zenya:passlogs:${patId}`;

function getPassLogs(patId) {
  try { return JSON.parse(localStorage.getItem(PASSLOG_KEY(patId))||'[]'); } catch { return []; }
}

function savePassLog(patId, entry) {
  try {
    const logs = getPassLogs(patId);
    logs.unshift(entry); // newest first
    localStorage.setItem(PASSLOG_KEY(patId), JSON.stringify(logs.slice(0,60)));
  } catch {}
}

// Track selected button values
const _ciSelections = {};
function ciSelect(group, val, btn) {
  _ciSelections[group] = val;
  const container = document.getElementById('ci-'+group+'-btns');
  if (!container) return;
  container.querySelectorAll('button').forEach(b => {

    b.style.background = isSelected ? 'var(--navy)' : 'white';
    b.style.color = isSelected ? 'white' : 'var(--text2)';

async function submitCheckIn(patId, visitId) {
  const pain = parseInt(document.getElementById('ci-pain')?.value||'5');
  const energy = _ciSelections['energy'] || null;
  const move = _ciSelections['move'] || null;
  const done = _ciSelections['done'] || null;
  const note = document.getElementById('ci-note')?.value?.trim() || '';
  const ts = new Date().toISOString();

  const entry = { visitId, ts, pain, energy, move, done, note };
  savePassLog(patId, entry);

  // Try to sync to Supabase
  try {
    await fetch(`${SB_URL}/rest/v1/pass_log`, {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify({pat_id:patId, visit_id:visitId, logged_at:ts, pain_after:pain,
        energy_level: energy ? parseInt(energy) : null,
        movement_quality: move ? parseInt(move) : null,
        completion: done || null,
        patient_note: note || null
      })
    });
  } catch(err) {}

  // Show confirmation + progress
  const box = document.getElementById('pub-checkin');
  if (!box) return;

  const logs = getPassLogs(patId);
  const totalSessions = logs.length;
  const streak = calcStreak(logs);
  const painFirst = logs.length >= 2 ? logs[logs.length-1].pain : null;
  const painTrend = painFirst != null ? pain - painFirst : null;
  const trendStr = painTrend === null ? '' : painTrend < 0
    ? `<div style="color:#1a7a4a;font-weight:600">📉 Smärta ↓${Math.abs(painTrend)} poäng sedan start</div>`
    : painTrend > 0
      ? `<div style="color:#c07070;font-weight:600">Smärta +${painTrend} poäng sedan start</div>`
      : `<div style="color:#7a5000">→ Smärta oförändrad sedan start</div>`;

  const feedbackMsg = pain >= 7
    ? 'Du rapporterar hög smärta — ta det lugnt och hör av dig till kliniken om det håller i sig.'
    : done === 'few'
      ? 'Du klarade bara delar av passet — det kan vara ett tecken på att programmet behöver justeras. Din fysioterapeut ser detta.'
      : energy === '1'
        ? 'Låg energi kan vara ett tecken på att kroppen behöver mer återhämtning.'
        : 'Pass registrerat. Varje pass ger din fysioterapeut bättre underlag för din behandling.';

  box.innerHTML = `
    <div style="padding:6px 0">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:10px">Rapport mottagen</div>
      <div style="font-size:13px;color:var(--navy);font-weight:600;margin-bottom:4px">${new Date(ts).toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})} · ${new Date(ts).toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}</div>
      <div style="font-size:12px;color:var(--text3);line-height:1.65;margin-top:8px;padding-top:8px;border-top:1px solid #f0f2f5">${feedbackMsg}</div>
      ${totalSessions > 1 ? `<div style="font-size:11px;color:var(--text3);margin-top:8px">${totalSessions} pass loggade totalt${streak>=3?' · '+streak+' pass i rad':''}</div>` : ''}
    </div>`;
}

function calcStreak(logs) {
  if (!logs.length) return 0;
  // Count consecutive days (within 2-day windows to allow rest days)
  let streak = 1;
  for (let i = 1; i < logs.length; i++) {
    const diffDays = (new Date(logs[i-1].ts) - new Date(logs[i].ts)) / (1000*60*60*24);
    if (diffDays <= 2) streak++; else break;
  }
  return streak;
}

// Check patient's pass_log for multi-metric alerts on dashboard
async function checkAdaptivePlanAlerts(patients) {
  const alertEl = document.getElementById('adaptive-alerts');
  if (!alertEl || !patients.length) return;
  const warnPats = [];

  patients.forEach(p => {
    const logs = getPassLogs(p.id);
    if (logs.length < 2) return;
    const recent = logs.slice(0, 4);

    // High pain 2+ sessions
    if (recent.length >= 2 && recent[0].pain >= 6 && recent[1].pain >= 6)
      warnPats.push({pat:p, icon:'📱', msg:`NRS ${recent[0].pain}/10 senaste ${Math.min(recent.filter(l=>l.pain>=6).length,recent.length)} pass — plan kan behöva justeras`, tag:'Hög smärta', bg:'#fde8e8', col:'#8a2020', sev:3});

    // Completion dropping
    const notDone = recent.filter(l=>l.done==='few').length;
    if (notDone >= 2)
      warnPats.push({pat:p, icon:'med', msg:`Klarar bara delar av övningarna — programmet kan vara för krävande`, tag:'Svår belastning', bg:'#fdf3d8', col:'#7a5000', sev:2});

    // Consistently low energy
    const lowEnergy = recent.filter(l=>l.energy==='1').length;
    if (lowEnergy >= 3)
      warnPats.push({pat:p, icon:'😴', msg:`Rapporterar låg energi ${lowEnergy} pass i rad — kontrollera återhämtning`, tag:'Låg energi', bg:'#f0f2f4', col:'#4a5a6a', sev:1});
  });

  if (!warnPats.length) return;
  warnPats.sort((a,b)=>b.sev-a.sev);
  alertEl.innerHTML = `<div class="anomaly-hdr"><div class="anomaly-dot"></div><div style="font-size:12px;font-weight:700;color:#7a5000">Patientrapporter — ${warnPats.length} signaler</div></div>` +
    warnPats.map(w => `<div class="anomaly-row" onclick="openPat('${w.pat.id}')">
      <div class="anomaly-icon"><div style="width:8px;height:8px;border-radius:50%;background:${w.sev>=3?'#c07070':w.sev>=2?'#c8a030':'#4a7aaa'};margin-top:2px"></div></div>
      <div style="flex:1"><div class="anomaly-name">${e(w.pat.name)}</div><div class="anomaly-msg">${w.msg}</div></div>
      <span class="anomaly-tag" style="background:${w.bg};color:${w.col}">${w.tag}</span>
    </div>`).join('');
  alertEl.style.display = 'block';
}

async function sendConsultMessage(patId) {
  const inp = document.getElementById('consult-inp');
  const msgs = document.getElementById('consult-msgs');
  const ov = document.getElementById('consult-overlay');
  const userText = inp?.value?.trim();
  if (!userText || !msgs || !ov) return;
  const key = getKey();
  if (!key) { alert('API-nyckel saknas.'); return; }
  inp.value = '';
  // Add user bubble
  msgs.innerHTML += `<div class="consult-bubble user">${e(userText)}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  // Add typing indicator
  const typingId = 'consult-typing-'+Date.now();
  msgs.innerHTML += `<div class="consult-bubble ai" id="${typingId}" style="color:var(--text3);font-style:italic">Analyserar…</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  _consultHistory.push({role:'user', content:userText});
  const sysPrompt = ov.getAttribute('data-sys');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:MODEL_SONNET, max_tokens:800,
        system: sysPrompt,
        messages: _consultHistory
      })
    });
    const data = await res.json();
    const reply = (data.content||[]).map(b=>b.text||'').join('').trim();
    _consultHistory.push({role:'assistant', content:reply});
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.innerHTML = reply.replace(/\n/g,'<br>');
    msgs.scrollTop = msgs.scrollHeight;
  } catch(err) {
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.textContent = 'Fel — kontrollera API-nyckel.';

async function aiExtractDiagnoses(patId) {
  const pat = S.patients.find(p=>p.id===patId) || S.pat;
  if (!pat) return;
  const key = getKey(); if (!key) return;

  // Build context: SOAP + plan diagnosis
  const soapTexts = (pat.visits||[]).slice(0,3).map(v => {
    const s = v.soap||{};
    return [s.S,s.O,s.A,s.P].filter(Boolean).join(' ');
  }).join(' ');
  const planDiags = (pat.visits||[]).map(v => v.form?.diagnosis||v.plan?.diagnosis||'').filter(Boolean).join(', ');
  const context = [pat.notes||'', planDiags, soapTexts].filter(Boolean).join('\n');
  if (!context.trim()) return;

  const prompt = `Baserat på följande patientinformation, lista de troligaste diagnoserna/tillstånden i fallande prioritet. Returnera ENBART en JSON-array med strängar, max 5 diagnoser, inga kommentarer, inga backticks.\n\n${context.slice(0,1500)}`;
  try {
    const raw = await callAPI(prompt, [], key, MODEL_HAIKU);
    const clean = raw.replace(/```json|```/g,'').trim();
    const arr = JSON.parse(clean);
    if (!Array.isArray(arr)) return;
    const p2 = S.patients.find(p=>p.id===patId)||S.pat;
    if (!p2) return;
    const updated = {...p2, diagnoses: arr, diagnosis: arr[0]||p2.diagnosis||''};
    const saved = savePat(updated);
    if (S.pat && S.pat.id === patId) S.pat = saved;
    // Refresh detail view if open
    if (S.screen === 'detail' && S.pat?.id === patId) rDetail();
  } catch(e) {}
}

Avsluta med:
${CLINIC.name}
${CLINIC.address}
${CLINIC.phone} | ${CLINIC.email}

  try {

    const remiss = (data.content||[]).map(b=>b.text||'').join('').trim();
    if (btn) { btn.textContent = 'Generera remiss'; btn.disabled = false; }
    window._lastRemissText = remiss;

    const resultEl = document.getElementById('remiss-result');
    if (resultEl) {
      resultEl.style.display = 'block';
      resultEl.innerHTML = `
        <div style="border-top:1px solid var(--border);padding-top:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Genererat remissunderlag</div>
            <div style="display:flex;gap:6px">
              <button id="copy-remiss-btn" onclick="copyRemiss()" style="font-size:11px;font-weight:600;padding:5px 12px;background:var(--ink);color:white;border:none;border-radius:20px;cursor:pointer;font-family:var(--font)">Kopiera</button>
              <button onclick="printRemiss('${e(patId)}')" style="font-size:11px;font-weight:600;padding:5px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--border2);border-radius:20px;cursor:pointer;font-family:var(--font)">Skriv ut</button>
            </div>
          </div>
          <div id="remiss-text-output" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;font-size:11.5px;font-family:var(--font-mono);line-height:1.85;white-space:pre-wrap;color:var(--ink);max-height:360px;overflow-y:auto">${e(remiss)}</div>
        </div>`;
      resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  } catch(err) {
    if (btn) { btn.textContent = 'Generera remiss'; btn.disabled = false; }
    const resultEl = document.getElementById('remiss-result');
    if (resultEl) {
      resultEl.style.display = 'block';
      resultEl.innerHTML = `<div style="color:var(--red);font-size:12px;padding:10px 0">Fel vid generering: ${e(err.message)}</div>`;
    }
  }
}

function copyRemiss() {
  const text = window._lastRemissText || '';
  navigator.clipboard.writeText(text).catch(()=>{});
  const btn = document.getElementById('copy-remiss-btn');
  if (btn) { btn.textContent = 'Kopierad!'; setTimeout(()=>{ if(btn) btn.textContent='Kopiera'; }, 2000); }
}

function printRemiss(patId) {
  const text = window._lastRemissText || '';
  const p = S.patients.find(x => x.id === patId) || S.pat;
  const win = window.open('', '_blank');
  if (!win) return;
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Remiss — ${e(p?.name||'')}</title>
  <style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.8;max-width:680px;margin:40px auto;color:#000}pre{white-space:pre-wrap;font-family:inherit;font-size:12pt}@media print{body{margin:20mm}}</style>
  </head><body><pre>${e(text)}</pre></body></html>`);
  win.document.close();
  setTimeout(()=>win.print(), 400);
}

// ════════════════════════════════════════════════════════════════════════════

// ── CHECK FOR PUBLIC PLAN LINK (#plan=xxx&visit=yyy)
const _hashParams = new URLSearchParams(window.location.hash.replace('#',''));
const _hashPatId = _hashParams.get('plan');
const _hashVisitId = _hashParams.get('visit');

if (_hashPatId && _hashVisitId) {
  // Public plan view — no login needed
  window._isPublicPlan = true; // suppress all clinic UI
  const tb = document.querySelector('.topbar');
  if (tb) tb.style.display = 'none';
  const at = document.getElementById('autosave-toast');
  if (at) at.style.display = 'none';
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s-public-plan').classList.add('active');
  document.getElementById('s-public-plan').innerHTML = '<div class="pub-loading">Hämtar din Hael-plan...</div>';
  loadPublicPlan(_hashPatId, _hashVisitId);
} else {
  const _storedAuth = getStoredAuth();
  if (_storedAuth) {
    _authUser = _storedAuth.user;
    loadPats(); S.apiKey = getKey(); startAutoSave(); go('dashboard');
    setTimeout(() => syncFromCloud(), 1500);
    setTimeout(() => sbKeepAlive(), 3000);
  } else {
    const tb = document.querySelector('.topbar');
    if (tb) tb.style.display = 'none';
    rLogin();
  }
}

</script>
