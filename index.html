<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenya</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root{
    --navy:#0f2744;
    --navy2:#1a3a5c;
    --navy3:#234878;
    --teal:#1a7a8a;
    --teal2:#2a9aaa;
    --teal3:#e8f6f8;
    --gold:#b8920a;
    --white:#ffffff;
    --bg:#f2f4f7;
    --bg2:#e8ebef;
    --border:#d0d8e4;
    --border2:#b8c4d4;
    --text:#1a2a3a;
    --text2:#3a4a5a;
    --text3:#6a7a8a;
    --text4:#9aabb8;
    --green:#1a7a4a;
    --green-bg:#e8f5ee;
    --amber:#8a6000;
    --amber-bg:#fdf3d8;
    --red:#8a2020;
    --red-bg:#fde8e8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}

  /* ── TOPBAR ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 16px;height:52px;background:var(--navy);border-bottom:1px solid var(--navy3);position:sticky;top:0;z-index:100;}
  .topbar-logo{height:32px;display:block;}
  .topbar-right{display:flex;gap:4px;align-items:center;}

  /* ── BUTTONS ── */
  .btn{padding:7px 16px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border2);background:white;color:var(--text2);transition:all .15s;white-space:nowrap;}
  .btn:hover{background:var(--bg);border-color:var(--teal);color:var(--teal);}
  .btn-p{background:var(--teal);border-color:var(--teal);color:white;font-weight:600;}
  .btn-p:hover{background:var(--teal2);border-color:var(--teal2);color:white;}
  .btn-navy{background:var(--navy);border-color:var(--navy);color:white;font-weight:600;}
  .btn-navy:hover{background:var(--navy2);}
  .btn-d{background:white;border-color:#f0c0c0;color:var(--red);}
  .btn-d:hover{background:var(--red-bg);}
  .btn-ghost{background:transparent;border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);}
  .btn-ghost:hover{background:rgba(255,255,255,0.08);color:white;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ── LAYOUT ── */
  .main{max-width:1200px;margin:0 auto;padding:20px 24px 80px;}
  .screen{display:none;}.screen.active{display:block;}

  /* ── DASHBOARD ── */
  .dash-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .dash-greeting{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--navy);font-weight:300;}
  .dash-date{font-size:11px;color:var(--text3);margin-top:1px;}
  .dash-quickbar{display:flex;gap:8px;align-items:center;}
  .dash-qbtn{padding:8px 20px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;letter-spacing:.01em;white-space:nowrap;transition:all .15s;}
  .dash-qbtn-primary{background:var(--navy);color:white;}
  .dash-qbtn-primary:hover{background:var(--navy2);}
  .dash-qbtn-secondary{background:white;color:var(--navy);border:1px solid var(--border);}
  .dash-qbtn-secondary:hover{border-color:var(--teal);color:var(--teal);}
  .dash-kpis{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);background:white;overflow:hidden;border-radius:6px;}
  .dash-kpi{flex:1;padding:14px 18px;border-right:1px solid var(--border);}
  .dash-kpi:last-child{border-right:none;}
  .dash-kpi-val{font-size:24px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy);line-height:1;}
  .dash-kpi-lbl{font-size:10px;color:var(--text3);margin-top:4px;letter-spacing:.07em;text-transform:uppercase;}
  .dash-kpi-link{font-size:10px;color:var(--teal);cursor:pointer;margin-top:2px;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr 280px;gap:16px;margin-bottom:16px;}
  .dash-panel{background:white;border:1px solid var(--border);overflow:hidden;}
  .dash-panel-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .dash-panel-title{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);}
  .dash-panel-body{padding:0;}
  .dash-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bg2);cursor:pointer;transition:background .1s;}
  .dash-row:last-child{border-bottom:none;}
  .dash-row:hover{background:var(--teal3);}
  .dr-initials{width:28px;height:28px;background:var(--navy);color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Mono',monospace;}
  .dr-info{flex:1;min-width:0;}
  .dr-name{font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-diag{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-badge{font-size:9px;padding:2px 6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;}
  .dr-date{font-size:10px;color:var(--text4);font-family:'DM Mono',monospace;flex-shrink:0;}
  .dash-avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);color:white;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Mono',monospace;}
  .dash-empty{padding:20px 14px;text-align:center;font-size:11px;color:var(--text4);}
  .dash-stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bg2);font-size:12px;}
  .dash-stat-row:last-child{border-bottom:none;}
  .dash-bar{height:3px;background:#eef0f3;margin-top:4px;overflow:hidden;}
  .dash-bar-fill{height:100%;background:var(--teal);}
  @media(max-width:900px){.dash-grid{grid-template-columns:1fr 1fr;}.dash-grid .dash-panel:last-child{display:none;}}
  @media(max-width:600px){.dash-grid{grid-template-columns:1fr;}}
  /* ── PATIENT LIST ── */
  .page-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;}
  .page-title{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--navy);font-weight:400;}
  .page-sub{font-size:12px;color:var(--text3);margin-top:2px;}
  .search-inp{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:16px;}
  .search-inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,0.08);}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
  .pcard{background:white;border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:all .18s;position:relative;}
  .pcard:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(26,122,138,0.09);transform:translateY(-1px);}
  .pc-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--border2);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:3px;}
  .pc-del:hover{color:var(--red);background:var(--red-bg);}
  .pc-name{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--navy);margin-bottom:2px;padding-right:20px;font-weight:400;}
  .pc-diag{font-size:11px;color:var(--teal);margin-bottom:10px;font-style:italic;}
  .pc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
  .pc-tag{font-size:10px;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:3px;border:1px solid var(--border);}
  .pc-bot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
  .pc-visits{font-size:10px;color:var(--text4);}
  .pc-status{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .empty{text-align:center;padding:60px 20px;}
  .empty-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text3);margin-bottom:12px;font-weight:300;}

  /* ── DETAIL ── */
  .det-hdr{background:white;border:1px solid var(--border);border-radius:10px;padding:22px 24px;margin-bottom:18px;}
  .det-name{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--navy);font-weight:400;margin-bottom:2px;}
  .det-diag{font-size:13px;color:var(--teal);font-style:italic;margin-bottom:14px;}
  .det-meta{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px;}
  .dml{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--text4);margin-bottom:3px;}
  .dmv{font-size:12px;color:var(--navy);font-family:'DM Mono',monospace;font-weight:500;}
  .det-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border);}
  .vlbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;font-weight:600;}
  .vcard{background:white;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .vcard.latest{border-color:var(--teal);border-left:3px solid var(--teal);}
  .vhdr{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;}
  .vhdr:hover{background:var(--teal3);}
  .vnum{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);width:20px;}
  .vinfo{flex:1;}
  .vdate{font-size:13px;color:var(--navy);font-weight:500;}
  .vexs{font-size:11px;color:var(--text3);margin-top:1px;}
  .vstatus{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .vchev{color:var(--text4);font-size:14px;transition:transform .2s;}
  .vchev.open{transform:rotate(90deg);}
  .vbody{padding:0 15px 15px;border-top:1px solid var(--border);}
  .vex-item{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bg2);font-size:12px;}
  .vex-item:last-child{border-bottom:none;}
  .vex-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);}
  .vex-name{color:var(--text);}
  .vex-dose{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}
  .rf-banner{background:#fff3cd;border:1.5px solid #f5c842;border-radius:10px;padding:14px 16px;margin:12px 0;color:#7a5000}
  .rf-title{font-weight:700;font-size:12px;margin-bottom:8px;color:#6a3000;letter-spacing:.02em}
  .rf-item{font-size:12px;margin-bottom:5px;line-height:1.5;padding-left:8px;border-left:2px solid #f5c842}
  .note-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin:11px 0 5px;}
  .note-inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:55px;}
  .note-inp:focus{border-color:var(--teal);}
  .srow{display:flex;align-items:center;gap:7px;margin-top:8px;}
  .slbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
  .ssel{background:white;border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:11px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;}
  .vactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  /* ── SOAP IN VISIT ── */
  .soap-card{margin-top:10px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .soap-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--teal3);border-bottom:1px solid var(--border);}
  .soap-card-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:600;}
  .soap-card-icd{font-family:'DM Mono',monospace;font-size:10px;color:var(--navy);background:white;padding:2px 7px;border-radius:3px;border:1px solid var(--border);}
  .soap-row{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bg2);font-size:11px;align-items:baseline;}
  .soap-row:last-child{border-bottom:none;}
  .soap-l{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .soap-l.S{background:#dceef8;color:#1a5a8a;}
  .soap-l.O{background:#dcf0e4;color:#1a6a3a;}
  .soap-l.A{background:#fdf3d8;color:#7a5a00;}
  .soap-l.P{background:#ede0f8;color:#5a20a0;}
  .soap-t{color:var(--text2);line-height:1.55;}

  /* ── FORM ── */
  .fw{max-width:600px;margin:0 auto;}
  .ftit{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);margin-bottom:3px;font-weight:400;}
  .fsub{color:var(--text3);font-size:12px;margin-bottom:22px;}
  .slabel{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:7px;margin-top:18px;display:block;font-weight:600;}
  .field{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;}
  .field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,0.08);}
  .field option{background:white;}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .slwrap{margin-bottom:11px;}
  .slhd{display:flex;justify-content:space-between;margin-bottom:4px;}
  .sllbl{font-size:12px;color:var(--text2);}
  .slval{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;color:var(--navy);}
  input[type=range]{width:100%;accent-color:var(--teal);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .chip{padding:5px 13px;border-radius:4px;border:1px solid var(--border);background:white;color:var(--text3);font-size:12px;cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif;}
  .chip.on{border-color:var(--teal);background:var(--teal3);color:var(--teal);font-weight:600;}
  .hint{font-size:11px;color:var(--text3);margin-bottom:5px;line-height:1.6;}
  .genbtn{width:100%;margin-top:20px;padding:13px;background:var(--navy);border:none;border-radius:7px;font-family:'Cormorant Garamond',serif;font-size:17px;color:white;cursor:pointer;letter-spacing:.04em;font-weight:400;}
  .genbtn:hover:not(:disabled){background:var(--navy2);}
  .genbtn:disabled{opacity:.4;cursor:not-allowed;}
  .errbox{background:var(--red-bg);border:1px solid #f0c0c0;border-radius:6px;padding:9px 12px;color:var(--red);margin-bottom:12px;font-size:12px;}

  /* ── EDIT EX ── */
  .eelist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .eeitem{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:7px;border:1px solid;transition:all .18s;}
  .eeitem.lk{border-color:var(--teal);background:var(--teal3);}
  .eeitem.ul{border-color:var(--border);background:white;}
  .eenum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;flex-shrink:0;border:1px solid;}
  .lk .eenum{background:white;color:var(--teal);border-color:var(--teal);}
  .ul .eenum{background:var(--bg);color:var(--text4);border-color:var(--border);}
  .eeinfo{flex:1;}
  .eename{font-size:13px;font-weight:500;}
  .lk .eename{color:var(--navy);}.ul .eename{color:var(--text3);}
  .eedose{font-size:10px;color:var(--text4);margin-top:2px;font-family:'DM Mono',monospace;}
  .eest{font-size:9px;margin-top:2px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
  .lk .eest{color:var(--teal);}.ul .eest{color:var(--text4);}
  .lkbtn{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;font-family:'DM Sans',sans-serif;}
  .lkbtn.on{border-color:var(--teal);background:white;color:var(--teal);}
  .lkbtn.off{border-color:var(--border);background:var(--bg);color:var(--text3);}
  .rinfo{background:var(--teal3);border:1px solid var(--teal);border-radius:6px;padding:7px 12px;font-size:12px;color:var(--teal);text-align:center;margin-bottom:12px;}

  /* ── LOADING ── */
  .ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:13px;}
  .spin{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--teal);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ldtit{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--navy);font-weight:300;letter-spacing:.04em;}
  .ldst{font-size:12px;display:flex;align-items:center;gap:8px;transition:color .3s;}
  .ldst.done{color:var(--green);}.ldst.act{color:var(--teal);}.ldst.wait{color:var(--text4);}

  /* ── SETTINGS ── */
  .swrap{max-width:480px;margin:0 auto;}
  .stit{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);font-weight:400;margin-bottom:3px;}
  .ssub{font-size:12px;color:var(--text3);margin-bottom:22px;line-height:1.6;}
  .akwrap{position:relative;margin-bottom:7px;}
  .akinp{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 44px 9px 12px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;outline:none;}
  .akinp:focus{border-color:var(--teal);}
  .aktgl{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;}
  .akst{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:6px;}
  .akdot{width:6px;height:6px;border-radius:50%;}
  .akhint{font-size:11px;color:var(--text3);line-height:1.7;margin-bottom:12px;}
  .akhint a{color:var(--teal);}
  .svconf{font-size:11px;color:var(--green);margin-left:9px;opacity:0;transition:opacity .3s;}
  .svconf.show{opacity:1;}

  /* ── MODAL ── */
  .modal-ov{display:none;position:fixed;inset:0;background:rgba(15,39,68,0.5);align-items:center;justify-content:center;z-index:200;}
  .modal-ov.open{display:flex;}
  .modal{background:white;border:1px solid var(--border);border-radius:12px;padding:26px;max-width:380px;width:90%;box-shadow:0 8px 32px rgba(15,39,68,0.15);}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--navy);margin-bottom:6px;font-weight:400;}
  .modal-text{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:18px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  /* ── MEETING ── */
  .meet-wrap{max-width:680px;margin:0 auto;}
  .meet-consent{background:var(--teal3);border:1px solid var(--teal);border-radius:8px;padding:18px 22px;margin-bottom:20px;}
  .meet-consent-title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--navy);margin-bottom:7px;font-weight:400;}
  .meet-consent-txt{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:13px;}
  .meet-consent-btn{display:flex;gap:9px;}
  .meet-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);font-weight:400;margin-bottom:3px;}
  .meet-sub{font-size:12px;color:var(--text3);margin-bottom:20px;}
  .meet-status{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 15px;border-radius:7px;background:white;border:1px solid var(--border);}
  .meet-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .meet-dot.listening{background:#c03030;animation:pulse 1.2s ease-in-out infinite;}
  .meet-dot.idle{background:var(--border2);}
  .meet-dot.processing{background:var(--amber);animation:pulse .8s ease-in-out infinite;}

  .insights-ex-row:last-child{border-bottom:none;}
  .insights-bar{height:5px;border-radius:3px;background:var(--teal);transition:width .4s;}

  /* ── INTAG-FLÖDE ── */
  .ipb-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);color:white;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ipb-name{font-size:14px;font-weight:600;color:white;}
  .ipb-meta{font-size:11px;color:rgba(255,255,255,0.5);}
  .ipb-change{font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;margin-left:auto;text-decoration:underline;}
  .ipb-change:hover{color:white;}
  .svc-chip{padding:10px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;background:white;display:flex;justify-content:space-between;align-items:center;}
  .svc-chip:hover{border-color:var(--teal);color:var(--teal);}
  .svc-chip.selected{background:var(--navy);border-color:var(--navy);color:white;}
  .svc-chip-price{font-size:10px;opacity:.6;font-family:'DM Mono',monospace;}
  .channel-chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:11px;font-weight:500;transition:all .12s;background:white;}
  .channel-chip:hover{border-color:var(--teal);}
  .channel-chip.selected{background:var(--teal);border-color:var(--teal);color:white;}
  .ina-btn{padding:14px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all .15s;text-align:left;}
  .ina-btn:hover{border-color:var(--teal);background:var(--teal3);}
  .ina-btn.primary{background:var(--navy);border-color:var(--navy);color:white;}
  .ina-btn.primary:hover{background:var(--navy2);}
  .ina-icon{font-size:18px;margin-bottom:6px;display:block;}
  .ina-sub{font-size:10px;color:var(--text3);margin-top:2px;font-weight:400;}
  .ina-btn.primary .ina-sub{color:rgba(255,255,255,0.5);}
  .intakt-saved-banner{background:#e8f5ee;border:1px solid #a0d8b0;border-radius:6px;padding:9px 14px;font-size:12px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;}

  /* ── SIDE-BY-SIDE SOAP ── */
  .sbs-wrap{max-width:1200px;margin:0 auto;}
  .sbs-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .sbs-col-label{padding:8px 14px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  .sbs-col-label.prev{background:var(--amber-bg);color:var(--amber);border:1px solid #e0c860;}
  .sbs-col-label.curr{background:var(--teal3);color:var(--teal);border:1px solid var(--teal);}
  .sbs-col-detail{font-size:12px;font-weight:400;color:var(--text3);margin-left:auto;text-transform:none;letter-spacing:0;}
  .sbs-section{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  .sbs-panel{background:white;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .sbs-phdr{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);}
  .sbs-letter{width:22px;height:22px;border-radius:4px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sbs-letter.S{background:#ffe8e8;color:#a03030;}
  .sbs-letter.O{background:#e8eeff;color:#2030a0;}
  .sbs-letter.A{background:var(--amber-bg);color:var(--amber);}
  .sbs-letter.P{background:var(--green-bg);color:var(--green);}
  .sbs-pname{font-size:10px;color:var(--text3);}
  .sbs-prev-body{padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.7;min-height:80px;background:#fefcf0;font-style:italic;}
  .sbs-curr-ta{width:100%;padding:10px 12px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);line-height:1.7;min-height:80px;border:none;outline:none;resize:vertical;background:white;}
  .sbs-curr-ta:focus{background:#f8fcff;}
  .sbs-prev-exlist{padding:8px 12px;background:#fefcf0;}
  .sbs-ex-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);}
  .sbs-ex-row:last-child{border-bottom:none;}
  .sbs-ex-n{width:16px;height:16px;border-radius:3px;background:var(--amber-bg);color:var(--amber);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sbs-goals-prev{padding:10px 12px;background:#fefcf0;}
  .sbs-goal-row{margin-bottom:6px;font-size:11px;}
  .sbs-goal-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);}
  .sbs-goal-val{color:var(--text2);font-style:italic;margin-top:1px;}
  .sbs-pain-compare{display:flex;gap:10px;margin-bottom:14px;}
  .sbs-pain-box{flex:1;background:white;border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;}
  .sbs-pain-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy);}
  .sbs-pain-lbl{font-size:10px;color:var(--text3);margin-top:2px;}
  .sbs-delta{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:4px;display:inline-block;}
  .sbs-delta.better{background:var(--green-bg);color:var(--green);}
  .sbs-delta.worse{background:var(--red-bg);color:var(--red);}
  .sbs-delta.same{background:var(--bg);color:var(--text3);}
  @media(max-width:750px){
    .sbs-section,.sbs-top{grid-template-columns:1fr;}
  }

  /* ── RESPONSIVE ─────────────────────────────────────────────────── */

  /* Tablet */
  @media(max-width:900px){
    .dash-grid{grid-template-columns:1fr 1fr;}
    .dash-grid .dash-panel:last-child{display:none;}
    .sbs-section,.sbs-top{grid-template-columns:1fr;}
  }

  /* Mobile */
  @media(max-width:600px){
    body{overflow-x:hidden;}
    .main{padding:10px 10px 80px;}

    /* Topbar */
    .topbar{padding:0 10px;height:46px;}

    /* Dashboard */
    .dash-topbar{flex-direction:column;align-items:stretch;gap:10px;padding-bottom:14px;}
    .dash-greeting{font-size:21px;}
    .dash-date{font-size:10px;}
    .dash-quickbar{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .dash-qbtn{font-size:12px;padding:9px 8px;text-align:center;}
    .dash-quickbar button:last-child{grid-column:1/-1;}
    .dash-kpis{display:grid;grid-template-columns:1fr 1fr;border-radius:8px;}
    .dash-kpi{border-right:none!important;border-bottom:1px solid var(--border)!important;padding:11px 12px;}
    .dash-kpi:nth-child(odd){border-right:1px solid var(--border)!important;}
    .dash-kpi:nth-child(3),.dash-kpi:nth-child(4){border-bottom:none!important;}
    .dash-kpi-val{font-size:20px;}
    .dash-grid{grid-template-columns:1fr;gap:10px;}

    /* Patient list */
    .pgrid{grid-template-columns:1fr;}
    .page-hdr{flex-direction:column;align-items:flex-start;gap:8px;}
    .pcard{padding:13px 12px;}

    /* Patient detail */
    .det-hdr{padding:12px 10px;}
    .det-name{font-size:21px;}
    .det-meta{gap:10px;flex-wrap:wrap;}

    /* Visit cards */
    .vhdr{padding:9px 10px;gap:8px;}
    .vbadge{font-size:9px;padding:2px 5px;}

    /* Forms/screens */
    .fwrap,.msoap-wrap,.meet-wrap,.soap-wrap{padding:0;}
    .msoap-ta{font-size:13px;}
    .transcript-box{font-size:12px;}

    /* Plan doc buttons */
    .doc-actions{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .doc-actions .btn{flex-shrink:0;font-size:11px!important;padding:7px 10px!important;white-space:nowrap;}

    /* Clinical AI panel */
    .clinical-panel{max-height:260px!important;}

    /* SBS stack */
    .sbs-section,.sbs-top{grid-template-columns:1fr!important;}

    /* Anomaly rows */
    .anomaly-row{flex-wrap:wrap;gap:5px;}
    .anomaly-tag{margin-top:2px;}
  }

  /* Very small phones */
  @media(max-width:380px){
    .main{padding:8px 8px 80px;}
    .topbar{height:43px;}
    .det-name{font-size:18px;}
    .dash-greeting{font-size:18px;}
    .dash-kpi-val{font-size:18px;}
  }


  /* ── PUBLIC PLAN EXERCISE EXPAND ─────────────────────────────────── */
  .pub-exbody{display:none;}
  .pub-exbody.open{display:block;}
  .pub-chevron{transition:transform .2s ease;display:inline-block;color:#8a9aaa;font-size:20px;line-height:1;}
  .pub-exhdr.open .pub-chevron{transform:rotate(90deg);}
  /* ── PUBLIC PLAN REDESIGN ──────────────────────────────────────── */
  .zp-page{background:#f0f2f6;min-height:100vh;font-family:'DM Sans',sans-serif;}
  .zp-hero{background:var(--navy);padding:28px 18px 0;position:relative;overflow:hidden;}
  .zp-hero::before{content:'';position:absolute;top:-80px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(26,122,138,.15);pointer-events:none;}
  .zp-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;font-size:11px;color:rgba(255,255,255,.8);white-space:nowrap;}
  .zp-chip.accent{background:rgba(26,200,150,.15);border-color:rgba(26,200,150,.25);color:rgba(140,240,200,.95);}
  .zp-section{background:white;border-radius:16px;margin:12px 14px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .zp-footer{margin:12px 14px 0;background:var(--navy);border-radius:16px;padding:22px 20px;}
  .zp-sec-hdr{padding:20px 18px 11px;}
  .zp-sec-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);}
  .zp-excard{border-bottom:1px solid #f2f4f7;}
  .zp-excard:last-child{border-bottom:none;}
  .zp-exhdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s;}
  .zp-exhdr:active{background:#f8f9fa;}
  .zp-exnum{width:28px;height:28px;background:var(--navy);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Mono',monospace;}
  .zp-exbody{max-height:0;overflow:hidden;transition:max-height .3s ease, padding .3s ease;padding:0 16px;}
  .zp-exbody.open{max-height:600px;padding:12px 16px 16px;}
  .zp-exhdr.open .zp-chevron{transform:rotate(90deg);}
  .zp-chevron{font-size:18px;color:#c8d0d8;flex-shrink:0;transition:transform .25s ease;display:inline-block;}
  .zp-step{display:flex;gap:10px;align-items:flex-start;padding:6px 0;}
  .zp-step-num{width:22px;height:22px;border-radius:6px;background:var(--teal);color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .zp-pass-bar{position:sticky;bottom:0;z-index:10;}
  .zp-pass-btn{width:100%;background:linear-gradient(135deg,#1a7a8a,#16a8b8);color:white;font-size:16px;font-weight:700;padding:17px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 6px 24px rgba(26,122,138,.38);-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .1s;letter-spacing:.01em;}
  .zp-pass-btn:active{transform:scale(.98);opacity:.9;}
  @media print{.zp-pass-bar{display:none!important;}.zp-exbody{display:block!important;}}
  /* ── BETALSTATUS ── */
  .pay-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:opacity .12s;user-select:none;}
  .pay-badge:hover{opacity:.8;}
  .pay-badge.paid{background:#e8f5ee;color:#1a7a4a;border-color:#a0d8b0;}
  .pay-badge.unpaid{background:#fde8e8;color:#a03030;border-color:#f0b0b0;}
  .pay-badge.invoiced{background:#fdf3d8;color:#8a6000;border-color:#e0c060;}
  .pay-popup{position:fixed;z-index:200;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);min-width:160px;overflow:hidden;}
  .pay-opt{padding:10px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .pay-opt:hover{background:var(--bg);}
  /* ── SAMTYCKE ── */
  .consent-wrap{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-top:12px;}
  .consent-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .consent-hdr-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);}
  .consent-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .consent-row:last-child{border-bottom:none;}
  .consent-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .consent-type{flex:1;color:var(--text2);}
  .consent-date{font-size:10px;color:var(--text3);font-family:monospace;}
  .consent-rev{font-size:10px;color:var(--red);cursor:pointer;text-decoration:underline;margin-left:6px;}
  /* ── PATIENTJOURNAL PDF ── */
  .pjdoc{max-width:800px;margin:0 auto;background:white;}
  .pjdoc-cover{padding:48px 48px 28px;border-bottom:3px solid var(--navy);}
  .pjdoc-clinic-name{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
  .pjdoc-patient-name{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--navy);font-weight:400;margin-bottom:4px;}
  .pjdoc-diag{font-size:13px;color:var(--text3);}
  .pjdoc-meta-row{display:flex;gap:24px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border);}
  .pjdoc-mi .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text4);margin-bottom:2px;}
  .pjdoc-mi .val{font-size:13px;font-weight:600;color:var(--navy);}
  .pjdoc-section{padding:24px 48px;border-bottom:1px solid var(--border);}
  .pjdoc-sec-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--teal);margin-bottom:14px;}
  .pjdoc-visit-block{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--bg2);}
  .pjdoc-visit-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .pjdoc-visit-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .pjdoc-visit-n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pjdoc-visit-date{font-weight:700;color:var(--navy);font-size:13px;}
  .pjdoc-soap-row{display:grid;grid-template-columns:22px 1fr;gap:8px;margin-bottom:6px;}
  .pjdoc-sl{width:20px;height:20px;border-radius:3px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .pjdoc-sl.S{background:#ffe8e8;color:#a03030;}
  .pjdoc-sl.O{background:#e8eeff;color:#2030a0;}
  .pjdoc-sl.A{background:var(--amber-bg);color:var(--amber);}
  .pjdoc-sl.P{background:var(--green-bg);color:var(--green);}
  .pjdoc-soap-text{font-size:12px;line-height:1.7;color:var(--text2);padding-top:1px;white-space:pre-wrap;}
  .pjdoc-exercises{margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:6px;}
  .pjdoc-ex-row{display:flex;gap:8px;font-size:11px;padding:2px 0;color:var(--text2);}
  .pjdoc-ex-n{color:var(--text4);font-family:monospace;flex-shrink:0;width:20px;}
  .pjdoc-ftr{padding:20px 48px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--navy);}
  .pjdoc-ftr-txt{font-size:10px;color:var(--text3);line-height:1.8;}
  .login-wrap{max-width:360px;margin:80px auto;padding:0 20px}
  .login-logo{height:48px;margin-bottom:24px}
  .login-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--navy);font-weight:400;margin-bottom:4px}
  .login-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
  .login-field{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;margin-bottom:10px;background:white}
  .login-field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,0.08)}
  .login-btn{width:100%;padding:13px;background:var(--navy);color:white;border:none;border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:4px;font-weight:600;letter-spacing:.02em}
  .login-btn:hover{background:#2a4a5a}
  .login-err{font-size:12px;color:#c07070;margin-top:8px;min-height:18px}
  .login-hint{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}
  .pub-wrap{max-width:600px;margin:0 auto;padding:0 0 40px}
  .pub-loading{text-align:center;padding:80px 20px;color:#8a9aaa;font-size:14px}
  @keyframes fadeInOv{from{opacity:0}to{opacity:1}}
  @keyframes fadeScaleIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .npf-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.65);backdrop-filter:blur(4px)}
  .npf-sheet{background:white;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;flex-shrink:0;animation:fadeScaleIn .18s cubic-bezier(.2,.8,.4,1);position:relative;z-index:1}
  .npf-header{background:var(--navy);padding:24px 24px 20px;border-radius:16px 16px 0 0}
  .npf-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:white;margin-bottom:4px}
  .npf-sub{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.04em}
  .npf-body{padding:24px}
  .npf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .npf-full{margin-bottom:10px}
  .npf-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:5px}
  .npf-input{width:100%;border:1px solid #dde2e8;border-radius:8px;padding:11px 13px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--navy);background:#fafbfc;box-sizing:border-box;transition:border-color .15s,box-shadow .15s;outline:none}
  .npf-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,.1);background:white}
  .npf-input::placeholder{color:#aab0ba}
  .npf-footer{padding:0 24px 32px;display:flex;flex-direction:column;gap:8px}
  .npf-btn-primary{background:var(--navy);color:white;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.01em;transition:background .15s}
  .npf-btn-primary:hover{background:var(--navy2)}
  .npf-btn-ghost{background:transparent;border:1px solid #dde2e8;border-radius:10px;padding:12px;font-size:13px;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
  .npf-btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
  .npf-err{font-size:11px;color:#c07070;margin-bottom:8px;display:none;padding:8px 12px;background:#fff0f0;border-radius:6px}
  @media(max-width:600px){.npf-row{grid-template-columns:1fr}.npf-sheet{max-height:95vh}}
  @media print{
    .dcontrols{display:none!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    .pjdoc-section{page-break-inside:avoid;}
  }
</style>

<body>

function sbHeaders() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Prefer': 'resolution=merge-duplicates'
  };
}

function setSyncStatus(s, msg) {
  _syncStatus = s;
  const el = document.getElementById('sync-status');
  if (!el) return;
  const icons = {idle:'', syncing:'', ok:'', error:''};
  const colors = {idle:'rgba(255,255,255,0.4)', syncing:'#f0c040', ok:'#60d080', error:'#f07060'};
  el.innerHTML = `<span style="color:${colors[s]};font-size:11px">${icons[s]} ${msg||''}</span>`;
}

async function sbUpsertPat(pat) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients', {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ id: pat.id, data: pat, updated_at: new Date().toISOString() })
    });
    return res.ok;
  } catch(e) { return false; }
}

async function sbDeletePat(id) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders()
    });
    return res.ok;
  } catch(e) { return false; }
}

async function sbLoadAll() {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients?select=id,data,updated_at&order=updated_at.desc', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.map(r => r.data).filter(Boolean);
  } catch(e) { return null; }
}

async function syncToCloud() {
  if (_sbSyncing) return;
  _sbSyncing = true;
  setSyncStatus('syncing', 'Sparar...');
  let ok = true;
  for (const p of S.patients) {
    const r = await sbUpsertPat(p);
    if (!r) { ok = false; break; }
  }
  _sbSyncing = false;
  if (ok) {
    setSyncStatus('ok', 'Synkad');
    setTimeout(() => setSyncStatus('idle', ''), 3000);
  } else {
    setSyncStatus('error', 'Synkfel');
  }
}

async function syncFromCloud() {
  setSyncStatus('syncing', 'Hämtar...');
  const cloudPats = await sbLoadAll();
  if (!cloudPats) { setSyncStatus('error', 'Anslutningsfel'); return; }

  // Merge: cloud wins if newer
  const local = {};
  S.patients.forEach(p => local[p.id] = p);

  cloudPats.forEach(cp => {
    const lp = local[cp.id];
    if (!lp || (cp.updatedAt||0) > (lp.updatedAt||0)) {
      local[cp.id] = cp;
      try { localStorage.setItem('kansei-data:'+cp.id, JSON.stringify(cp)); } catch {}
    }
  });

  S.patients = Object.values(local).sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0));
  setSyncStatus('ok', cloudPats.length + ' patienter');
  setTimeout(() => setSyncStatus('idle', ''), 3000);

  // Re-render current screen
  if (S.screen === 'dashboard') rDashboard();
  else if (S.screen === 'list') rList();
}

function parseBirthdate(val) {
  if (!val) return '';
  val = val.trim().replace(/\s/g,'');
  if (/^\d{6}$/.test(val)) {
    const yy = parseInt(val.slice(0,2));
    const yyyy = yy <= (new Date().getFullYear() % 100) ? 2000+yy : 1900+yy;
    return yyyy + '-' + val.slice(2,4) + '-' + val.slice(4,6);
  }
  if (/^\d{8}$/.test(val)) return val.slice(0,4)+'-'+val.slice(4,6)+'-'+val.slice(6,8);
  if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  return val;
}

}

let _autoBackupInterval = null;

function startAutoSave(){
  if(_autoSaveInterval) clearInterval(_autoSaveInterval);
  if(_autoBackupInterval) clearInterval(_autoBackupInterval);

  // Save to localStorage every 30 seconds if changes
  _autoSaveInterval=setInterval(()=>{
    if(_unsavedChanges){ manualSave(); }
  },30000);

  // Sync to Supabase every 5 minutes as safety net
  _autoBackupInterval=setInterval(()=>{
    if(S.patients.length > 0) syncToCloud();
  }, 30 * 60 * 1000);
}

function savePat(p){
  const u={...p,updatedAt:Date.now()};
  // Write to ALL key formats so loadPats always finds it
  try{localStorage.setItem('kansei-data:'+u.id, JSON.stringify(u));}catch{}
  try{localStorage.setItem('pat:'+u.id, JSON.stringify(u));}catch{}
  try{localStorage.setItem(u.id, JSON.stringify(u));}catch{}
  const i=S.patients.findIndex(x=>x.id===u.id);
  if(i>=0)S.patients[i]=u;else S.patients.unshift(u);
  S.patients.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  markUnsaved();
  // Sync to Supabase in background
  sbUpsertPat(u).then(ok => {
    if(ok) setSyncStatus('ok','Sparad');
    else setSyncStatus('error','Synkfel');
    setTimeout(()=>setSyncStatus('idle',''),3000);
  });
  return u;
}
function loadPats(){
  const seen=new Set();
  const pats=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k)continue;
    // Match ALL patient key formats: kansei-data:xxx, pat:xxx, pat_xxx, kpat_xxx
    const isPatKey=k.startsWith('kansei-data:')||k.startsWith('pat:')||
                   (k.startsWith('pat_')&&!k.includes(':'))||
                   (k.startsWith('kpat_')&&!k.includes(':'));
    if(isPatKey){
      try{
        const v=localStorage.getItem(k);
        if(!v)continue;
        const p=JSON.parse(v);
        if(p&&p.id&&typeof p.id==='string'&&!seen.has(p.id)){
          seen.add(p.id);pats.push(p);
        }
      }catch{}
    }
  }
  S.patients=pats;
  S.patients.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  // Re-save under canonical key so future loads are consistent
  S.patients.forEach(p=>{try{localStorage.setItem('kansei-data:'+p.id,JSON.stringify(p));}catch{}});
}

// ── PHASE MANAGEMENT ──────────────────────────────────────────────────────────
function getCurrentPhase(pat) {
  return pat.phase || 1;
}

function setPhase(phaseId) {
  if (!S.pat) return;
  const cur = getCurrentPhase(S.pat);
  if (phaseId < cur) {
    // Downgrade — ask for confirmation
    if (!confirm(`Justera ner till Fas ${phaseId}? Patienten återgår till en tidigare fas.`)) return;
  }
  S.pat = savePat({...S.pat, phase: phaseId});
  rDetail();
}

function getPhasePromptAddition(phase) {
  const additions = {
    1: `\n\nBEHANDLINGSFAS: Fas 1 — Smärtlindring
Fokusera på: smärtlindrande övningar, lätt rörlighetsträning, avlastning, andning och avspänning.
UNDVIK: tung belastning, uthållighetsövningar, styrkeövningar.
Övningarna ska vara skonsamma, 0-3 NRS under och efter träning.`,
    2: `\n\nBEHANDLINGSFAS: Fas 2 — Stabilisering
Fokusera på: muskelstyrka, neuromuskulär kontroll, stabilisering, funktionella rörelsemönster.
Progressiv belastning är OK. Inkludera proprioception och balansövningar.
Bygga upp kapacitet steg för steg.`,
    3: `\n\nBEHANDLINGSFAS: Fas 3 — Underhåll & friskvård
Fokusera på: upprätthålla styrka och rörlighet, förebygga återfall, generell friskvård.
Varierande träning, aerob kondition, livsstilsråd för långsiktig hälsa.
Patienten ska kunna självhantera.`
  };
  return additions[phase] || '';
}

function renderPhaseBar(pat) {
  const cur = getCurrentPhase(pat);
  const ph = PHASES[cur-1];
  const next = PHASES[cur];
  const lastVisit = pat.visits && pat.visits[0];
  const lastDate = lastVisit && lastVisit.date;
  const fw = lastVisit && lastVisit.form && lastVisit.form.followup;
  let nextDue = '';
  if (lastDate && fw) {
    const d = new Date(lastDate); d.setDate(d.getDate() + fw*7);
    nextDue = d.toLocaleDateString('sv-SE', {day:'numeric',month:'short'});
  }
  const steps = PHASES.map(p => {
    const done = p.id < cur;
    const active = p.id === cur;
    const dotBg = active ? p.color : done ? 'var(--teal)' : 'var(--border)';
    const labelColor = active ? 'var(--navy)' : done ? 'var(--teal)' : 'var(--text4)';
    const weight = active ? '700' : '400';
    return `<div onclick="setPhase(${p.id})" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1">
      <div style="width:10px;height:10px;border-radius:50%;background:${dotBg};transition:background .15s"></div>
      <div style="font-size:9px;font-weight:${weight};color:${labelColor};text-align:center;letter-spacing:.04em">${p.label}</div>
    </div>`;
  });
  const connectors = `<div style="position:absolute;top:5px;left:calc(50%/3 + 5px);right:calc(50%/3 + 5px);height:1px;background:var(--border);z-index:0"></div>`;

  const back = cur > 1
    ? `<button class="btn" style="font-size:10px;padding:3px 9px;flex-shrink:0;color:var(--text3)" onclick="setPhase(${cur-1})">← ${PHASES[cur-2].label}</button>`
    : '';
  const advance = next
    ? `<button class="btn btn-p" style="font-size:10px;padding:3px 9px;flex-shrink:0" onclick="setPhase(${next.id})">→ ${next.label}</button>`
    : `<span style="font-size:10px;color:var(--green);font-weight:600">Slutförd</span>`;

  return `<div style="background:${ph.bg};border:1px solid ${ph.color}22;border-radius:10px;padding:10px 14px;margin-bottom:12px">

async function loadPassLog(visitId, patId) {
  const el = document.getElementById('passlog-' + visitId);
  if (!el) return;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/pass_log?visit_id=eq.${visitId}&order=logged_at.desc&limit=10`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!r.ok) { el.innerHTML = ''; return; }
    const rows = await r.json();
    if (!rows || !rows.length) { el.innerHTML = ''; return; }
    el.innerHTML = `<div style="padding:10px 12px;background:#e8f5ee;border-radius:8px;border-left:3px solid #4a9860">
      <div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1a5a30;margin-bottom:6px">Genomförda pass — ${rows.length} st</div>

      ${rows.length>5?`<div style="font-size:10px;color:#4a7a54;margin-top:3px">+ ${rows.length-5} tidigare</div>`:''}
    </div>`;
  } catch(e) { el.innerHTML = ''; }
}

const _escHandlers = {};
function addOverlayEsc(id) {
  if (_escHandlers[id]) document.removeEventListener('keydown', _escHandlers[id]);
  const h = e => { if (e.key === 'Escape') { const el = document.getElementById(id); if (el) el.remove(); document.removeEventListener('keydown', h); delete _escHandlers[id]; } };
  _escHandlers[id] = h;
  document.addEventListener('keydown', h);
}

function renderPatientSearchResults() {
  const q = (document.getElementById('rpf-search')?.value||'').toLowerCase().trim();
  const all = [...S.patients].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const results = (q ? all.filter(p => p.name?.toLowerCase().includes(q)||(p.birthdate&&p.birthdate.includes(q))) : all).slice(0,8);
  const c = document.getElementById('rpf-results');
  if (!c) return;
  if (!results.length) {
    c.innerHTML='<div style="text-align:center;padding:28px 0;color:#8a9aaa;font-size:13px">Inga träffar</div>';
    return;
  }

  const exs = prevVisit.plan?.exercises||[];
  let h = `<div style="background:#f0f8ff;border:1px solid #c8e0f0;border-radius:10px;padding:14px 16px;margin-bottom:16px">

  if (hasSoap) {
    ['S','O','A','P'].forEach(l => {

      const labels={S:'Subjektivt',O:'Objektivt',A:'Bedömning',P:'Plan'};
      h+=`<div style="margin-bottom:7px"><span style="font-size:9px;font-weight:700;color:#4a9aaa;letter-spacing:.06em">${labels[l]}</span><div style="font-size:12px;color:#2a3a4a;line-height:1.5;margin-top:2px">${e(soap[l])}</div></div>`;

}

let _meetingStopping = false;
let _meetingSessionId = 0;

function stopListening() {
  _meetingStopping = true;
  _meetingSessionId++;
  if (meetRecognition) {
    const r = meetRecognition;
    meetRecognition = null;
    r.onresult = null;
    r.onerror = null;
    r.onend = null;
    r.onstart = null;
    try { r.abort(); } catch(ignored) {}
  }
  meetInterim = '';
  const intEl = document.getElementById('meet-interim');
  const intLine = document.getElementById('meet-interim-line');
  if (intEl) intEl.textContent = '';
  if (intLine) intLine.style.display = 'none';
  const dot = document.getElementById('meet-dot');
  const txt = document.getElementById('meet-status-txt');
  if (dot) dot.className = 'meet-dot idle';
  if (txt) txt.textContent = 'Inspelning pausad';
  updateRecBtn(false);
  setTimeout(() => { _meetingStopping = false; }, 500);
}

async function startListening() {
  if (meetRecognition) return; // guard: already active

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Din webbläsare stöder inte röstinspelning. Använd Chrome (desktop) eller Safari (iPhone).');
    return;
  }

  // Show pending state — keep button as Starta while we wait for permission
  const dot0 = document.getElementById('meet-dot');
  const txt0 = document.getElementById('meet-status-txt');
  if (dot0) dot0.className = 'meet-dot idle';
  if (txt0) txt0.textContent = 'Väntar på mikrofontillstånd...';

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
    } catch(err) {
      if (txt0) txt0.textContent = 'Mikrofontillstånd nekades';
      alert('Mikrofontillstånd nekades.\n\nGå till webbläsarens inställningar → Sekretess → Mikrofon och tillåt denna sida.');
      return;
    }
  }

  // Abort if user pressed stop during the permission wait
  if (_meetingStopping || meetRecognition) return;

  _meetingStopping = false;
  const mySession = ++_meetingSessionId;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'sv-SE';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    if (meetRecognition !== rec) return;
    const d = document.getElementById('meet-dot');
    const t = document.getElementById('meet-status-txt');
    if (d) d.className = 'meet-dot listening';
    if (t) t.textContent = 'Lyssnar och transkriberar...';
    updateRecBtn(true);
  };

  rec.onresult = (event) => {
    if (meetRecognition !== rec) return;
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        const now = new Date();
        const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        meetTranscript.push({ time, text: text.trim() });
        meetInterim = '';
        appendTranscriptLine(time, text.trim());
      } else {
        interim += text;
      }
    }
    meetInterim = interim;
    const intEl = document.getElementById('meet-interim');
    const intLine = document.getElementById('meet-interim-line');
    if (intEl) intEl.textContent = interim;
    if (intLine) intLine.style.display = interim ? '' : 'none';
    updateDoneBtn();
  };

  rec.onerror = (event) => {
    if (meetRecognition !== rec) return;
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      meetRecognition = null;
      updateRecBtn(false);
      const t = document.getElementById('meet-status-txt');
      if (t) t.textContent = 'Mikrofontillstånd saknas';
    }
    // 'no-speech' and 'aborted' are normal during continuous recognition — ignore
  };

  rec.onend = () => {
    // Only restart if this exact session is still active
    if (meetRecognition !== rec) return;
    if (_meetingStopping) return;
    if (_meetingSessionId !== mySession) return;
    setTimeout(() => {
      if (meetRecognition !== rec || _meetingStopping || _meetingSessionId !== mySession) return;
      try {
        rec.start();
      } catch(e) {
        // Restart failed — show resume button
        meetRecognition = null;
        updateRecBtn(false);
        const t = document.getElementById('meet-status-txt');
        if (t) t.textContent = 'Avbruten — tryck Fortsätt';
      }
    }, 300);
  };

  // Assign to global ONLY after setting up all handlers
  meetRecognition = rec;

  try {
    rec.start();
  } catch(e) {
    meetRecognition = null;
    updateRecBtn(false);
    if (txt0) txt0.textContent = 'Kunde inte starta';
    alert('Kunde inte starta inspelning: ' + e.message);
  }
}

function triggerClinicalAnalysis(text) {
  clearTimeout(clinicalAnalysisDebounce);

async function runClinicalAnalysis(text) {
  if (!text || text.trim().length < 30) return;
  if (text.trim() === lastAnalyzedText.trim()) return;
  lastAnalyzedText = text.trim();
  const key = getKey();
  if (!key) return;
  const panel = document.getElementById('clinical-panel-body');
  if (!panel) return;

  // Update status indicator
  const pulse = document.getElementById('clin-pulse');
  const status = document.getElementById('clin-status');
  if (pulse) pulse.style.background = '#4a9aaa';
  if (status) status.textContent = '— analyserar...';

  panel.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:12px;color:#4a9aaa;font-size:12px"><div style="width:6px;height:6px;border-radius:50%;background:#4a9aaa;animation:pulse 1s infinite"></div>Analyserar...</div>`;
  const patInfo = S.pat ? (() => {
    const p = S.pat;
    const prevVisits = (p.visits||[]).slice(0,3).map(v => {
      const soap = v.journal?.soap || v.soap || {};
      const d = v.date||'';
      return `Besök ${d}: ${[soap.A,soap.P].filter(Boolean).join(' | ')}`;
    }).filter(s=>s.length>10).join('\n');
    return `Patient: ${p.name}, f.${p.birthdate||p.birthYear||'?'}, diagnos: ${p.diagnosis||'okänd'}${prevVisits?'\nTidigare besök:\n'+prevVisits:''}`;
  })() : '';
  const prompt = `Du är erfaren klinisk fysioterapeut som handleder en kollega i realtid. Analysera materialet nedan. Svara ENBART med JSON utan backticks.\n\n${patInfo}\n\nTEXT/TRANSKRIPT:\n${text.slice(-2000)}\n\nJSON-format:\n{"tentativeDiagnosis":[{"name":"Diagnos","icd10":"M54.5","probability":"Hög","reasoning":"kortfattad motivering"}],"redFlags":[],"missingInfo":["fråga 1","fråga 2"],"priorityTests":[{"test":"Testnamn","rationale":"varför","finding":"förväntat fynd"}],"treatmentGuidelines":["riktlinje 1","riktlinje 2"],"nextStep":"Vad du bör göra härnäst"}\n\nViktigt: icd10 ska vara exakt ICD-10 kod (t.ex. M54.5, M75.1, S83.2). Inkludera alltid icd10 i varje diagnos.`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL_HAIKU,max_tokens:1200,system:"Svara ALLTID med giltig JSON. Inga backticks.",messages:[{role:"user",content:prompt}]})});
    const data = await res.json();
    const txt = (data.content||[]).map(b=>b.text||'').join('');
    const cleaned = txt.replace(/```json|```/g,'').trim();
    if (!cleaned) throw new Error('Tomt API-svar (stop_reason: '+(data.stop_reason||'?')+')');
    const result = JSON.parse(cleaned);
    renderClinicalPanel(result);
  } catch(err) {
    console.error('Clinical AI error:', err);
    if (panel) panel.innerHTML = `<div style="padding:12px;font-size:11px;color:#8a9aaa">Analys misslyckades: ${e(err.message||'okänt fel')}</div>`;
  }
}

    liveSoap[l] = (el && el.value) || (currentSOAP.soap && currentSOAP.soap[l]) || '';
  });
  const mergedSoap = {...(currentSOAP.soap||{}), ...liveSoap};
  const soapText = ['S','O','A','P'].map(l => `${l}: ${mergedSoap[l]||''}`).join('\n\n');

  // If adding to an existing visit, update it in place
  const existingId = currentSOAP.existingVisitId;
  let vid;
  let updVisits;
  if (existingId && (p.visits||[]).find(v => v.id === existingId)) {
    vid = existingId;
    updVisits = (p.visits||[]).map(v => v.id === existingId
      ? {...v, soap: mergedSoap, note: soapText, transcript: currentSOAP.transcript, soapMeta: {...currentSOAP, soap: mergedSoap}}
      : v
    );
  } else {
    vid = 'v_' + Date.now();
    const svc = window._pendingService || {};
    const newVisit = {
      id: vid,
      date: currentSOAP.date,
      form: null, plan: null, status: 'Aktiv',
      note: soapText,
      soap: mergedSoap,
      transcript: currentSOAP.transcript,
      soapMeta: {...currentSOAP, soap: mergedSoap},
      service: svc.name || '',
      servicePrice: svc.price || 0,
    };
    window._pendingService = null;
    updVisits = [newVisit, ...(p.visits||[])];
  }

  const isFirstVisit = !(p.visits||[]).length;
  const updPat = {...p, diagnosis: diag, visits: updVisits};
  const saved = savePat(updPat);
  S.pat = saved;
  S.visitId = vid;

  if (isFirstVisit || !(p.diagnoses||[]).length) {
    setTimeout(() => aiExtractDiagnoses(saved.id), 1500);
  }

  if (goToPlan) {
    // Pre-fill form from SOAP analysis
    S.form = {
      name: p.name || '',
      birthdate: p.birthdate || "", birthYear: p.birthYear || 1980,
      diagnosis: currentSOAP.diagnosis || diag,
      customDiag: currentSOAP.customDiagnosis || '',
      pain: currentSOAP.pain || 5,
      history: currentSOAP.history || 'ingen',
      knowledge: currentSOAP.knowledge || 'låg',
      location: currentSOAP.location || 'hem',
      motivation: currentSOAP.motivation || 6,
      exercises: currentSOAP.exercises || 5,
      followup: currentSOAP.followup || 4,
      notes: currentSOAP.clinicalFocus || ''
    };
    resetMeeting();
    go('form');
  }
}

async function finishManualSOAP(goPlan) {
  // Read values
  const soap = {
    S: document.getElementById('ms-S').value.trim(),
    O: document.getElementById('ms-O').value.trim(),
    A: document.getElementById('ms-A').value.trim(),
    P: document.getElementById('ms-P').value.trim()
  };
  const diagnosis = document.getElementById('ms-diag').value;
  const customDiagnosis = document.getElementById('ms-custom').value.trim();
  const icd10 = document.getElementById('ms-icd').value.trim();
  const icd10desc = document.getElementById('ms-icddesc').value.trim();
  
  // If any SOAP content exists, use AI to extract rehab params
  const soapText = [soap.S,soap.O,soap.A,soap.P].filter(Boolean).join('\n');
  const key = getKey();
  
  if (soapText && key) {
    S.loadStep = 1; go('loading');
    try {
      S.loadStep = 2;
      const prompt = `Analysera denna SOAP-journalanteckning och extrahera rehabparametrar. Svara ENBART med JSON utan backticks.

SOAP:
S: ${soap.S}
O: ${soap.O}
A: ${soap.A}
P: ${soap.P}
Diagnos: ${diagnosis}

JSON:
{"pain":5,"motivation":6,"history":"ingen","knowledge":"låg","location":"hem","exercises":5,"followup":4,"clinicalFocus":"specifika fynd och fokusområden"}

pain 0-10, motivation 1-10, history: ingen/sporadisk/regelbunden, knowledge: låg/medel/hög, location: hem/gym`;
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL_HAIKU,max_tokens:500,system:"Svara ALLTID med giltig JSON. Inga backticks.",messages:[{role:"user",content:prompt}]})});
      S.loadStep = 3;
      const data = await res.json();
      const text = (data.content||[]).map(b=>b.text||'').join('');
      const cleaned = text.replace(/```json|```/g,'').trim();
      if (!cleaned) throw new Error('Tomt svar');
      const params = JSON.parse(cleaned);
      currentSOAP = {...currentSOAP, ...params, soap, diagnosis, customDiagnosis, icd10, icd10desc};
    } catch(err) {
      // Fallback without AI params
      currentSOAP = {...currentSOAP, soap, diagnosis, customDiagnosis, icd10, icd10desc};
    }
  } else {
    currentSOAP = {...currentSOAP, soap, diagnosis, customDiagnosis, icd10, icd10desc};
  }

  if (goPlan) {
    await saveSOAPToVisit(true);
  } else {
    go('soap');
  }
}

// ── PAIN CHART ────────────────────────────────────────────────────────────────
function renderPainChart(visits) {
  const pts = [...visits].reverse().filter(v=>v.form&&v.form.pain!=null).slice(0,10);
  if (pts.length < 2) return '';
  const W=340, H=70, PAD=10;
  const vals = pts.map(v=>v.form.pain);
  const min=0, max=10;
  const xStep = (W-PAD*2)/(pts.length-1);
  const yScale = (H-PAD*2)/(max-min);
  const points = vals.map((v,i)=>({
    x: PAD+i*xStep,
    y: H-PAD-(v-min)*yScale
  }));
  const path = points.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');
  const area = path + ` L${points[points.length-1].x},${H-PAD} L${PAD},${H-PAD} Z`;
  const dots = points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${vals[i]>=7?'#c07070':vals[i]>=4?'#c8a030':'#5a9860'}"/>`).join('');
  const labels = points.map((p,i)=>`<text x="${p.x}" y="${H}" font-size="7" fill="#3a4a5a" text-anchor="middle">${pts[i].date.slice(5)}</text>`).join('');
  return `<div class="chart-wrap">
    <div class="chart-title">Smärtutveckling (NRS)</div>
    <div class="chart-svg-wrap">
      <svg width="100%" viewBox="0 0 ${W} ${H+12}" preserveAspectRatio="xMidYMid meet">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a7a8a" stop-opacity="0.18"/><stop offset="100%" stop-color="#2a7a8a" stop-opacity="0"/></linearGradient></defs>
        <line x1="${PAD}" y1="${PAD}" x2="${PAD}" y2="${H-PAD}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        ${[0,5,10].map(v=>`<text x="${PAD-3}" y="${H-PAD-(v-min)*yScale+3}" font-size="7" fill="#3a4a5a" text-anchor="end">${v}</text>`).join('')}
        <path d="${area}" fill="url(#ag)"/>
        <path d="${path}" fill="none" stroke="#2a7a8a" stroke-width="1.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>
  </div>`;
}

function exportBackup(silent) {
  // Collect all patients from both storage key formats
  const seen = new Set();
  const patients = [];
  S.patients.forEach(p => { if (p&&p.id&&!seen.has(p.id)) { seen.add(p.id); patients.push(p); } });
  // Also sweep localStorage for any orphaned keys
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k.startsWith('pat:') || k.startsWith('kansei-data:') || k.startsWith('kpat_')) {
      try {
        const p = JSON.parse(localStorage.getItem(k));
        if (p&&p.id&&!seen.has(p.id)) { seen.add(p.id); patients.push(p); }
      } catch(e) {}
    }
  }
  // Also collect economics user entries
  const ekEntries = (() => { try { return JSON.parse(localStorage.getItem('kansei-ek:intakter')||'[]'); } catch(e){return[];} })();

  const data = {
    appName: 'Zenya',
    version: 2,
    exported: new Date().toISOString(),
    exportedReadable: new Date().toLocaleString('sv-SE'),
    patientCount: patients.length,
    patients,
    
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
  a.download = `zenya-export-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (!silent) showAutoSaveToast('Backup nedladdad');
  return patients.length;
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      // Support both old format (patients array) and new format (version 2)
      const patients = data.patients;
      if (!patients||!Array.isArray(patients)) { alert('Ogiltig backupfil — inga patienter hittades.'); return; }
      let count = 0;
      patients.forEach(p => {
        if (p&&p.id) {
          localStorage.setItem('kansei-data:'+p.id, JSON.stringify(p));
          localStorage.setItem('pat:'+p.id, JSON.stringify(p));
          count++;
        }
      });
      // Import economics user entries if present
      if (data.ekonomi&&data.ekonomi.userEntries&&Array.isArray(data.ekonomi.userEntries)) {
        localStorage.setItem('kansei-ek:intakter', JSON.stringify(data.ekonomi.userEntries));
      }
      alert(`${count} patienter importerade från backup (${data.exportedReadable||data.exported||'okänt datum'}).\n\nSidan laddas om.`);
      loadPats();
      go('dashboard');
    } catch(err) { alert('Kunde inte läsa filen: '+err.message); }
  };
  input.click();
}

// ── SMÄRTGRAF ─────────────────────────────────────────────────────────────────

function renderPainGraph(pat) {
  const visits = (pat.visits||[]).slice().reverse(); // oldest first
  const painPoints = visits.filter(v => v.form && v.form.pain != null);
  if (painPoints.length < 2) return ''; // need at least 2 points

  const W = 280, H = 60, PAD = 8;
  const n = painPoints.length;
  const xs = painPoints.map((_, i) => PAD + (i / (n - 1)) * (W - PAD * 2));
  const ys = painPoints.map(v => PAD + ((10 - v.form.pain) / 10) * (H - PAD * 2));

  // polyline
  const pts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');

  // color: improving = green, worsening = red
  const first = painPoints[0].form.pain;
  const last = painPoints[painPoints.length-1].form.pain;
  const trend = last < first ? '#4a9860' : last > first ? '#c07070' : '#4a9aaa';

  // dots + labels
  let dots = '';
  painPoints.forEach((v, i) => {
    dots += `<circle cx="${xs[i]}" cy="${ys[i]}" r="3" fill="${trend}" opacity="0.9"/>`;
    if (i === 0 || i === n-1) {
      const anchor = i === 0 ? 'start' : 'end';
      dots += `<text x="${xs[i]}" y="${H - 1}" text-anchor="${anchor}" font-size="8" fill="#5a6a7a">${v.form.pain}/10</text>`;
      dots += `<text x="${xs[i]}" y="${H + 9}" text-anchor="${anchor}" font-size="7" fill="#8a9aaa">${v.date||''}</text>`;
    }
  });

  const arrow = last < first ? '↓ Förbättring' : last > first ? '↑ Försämring' : '→ Oförändrad';
  const diff = Math.abs(last - first);

  return `<div style="margin:12px 0 4px;padding:12px 14px;background:white;border:1px solid var(--border);border-radius:8px">
    <div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">
      Smärtutveckling (NRS) &nbsp;<span style="color:${trend};font-size:11px">${arrow} ${diff > 0 ? diff + ' enheter' : ''}</span>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H + 14}" style="overflow:visible">
      <polyline points="${pts}" fill="none" stroke="${trend}" stroke-width="2" stroke-linejoin="round" opacity="0.7"/>
      ${dots}
    </svg>
  </div>`;
}

function buildMailBody(vid, liveUrl, inclLink, inclPdf) {

  const clinic = CLINIC;

  // Followup date

  const visitDate = v.date;
  let followupLine = '';
  if (fw && visitDate) {
    const d = new Date(visitDate); d.setDate(d.getDate()+fw*7);
    const dateStr = d.toLocaleDateString('sv-SE',{day:'numeric',month:'long',year:'numeric'});
    followupLine = `
Rekommenderat återbesök: ${dateStr}
`;
  }

  let body = `Hej ${firstName},

    body += `

  }

  if (inclPdf) {
    body += `
En PDF-version av planen bifogas separat — öppna och skriv ut vid behov.
`;
  }

  body += followupLine;
  body += `
Hör gärna av dig om du har frågor.

Med vänliga hälsningar,
${clinic.name}
${clinic.phone}
${clinic.email}`;
  return body;
}

function updateMailPreview(vid, liveUrl) {

function sendMailDialog(vid, encodedUrl) {
  const liveUrl = decodeURIComponent(encodedUrl);
  const inclLink = document.getElementById('md-link')?.checked ?? true;
  const inclPdf = document.getElementById('md-pdf')?.checked ?? false;

  {pattern: /steroidbehandling|immunosuppression|immundämpande/i, label: 'Immunosuppression', msg: 'Patient med immunosuppression — ökad risk för atypiska infektioner.'},
  {pattern: /cancer|tumör|malignitet|onkologi/i, label: 'Cancerhistorik', msg: 'Cancerhistorik — rygg-/ledsmärta kan vara metastas.'},
  {pattern: /neurologisk\s*bortfall|förlamning|pares|pareser/i, label: 'Neurologisk bortfall', msg: 'Neurologiska bortfall — prioritera neurologisk utredning.'},
  {pattern: /trauma|fall\s*från\s*höjd|trafikolycka/i, label: 'Allvarligt trauma', msg: 'Allvarligt trauma — uteslut fraktur.'},
  {pattern: /progressiv|tilltagande\s*svaghet/i, label: 'Progressiv svaghet', msg: 'Progressiv motorisk svaghet — neurologisk utredning prioriteras.'},
];

function checkRedFlags(soapText) {
  if (!soapText) return [];
  const found = [];
  RED_FLAGS.forEach(f => {
    if (f.pattern.test(soapText)) found.push(f);
  });
  return found;
}

function renderRedFlagBanner(flags) {
  if (!flags || !flags.length) return '';
  const items = flags.map(f => `<div class="rf-item"><strong>${f.label}:</strong> ${f.msg}</div>`).join('');
  return `<div class="rf-banner">
    <div class="rf-title">Röda flaggor detekterade — granska innan behandling</div>
    ${items}
  </div>`;
}

async function generateProgressNote(pat) {
  const visits = (pat.visits||[]).slice(); // newest first
  if (visits.length < 1) return null;
  const key = getKey();
  if (!key) return null;

  // Build a structured summary of ALL visits
  const visitSummaries = visits.map((v, i) => {
    const soap = v.soap ? Object.entries(v.soap).filter(([,val])=>val).map(([k,val])=>`  ${k}: ${val}`).join('\n') : '';
    const pain = v.form?.pain ?? v.soapMeta?.pain ?? '—';
    const diag = v.form?.diagnosis || v.plan?.diagnosis || '';
    const planSummary = v.plan?.exercises?.length
      ? `  Plan: ${v.plan.exercises.length} övningar (${v.plan.exercises.slice(0,3).map(e=>e.name).join(', ')}${v.plan.exercises.length>3?'...':''})`
      : '';
    return `Besök ${visits.length - i} (${v.date||'okänt datum'})${diag?' — '+diag:''}:\n  NRS: ${pain}/10\n${soap}${planSummary}`;
  }).join('\n\n');

  // Detect time gaps
  const dateFirst = visits[visits.length-1]?.date;
  const dateLast = visits[0]?.date;
  const totalMonths = (dateFirst && dateLast)
    ? Math.round((new Date(dateLast)-new Date(dateFirst)) / (1000*60*60*24*30))
    : null;

  const timeContext = totalMonths !== null
    ? (totalMonths > 12
        ? `Patienten har ett långt uppföljningsförlopp (${totalMonths} månader) med möjliga uppehåll. Ta hänsyn till tidsgapen mellan besök.`
        : `Besöken sträcker sig över ${totalMonths} månader.`)
    : '';

  const prompt = `Du är leg. fysioterapeut. Analysera patientens besökshistorik och svara ENBART med JSON utan backticks.

Patient: ${pat.name||'Okänd'}, ${pat.diagnosis||'—'}
${timeContext}

Besöksöversikt:
${visitSummaries}

JSON-format:
{
  "trend": "1-2 meningar om smärttrend och förlopp (NRS-värden, riktning)",
  "function": "1-2 meningar om funktionsutveckling och compliance med övningsprogram",
  "findings": "1-2 meningar om viktiga kliniska fynd eller varningssignaler (skriv 'Inga röda flaggor noterade.' om inget anmärkningsvärt)",
  "recommendation": "1-2 meningar om konkret rekommendation inför nästa besök",
  "phase": "Aktuell fas och motivering i en mening",
  "flag": true eller false (true om det finns röda flaggor eller remissbehov)
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:MODEL_HAIKU, max_tokens:700, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    return JSON.parse(raw.replace(/```json|```/g,'').trim());
  } catch(e) {
    return null;
  }
}

let _authUser = null;

async function sbSignIn(email, password) {
  try {
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.access_token) {
      _authUser = data.user;
      localStorage.setItem('kansei:auth', JSON.stringify({ token: data.access_token, user: data.user, exp: Date.now() + (data.expires_in||3600)*1000 }));
      return { ok: true };
    }
    return { ok: false, msg: data.error_description || data.msg || 'Fel e-post eller lösenord.' };
  } catch(e) {
    return { ok: false, msg: 'Anslutningsfel — kontrollera internet.' };
  }
}

async function sbSignOut() {
  localStorage.removeItem('kansei:auth');
  _authUser = null;
  rLogin();
}

function getStoredAuth() {
  try {
    const a = JSON.parse(localStorage.getItem('kansei:auth')||'null');
    if (a && a.exp > Date.now()) return a;
    return null;
  } catch { return null; }
}

async function doLogin() {
  const email = document.getElementById('l-email')?.value?.trim();
  const pass = document.getElementById('l-pass')?.value;
  const errEl = document.getElementById('l-err');
  if (!email || !pass) { if(errEl) errEl.textContent = 'Fyll i e-post och lösenord.'; return; }
  const btn = document.getElementById('ln-submit') || document.querySelector('.ln-btn');
  if (btn) { btn.textContent = 'Loggar in...'; btn.disabled = true; }
  const result = await sbSignIn(email, pass);
  if (btn) { btn.textContent = 'Logga in'; btn.disabled = false; }
  if (result.ok) {
    const tb = document.querySelector('.topbar');
    if (tb) tb.style.display = '';
    const cb = document.getElementById('crash-banner');
    if (cb) cb.style.display = 'none'; // keep hidden unless crash occurs
    const at = document.getElementById('autosave-toast');
    if (at) at.style.display = '';
    loadPats(); S.apiKey = getKey(); startAutoSave(); go('dashboard');
    setTimeout(() => syncFromCloud(), 800);
  } else {
    if (errEl) errEl.textContent = result.msg;
  }
}
