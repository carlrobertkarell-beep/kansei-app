async function _agentProgressPlan(p, visit) {
  const key = getKey(); if (!key) return;
  if (!visit.plan?.exercises?.length) return;
  try {
    // Simple progression: increase sets/reps by 1 step on all exercises
    const exercises = visit.plan.exercises.map(ex => ({
      ...ex,
      sets: ex.sets ? Math.min(parseInt(ex.sets)+1, 5) : ex.sets,
      reps: ex.reps ? (ex.reps.includes('-')
        ? ex.reps.replace(/(\d+)-(\d+)/, (_,a,b) => `${parseInt(a)+2}-${parseInt(b)+2}`)
        : String(parseInt(ex.reps)+2))
        : ex.reps,
    }));
    const updated = { ...visit.plan, exercises, _agentProgressed: new Date().toISOString() };
    const idx = p.visits.findIndex(v => v.id === visit.id);
    if (idx >= 0) { p.visits[idx] = { ...visit, plan: updated }; savePat(p); }
    addInboxItem(p.id, p.name, 'ai_action', 'plan_progressed',
      'Plan automatiskt progredierad',
      'Låg smärta + hög följsamhet — AI ökade belastning ett steg.',
      [{ label:'Granska plan', style:'primary', fn:`openDetail:${p.id}` }]
    );
  } catch {}
}

// ── SPÅR 2: KONTEXTUELLA MEDDELANDEN PÅ PATIENTSIDAN ────────────────────────
// Körs i patientens webbläsare — ingen inloggning, ingen server.
// Läser zenya:exsession:* från localStorage och räknar ut passhistorik.

function zpGetExSessionHistory(patId, visitId) {
  const prefix = 'zenya:exsession:' + patId + ':' + visitId + ':';
  const sessions = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) {
        const date = k.slice(prefix.length);
        const state = JSON.parse(localStorage.getItem(k) || '{}');
        const done = Object.values(state).filter(Boolean).length;
        sessions.push({ date, done, state });
      }
    }
  } catch(e) {}
  // Sort newest first
  return sessions.sort((a,b) => b.date.localeCompare(a.date));
}

function zpContextualMsg(pat, visitId, plan) {
  const patId = pat?.id;
  if (!patId || !visitId) return '';

  const sessions = zpGetExSessionHistory(patId, visitId);
  const total = (plan?.exercises||[]).length;
  const today = new Date().toISOString().slice(0,10);
  const todaySession = sessions.find(s => s.date === today);
  const todayDone = todaySession ? Object.values(todaySession.state).filter(Boolean).length : 0;

  // Days since last session
  const lastSession = sessions[0];
  const daysSinceLast = lastSession
    ? Math.round((Date.now() - new Date(lastSession.date).getTime()) / (1000*60*60*24))
    : null;

  // Streak — consecutive days with at least 1 exercise done
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 30; i++) {
    const dateStr = new Date(d - i*86400000).toISOString().slice(0,10);
    const s = sessions.find(x => x.date === dateStr);
    if (s && s.done > 0) streak++;
    else if (i > 0) break; // streak broken
  }

  // Full completions (all exercises done)
  const fullPasses = sessions.filter(s => total > 0 && s.done >= total).length;

  // ── Pick the most relevant message ──────────────────────────────────────
  let icon = '', title = '', body = '', color = 'rgba(255,255,255,.08)', borderColor = 'rgba(255,255,255,.1)';

  if (total > 0 && todayDone >= total) {
    // All done today — celebration
    icon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3dcfbd" stroke-width="2.2" stroke-linecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    title = 'Bra jobbat idag!';
    body = `Du har klarat alla ${total} övningar. ${fullPasses > 1 ? 'Det här är ditt ' + fullPasses + ':e fullständiga pass — imponerande.' : 'Varje pass räknas.'}`;
    color = 'rgba(13,155,138,.15)'; borderColor = 'rgba(13,155,138,.3)';
  } else if (streak >= 5) {
    // Long streak
    icon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0c040" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
    title = `${streak} dagar i rad`;
    body = 'Du håller en imponerande streak — kroppen anpassar sig och bygger kapacitet varje dag du fortsätter.';
    color = 'rgba(240,192,64,.12)'; borderColor = 'rgba(240,192,64,.25)';
  } else if (streak >= 3) {
    icon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3dcfbd" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
    title = `${streak} dagar i rad`;
    body = 'Du har byggt ett momentum. Håll i det — vanan befästs nu.';
    color = 'rgba(13,155,138,.12)'; borderColor = 'rgba(13,155,138,.25)';
  } else if (daysSinceLast !== null && daysSinceLast >= 4 && daysSinceLast < 10) {
    // Returned after a break
    icon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round"><path d="M21 12A9 9 0 1 1 3.6 7.6"/><polyline points="3 3 3.6 7.6 8 8"/></svg>`;
    title = 'Välkommen tillbaka';
    body = 'Det är okej att ha tagit en paus. Börja mjukt idag — lite rörelse är alltid bättre än ingen.';
  } else if (fullPasses >= 10) {
    icon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3dcfbd" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
    title = `${fullPasses} genomförda pass`;
    body = 'Du har lagt ner ett seriöst arbete i din rehabilitering. Din behandlare ser din progression.';
    color = 'rgba(13,155,138,.12)'; borderColor = 'rgba(13,155,138,.25)';
  } else {
    return ''; // Inget tillräckligt relevant att visa
  }

  return `<div style="margin:0 14px 14px;padding:14px 16px;background:${color};border:1px solid ${borderColor};border-radius:14px">
    <div style="display:flex;align-items:flex-start;gap:11px">
      <div style="flex-shrink:0;margin-top:2px">${icon}</div>
      <div>
        <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.85);margin-bottom:4px">${title}</div>
        <div style="font-size:12px;color:rgba(255,255,255,.55);line-height:1.6">${body}</div>
      </div>
    </div>
  </div>`;
}

async function generateBriefing(pat) {
  const key = getKey();
  if (!key || !pat) return;
  if ((pat.visits || []).length === 0) {
    const wrap = document.getElementById('briefing-' + pat.id);
    if (wrap) wrap.style.display = 'none';
    return;
  }

  // Check cache
  const cached = getBriefingCache(pat.id);
  if (cached) {
    const wrap = document.getElementById('briefing-' + pat.id);
    if (wrap) wrap.outerHTML = renderBriefingContent(pat.id, cached.data);
    return;
  }

  // Build context
  const visits = (pat.visits || []);
  const lastVisit = visits[0];
  const passLogs = getPassLogs(pat.id);
  const recentLogs = passLogs.slice(0, 6);
  const avgPain = recentLogs.length
    ? (recentLogs.reduce((s,l) => s + (l.pain||0), 0) / recentLogs.length).toFixed(1)
    : null;
  const completionRate = recentLogs.length
    ? Math.round(recentLogs.filter(l => l.done === 'all' || l.done === 'most').length / recentLogs.length * 100)
    : null;

  const visitSummaries = visits.slice(0, 3).map((v, i) => {
    const soap = v.soap ? Object.entries(v.soap).filter(([,val])=>val).map(([k,val])=>`${k}: ${val}`).join(' | ') : '';
    const pain = v.form?.pain ?? v.soapMeta?.pain ?? '—';
    return `Besök ${i+1} (${v.date||'okänt'}): NRS ${pain}/10${soap ? ' | '+soap : ''}`;
  }).join('\n');

  const passContext = recentLogs.length
    ? `Senaste ${recentLogs.length} pass: snittsmärta ${avgPain}/10, genomförandegrad ${completionRate}%`
    : 'Inga loggade hempass ännu.';

  const diagList = pat.diagnoses?.length ? pat.diagnoses.join(', ') : (pat.diagnosis || '—');
  const daysSinceLast = lastVisit?.date
    ? Math.round((Date.now() - new Date(lastVisit.date)) / (1000*60*60*24))
    : null;

  const prompt = `Du är en erfaren klinisk kollega som briefar en naprapatt/fysioterapeut inför ett patientbesök. Ge en KORTFATTAD, KLINISKT RELEVANT briefing. Svara ENBART med JSON utan backticks.

Patient: ${pat.name||'Okänd'}, ${pat.birthdate||'ålder okänd'}
Diagnoser: ${diagList}
Antal besök totalt: ${visits.length}
${daysSinceLast !== null ? `Dagar sedan senaste besök: ${daysSinceLast}` : ''}

Besökshistorik (senaste 3):
${visitSummaries}

Hemträning:
${passContext}

JSON-format:
{
  "points": [
    {"text": "kort klinisk observation (max 25 ord)", "color": "green|amber|red|teal|blue"},
    ...max 5 punkter
  ],
  "questions": ["Fråga att ställa idag (konkret, max 15 ord)", ...max 3 frågor]
}

Regler:
- Varje punkt ska vara KONKRET och HANDLINGSBAR — inte generell
- Använd red för varningssignaler, amber för saker att bevaka, green för positiv trend, teal för neutral info, blue för frågor/osäkerhet
- Om smärtan ökat: red. Om genomförandegrad under 50%: amber. Om god progress: green.
- Frågorna ska vara specifika och kliniskt relevanta för just den här patienten
- Max 5 punkter, max 3 frågor`;

  try {
    const key = getKey();
    if (!key) throw new Error('no-key');
    const result = await callAPI(prompt, [], key, MODEL_HAIKU);
    const briefing = typeof result === 'string' ? JSON.parse(result.replace(/```json|```/g,'').trim()) : result;
    setBriefingCache(pat.id, briefing);
    const wrap = document.getElementById('briefing-' + pat.id);
    if (wrap) wrap.outerHTML = renderBriefingContent(pat.id, briefing);
  } catch (err) {
    const wrap = document.getElementById('briefing-' + pat.id);
    const noKey = !getKey() || !getKey().startsWith('sk-ant');
    if (wrap) wrap.innerHTML = `<div class="briefing-error" style="flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;background:#fafbfc;border-radius:10px">
      <div style="display:flex;align-items:center;gap:7px;color:#8a9aaa;font-size:11px;font-weight:600">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#bbc4cc" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Briefing kunde inte genereras
      </div>
      <div style="font-size:11px;color:#aab0ba;line-height:1.5">${noKey ? 'API-nyckel saknas — kontrollera Inställningar.' : 'API-anropet misslyckades. Kontrollera internetanslutning.'}</div>
      <button class="briefing-regen" onclick="regenBriefing('${e(pat.id)}')" style="margin-top:2px;font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid #dde6ee;background:white;cursor:pointer;color:#5a6a7a;font-family:inherit;font-weight:600">Försök igen</button>
    </div>`;
  }
}

function sendQuickMsg(patId, idx) {
  const q = MSG_QUICK[idx];
  if (!q) return;
  _dispatchMsg(patId, q.text, 'quick');
}

function sendCustomMsg(patId) {
  const inp = document.getElementById('msg-input-' + patId);
  const text = inp ? inp.value.trim() : '';
  if (!text) return;
  _dispatchMsg(patId, text, 'custom');
  if (inp) inp.value = '';
}

function _dispatchMsg(patId, text, type) {
  const p = S.patients.find(x => x.id === patId) || S.pat;
  if (!p) return;
  if (!p.messages) p.messages = [];
  const msg = {
    id: 'msg_' + Date.now(),
    from: 'therapist',
    type,
    text,
    ts: new Date().toISOString(),
    read: true,
    reply: null,
    replyTs: null,
  };
  p.messages.unshift(msg); // newest first in storage
  savePat(p);
  // Re-render panel
  const panel = document.getElementById('msg-panel-' + patId);
  if (panel) {
    panel.outerHTML = renderMsgPanel(patId);
    // Re-open
    const newBody = document.getElementById('msg-panel-body-' + patId);
    const newChev = document.getElementById('msg-panel-chev-' + patId);
    if (newBody) newBody.style.display = 'block';
    if (newChev) newChev.style.transform = 'rotate(90deg)';
    setTimeout(() => {
      const list = document.getElementById('msg-list-' + patId);
      if (list) list.scrollTop = list.scrollHeight;
    }, 50);
  }
}

async function submitPatientReply(patId, msgId, replyText) {
  // We need to load fresh from Supabase, update, and push back
  const btn = document.getElementById('zp-reply-btn-' + replyText.replace(/\s/g,''));
  document.querySelectorAll('.zp-reply-btn').forEach(b => b.disabled = true);
  const statusEl = document.getElementById('zp-reply-status');
  if (statusEl) statusEl.textContent = 'Skickar...';

  try {
    // Fetch latest patient data from Supabase
    const SB_URL = 'https://wyahrvaqqufkjogamckm.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5YWhydmFxcXVma2pvZ2FtY2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI3MzY1ODMsImV4cCI6MjA1ODMxMjU4M30.b7oXuCaEXFE45HMIXMgpUKJ_bMXWNNuN-UiN-WEVS14';
    const res = await fetch(`${SB_URL}/rest/v1/patients?id=eq.${encodeURIComponent(patId)}&select=data`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) throw new Error('fetch failed');
    const rows = await res.json();
    if (!rows.length) throw new Error('patient not found');
    const pat = typeof rows[0].data === 'string' ? JSON.parse(rows[0].data) : rows[0].data;

    // Find message and attach reply
    const msg = (pat.messages || []).find(m => m.id === msgId);
    if (msg && !msg.reply) {
      msg.reply = replyText;
      msg.replyTs = new Date().toISOString();
      // Add a patient-from message too for thread view
      if (!pat.messages) pat.messages = [];
      pat.messages.unshift({
        id: 'msg_' + Date.now(),
        from: 'patient',
        type: 'reply',
        text: replyText,
        ts: new Date().toISOString(),
        read: false,
        replyToId: msgId,
      });
    }

    // Push back to Supabase
    const upsertRes = await fetch(`${SB_URL}/rest/v1/patients?id=eq.${encodeURIComponent(patId)}`, {
      method: 'PATCH',
      headers: {
        'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ data: pat, updated_at: new Date().toISOString() })
    });

    if (upsertRes.ok) {
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:#3dcfbd;font-weight:600">✓ Svar skickat!</span>';
      }
      document.querySelectorAll('.zp-reply-btn').forEach(b => {
        if (b.textContent.trim() === replyText) b.classList.add('selected');
      });
    } else {
      throw new Error('upsert failed');
    }
  } catch(err) {
    if (statusEl) statusEl.textContent = 'Kunde inte skicka — försök igen.';
    document.querySelectorAll('.zp-reply-btn').forEach(b => b.disabled = false);
  }
}

function goBack(){
  const s = S.screen;
  const hasPat = !!S.pat;
  if (s === 'meeting') {
    stopListening(); go(hasPat ? 'detail' : 'list');
  } else if (s === 'soap') {
    // SOAP review — came from meeting, go back to detail to not lose data
    go(hasPat ? 'detail' : 'list');
  } else if (s === 'manualsoap' || s === 'sbs-soap') {
    autoSaveJournalDraft();
    go(hasPat ? 'detail' : 'list');
  } else if (s === 'form' || s === 'editex') {
    go(hasPat ? 'detail' : 'list');
  } else if (s === 'doc') {
    go(hasPat ? 'detail' : 'list');
  } else if (s === 'editpat') {
    go(hasPat ? 'detail' : 'list');
  } else if (s === 'journaldoc' || s === 'patjournal') {
    go(hasPat ? 'detail' : 'list');
  } else if (s === 'detail') {
    go('list');
  } else if (s === 'list') {
    go('dashboard');
  } else {
    go('dashboard');
  }
}

function rDashboard() {
  const now = new Date();
  const today = now.toLocaleDateString('sv-SE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const hour = now.getHours();
  const greeting = hour < 12 ? 'God morgon' : hour < 17 ? 'God eftermiddag' : 'God kväll';

  const total = S.patients.length;
  const active = S.patients.filter(p => (p.visits&&p.visits[0]&&p.visits[0].status)==='Aktiv').length;

  // Revenue this month
  const thisMonth = now.getMonth(); const thisYear = now.getFullYear();
  let monthRevenue = 0;
  S.patients.forEach(p => (p.visits||[]).forEach(v => {
    const d = new Date(v.date||''); if(isNaN(d)) return;
    if(d.getMonth()===thisMonth && d.getFullYear()===thisYear) monthRevenue += (v.servicePrice||0);
  }));

  // Upcoming followups (overdue)
  const upcoming = S.patients.filter(p => {
    if (!p.visits||!p.visits[0]) return false;
    const fw = (p.visits[0].form&&p.visits[0].form.followup)||4;
    const d = new Date(p.visits[0].date||''); if (isNaN(d)) return false;
    const due = new Date(d); due.setDate(due.getDate() + fw*7);
    return due <= now;
  }).slice(0,8);

  const recent = [...S.patients].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,8);

  // Diagnosis stats
  const diagCount = {};
  S.patients.forEach(p => {
    const d = p.diagnosis || 'Okänd';
    diagCount[d] = (diagCount[d]||0) + 1;
  });
  const topDiags = Object.entries(diagCount).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxD = topDiags[0]?.[1] || 1;

  const upcomingHtml = upcoming.length ? upcoming.map(p => {

    const d = new Date(p.visits[0].date||''); d.setDate(d.getDate()+fw*7);
    const overdueDays = Math.round((now-d)/(1000*60*60*24));

        ${lastDate?`<div class="dr-date">${lastDate}</div>`:''}
      </div>
    </div>`;
  }).join('') : '<div class="dash-empty">Inga patienter ännu</div>';

  const diagHtml = topDiags.length ? topDiags.map(([d,c]) => `
    <div class="dash-stat-row">
      <div style="flex:1;min-width:0">

        <div class="dash-greeting">${greeting}</div>

// ── PHASE MANAGEMENT ──────────────────────────────────────────────────────────
function getCurrentPhase(pat) {
  return pat.phase || 1;
}

function setPhase(phaseId) {
  if (!S.pat) return;
  const cur = getCurrentPhase(S.pat);
  if (phaseId < cur) {
    // Downgrade — ask for confirmation
    if (!confirm(`Justera ner till Fas ${phaseId}? Patienten återgår till en tidigare fas.`)) return;
  }
  S.pat = savePat({...S.pat, phase: phaseId});
  rDetail();
}

function getPhasePromptAddition(phase) {
  const additions = {
    1: `\n\nBEHANDLINGSFAS: Fas 1 — Smärtlindring
Fokusera på: smärtlindrande övningar, lätt rörlighetsträning, avlastning, andning och avspänning.
UNDVIK: tung belastning, uthållighetsövningar, styrkeövningar.
Övningarna ska vara skonsamma, 0-3 NRS under och efter träning.`,
    2: `\n\nBEHANDLINGSFAS: Fas 2 — Stabilisering
Fokusera på: muskelstyrka, neuromuskulär kontroll, stabilisering, funktionella rörelsemönster.
Progressiv belastning är OK. Inkludera proprioception och balansövningar.
Bygga upp kapacitet steg för steg.`,
    3: `\n\nBEHANDLINGSFAS: Fas 3 — Underhåll & friskvård
Fokusera på: upprätthålla styrka och rörlighet, förebygga återfall, generell friskvård.
Varierande träning, aerob kondition, livsstilsråd för långsiktig hälsa.
Patienten ska kunna självhantera.`
  };
  return additions[phase] || '';
}

function renderPhaseBar(pat) {
  const cur = getCurrentPhase(pat);
  const ph = PHASES[cur-1];
  const next = PHASES[cur];
  const lastVisit = pat.visits && pat.visits[0];
  const lastDate = lastVisit && lastVisit.date;
  const fw = lastVisit && lastVisit.form && lastVisit.form.followup;
  let nextDue = '';
  if (lastDate && fw) {
    const d = new Date(lastDate); d.setDate(d.getDate() + fw*7);
    nextDue = d.toLocaleDateString('sv-SE', {day:'numeric',month:'short'});
  }
  const steps = PHASES.map(p => {
    const done = p.id < cur;
    const active = p.id === cur;
    const dotBg = active ? p.color : done ? 'var(--teal)' : 'var(--border)';
    const labelColor = active ? 'var(--navy)' : done ? 'var(--teal)' : 'var(--text4)';
    const weight = active ? '700' : '400';
    return `<div onclick="setPhase(${p.id})" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1">
      <div style="width:10px;height:10px;border-radius:50%;background:${dotBg};transition:background .15s"></div>
      <div style="font-size:9px;font-weight:${weight};color:${labelColor};text-align:center;letter-spacing:.04em">${p.label}</div>
    </div>`;
  });
  const connectors = `<div style="position:absolute;top:5px;left:calc(50%/3 + 5px);right:calc(50%/3 + 5px);height:1px;background:var(--border);z-index:0"></div>`;

  const back = cur > 1
    ? `<button class="btn" style="font-size:10px;padding:3px 9px;flex-shrink:0;color:var(--text3)" onclick="setPhase(${cur-1})">← ${PHASES[cur-2].label}</button>`
    : '';
  const advance = next
    ? `<button class="btn btn-p" style="font-size:10px;padding:3px 9px;flex-shrink:0" onclick="setPhase(${next.id})">→ ${next.label}</button>`
    : `<span style="font-size:10px;color:var(--green);font-weight:600">Slutförd</span>`;

  return `<div style="background:${ph.bg};border:1px solid ${ph.color}22;border-radius:10px;padding:10px 14px;margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div>
        <span style="display:inline-block;background:${ph.color};color:white;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-right:7px">${ph.label}</span>
        <span style="font-size:13px;font-weight:600;color:${ph.color}">${ph.name}</span>
        ${nextDue?`<span style="font-size:11px;color:var(--text3);margin-left:8px">Återbesök ${nextDue}</span>`:''}
      </div>
      <div style="display:flex;gap:5px">${back}${advance}</div>
    </div>
    <div style="position:relative;display:flex;gap:0">${connectors}${steps.join('')}</div>
  </div>`;
}

function saveDiagEdit(patId) {
  const raw = document.getElementById('diag-edit-ta')?.value||'';
  const arr = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const p = S.patients.find(x=>x.id===patId)||S.pat; if(!p) return;
  const updated = {...p, diagnoses: arr, diagnosis: arr[0]||p.diagnosis||''};
  const saved = savePat(updated);
  if(S.pat&&S.pat.id===patId) S.pat=saved;
  document.getElementById('diag-edit-ov')?.remove();
  if(S.screen==='detail') rDetail();
}

async function loadPassLog(visitId, patId) {
  const el = document.getElementById('passlog-' + visitId);
  if (!el) return;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/pass_log?visit_id=eq.${visitId}&order=logged_at.desc&limit=10`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }

const _escHandlers = {};
function addOverlayEsc(id) {
  if (_escHandlers[id]) document.removeEventListener('keydown', _escHandlers[id]);
  const h = e => { if (e.key === 'Escape') { const el = document.getElementById(id); if (el) el.remove(); document.removeEventListener('keydown', h); delete _escHandlers[id]; } };
  _escHandlers[id] = h;
  document.addEventListener('keydown', h);
}

  const name = document.getElementById('npf-name')?.value.trim();

  const birthdate = parseBirthdate(bdRaw);
  const email = document.getElementById('npf-email')?.value.trim();
  const phone = document.getElementById('npf-phone')?.value.trim();
  const address = document.getElementById('npf-address')?.value.trim();
  const birthYear = birthdateToYear(birthdate);
  const notes = document.getElementById('npf-notes')?.value.trim();
  const pat = { id:'pat_'+Date.now(), name, birthdate, email, phone, address, birthYear, diagnosis:'', diagnoses:[], notes, visits:[], consents:[], phase:1 };

  CONSENT_TYPES.forEach(ct => { const cb=document.getElementById('cp-'+ct.key); if(cb&&cb.checked) newConsents.push({type:ct.key,date:new Date().toISOString().slice(0,10),revokedAt:null}); });

function renderPrevVisitPanel(pat, currentVisitId) {
  if (!pat||!pat.visits||pat.visits.length<2) return '';
  const visits = pat.visits;
  const currentIdx = currentVisitId ? visits.findIndex(v=>v.id===currentVisitId) : 0;
  const prevVisit = visits[currentIdx+1]||visits[1];
  if (!prevVisit) return '';
  const soap = prevVisit.soap||{};
  const hasSoap = soap.S||soap.O||soap.A||soap.P;
  const exs = prevVisit.plan?.exercises||[];
  let h = `<div style="background:#f0f8ff;border:1px solid #c8e0f0;border-radius:10px;padding:14px 16px;margin-bottom:16px">
    <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4a9aaa;margin-bottom:10px">Föregående besök — ${prevVisit.date||'—'}</div>`;
  if (hasSoap) {
    ['S','O','A','P'].forEach(l => {
      if (!soap[l]) return;
      const labels={S:'Subjektivt',O:'Objektivt',A:'Bedömning',P:'Plan'};
      h+=`<div style="margin-bottom:7px"><span style="font-size:9px;font-weight:700;color:#4a9aaa;letter-spacing:.06em">${labels[l]}</span><div style="font-size:12px;color:#2a3a4a;line-height:1.5;margin-top:2px">${e(soap[l])}</div></div>`;
    });
  }
  if (exs.length) {
    h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #d0e8f0"><div style="font-size:9px;font-weight:700;color:#4a9aaa;margin-bottom:5px">ÖVNINGAR FÖRRA BESÖKET</div>${exs.map((ex,i)=>`<div style="font-size:11px;color:#2a3a4a;padding:3px 0">${i+1}. ${e(ex.name)} — ${ex.sets}×${ex.reps}</div>`).join('')}</div>`;
  }
  return h+'</div>';
}

// ── MEETING / TRANSCRIPTION ────────────────────────────────────────────────
let meetRecognition = null;
let clinicalAnalysisTimer = null;
let clinicalAnalysisDebounce = null;
let lastAnalyzedText = '';
let clinicalPanelExpanded = true;
let meetTranscript = [];
let meetInterim = "";
let meetTimer = null;
let meetSeconds = 0;
let meetConsented = false;
let meetNote = "";
let currentSOAP = null;

function rMeeting() {
  const p = S.pat;
  if (!p) { go("list"); return; }
  const el = document.getElementById("s-meeting");

  const meetHeader = `
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:52px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50">
    <button onclick="stopListening();go('detail')" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);padding:0;font-family:var(--font);transition:color .15s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Kundkort
    </button>
    <span style="color:var(--border2)">›</span>
    <span style="font-size:13px;font-weight:600;color:var(--ink)">${e(p.name)}</span>
    <span style="font-size:11px;color:var(--muted)">— Möte &amp; transkription</span>
  </div>`;

  if (!meetConsented) {
    el.innerHTML = meetHeader + `<div class="meet-wrap">
      <div class="meet-consent" style="margin-top:32px">
        <div class="meet-consent-title">Samtycke krävs</div>
        <div class="meet-consent-txt">
          Innan inspelningen startar behöver patienten ge sitt samtycke till att mötet spelas in och transkriberas för journalföring. Transkriptionen behandlas av AI och lagras lokalt.
        </div>
        <div class="meet-consent-btn">
          <button class="btn btn-p" style="width:100%;padding:13px;font-size:14px" onclick="giveConsent()">Patienten har samtyckt — Starta</button>
          <button class="btn" style="width:100%;padding:10px" onclick="go('detail')">Avbryt</button>
        </div>
      </div>
    </div>`;
    return;
  }

  const mins = String(Math.floor(meetSeconds/60)).padStart(2,'0');
  const secs = String(meetSeconds%60).padStart(2,'0');
  const isListening = meetRecognition !== null;

  let transcriptHtml = meetTranscript.map(t =>
    `<div class="transcript-line"><span class="tl-time">${t.time}</span><span class="tl-text">${e(t.text)}</span></div>`
  ).join('');
  if (!transcriptHtml) transcriptHtml = '<div style="color:#6a7a8a;font-style:italic;padding:8px 0;font-size:13px">Inget transkriberat ännu — tryck Starta inspelning och tala tydligt.</div>';

  el.innerHTML = meetHeader + `<div class="meet-wrap">
    <div class="meet-status">
      <div class="meet-status-dot ${isListening?'listening':'idle'}" id="meet-dot"></div>
      <span class="meet-status-txt" id="meet-status-txt">${isListening?'Lyssnar och transkriberar...':'Tryck Starta för att börja'}</span>
      <span class="meet-timer" id="meet-clock">${mins}:${secs}</span>
    </div>
    <div class="transcript-box" id="tbox">
      ${transcriptHtml}
      <div class="transcript-line" id="meet-interim-line" style="display:none">
        <span class="tl-time">--:--</span><span class="tl-text interim" id="meet-interim"></span>
      </div>
    </div>
    <div class="meet-controls" id="meet-btn-wrap">
      ${isListening
        ? `<button class="rec-btn stop" onclick="stopListening()">⏸ Pausa inspelning</button>`
        : `<button class="rec-btn start" onclick="startListening()">${meetTranscript.length?'▶ Återuppta':'▶ Starta'} inspelning</button>`
      }
    </div>
    <span class="meet-note-label">Egna noteringar</span>
    <textarea class="meet-note" placeholder="Kompletterande anteckningar — syns inte i transkriptet..." oninput="meetNote=this.value;triggerClinicalAnalysis(meetTranscript.map(t=>t.text).join(' ')+' '+this.value)">${e(meetNote)}</textarea>

    ${clinicalPanelHTML("meeting")}

    <button class="meet-done-btn" id="meet-done-btn" onclick="finishMeeting()">
      Avsluta möte och skapa journal →
    </button>
    <div class="meet-done-hint">Du kan avsluta även om inget transkriberats — fyll i manuellt i noteringar.</div>
  </div>`;

  const tbox = document.getElementById("tbox");
  if (tbox) tbox.scrollTop = tbox.scrollHeight;

  // If there's already transcript text (resumed meeting), re-trigger clinical analysis
  if (meetTranscript.length > 0) {
    const existingText = meetTranscript.map(t=>t.text).join(' ') + (meetNote ? ' ' + meetNote : '');
    lastAnalyzedText = ''; // force re-analysis even if text matches
    triggerClinicalAnalysis(existingText);
  }
}

function giveConsent() {
  meetConsented = true;
  meetTranscript = [];
  meetInterim = '';
  meetSeconds = 0;
  meetNote = '';
  lastAnalyzedText = ''; // reset so AI triggers fresh on new transcript
  rMeeting();
  meetTimer = setInterval(() => {
    meetSeconds++;
    const el = document.getElementById('meet-clock');
    if (el) {
      const mins = String(Math.floor(meetSeconds/60)).padStart(2,'0');
      const secs = String(meetSeconds%60).padStart(2,'0');
      el.textContent = mins+':'+secs;
    }
  }, 1000);
  // Don't auto-start — let user press the button
}

let _meetingStopping = false;
let _meetingSessionId = 0;

function stopListening() {
  _meetingStopping = true;
  _meetingSessionId++;
  if (meetRecognition) {
    const r = meetRecognition;
    meetRecognition = null;
    r.onresult = null;
    r.onerror = null;
    r.onend = null;
    r.onstart = null;
    try { r.abort(); } catch(ignored) {}
  }
  meetInterim = '';
  const intEl = document.getElementById('meet-interim');
  const intLine = document.getElementById('meet-interim-line');
  if (intEl) intEl.textContent = '';
  if (intLine) intLine.style.display = 'none';
  const dot = document.getElementById('meet-dot');
  const txt = document.getElementById('meet-status-txt');
  if (dot) dot.className = 'meet-status-dot idle';
  if (txt) txt.textContent = 'Inspelning pausad';
  updateRecBtn(false);
  setTimeout(() => { _meetingStopping = false; }, 500);
}

async function startListening() {
  if (meetRecognition) return; // guard: already active

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Din webbläsare stöder inte röstinspelning. Använd Chrome (desktop) eller Safari (iPhone).');
    return;
  }

  // Show pending state — keep button as Starta while we wait for permission
  const dot0 = document.getElementById('meet-dot');
  const txt0 = document.getElementById('meet-status-txt');
  if (dot0) dot0.className = 'meet-status-dot idle';
  if (txt0) txt0.textContent = 'Väntar på mikrofontillstånd...';

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
    } catch(err) {
      if (txt0) txt0.textContent = 'Mikrofontillstånd nekades';
      alert('Mikrofontillstånd nekades.\n\nGå till webbläsarens inställningar → Sekretess → Mikrofon och tillåt denna sida.');
      return;
    }
  }

  // Abort if user pressed stop during the permission wait
  if (_meetingStopping || meetRecognition) return;

  _meetingStopping = false;
  const mySession = ++_meetingSessionId;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'sv-SE';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    if (meetRecognition !== rec) return;
    const d = document.getElementById('meet-dot');
    const t = document.getElementById('meet-status-txt');
    if (d) d.className = 'meet-status-dot listening';
    if (t) t.textContent = 'Lyssnar och transkriberar...';
    updateRecBtn(true);
  };

  rec.onresult = (event) => {
    if (meetRecognition !== rec) return;
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        const now = new Date();
        const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        meetTranscript.push({ time, text: text.trim() });
        meetInterim = '';
        appendTranscriptLine(time, text.trim());
      } else {
        interim += text;
      }
    }
    meetInterim = interim;
    const intEl = document.getElementById('meet-interim');
    const intLine = document.getElementById('meet-interim-line');
    if (intEl) intEl.textContent = interim;
    if (intLine) intLine.style.display = interim ? '' : 'none';
    updateDoneBtn();
  };

  rec.onerror = (event) => {
    if (meetRecognition !== rec) return;
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      meetRecognition = null;
      updateRecBtn(false);
      const t = document.getElementById('meet-status-txt');
      if (t) t.textContent = 'Mikrofontillstånd saknas';
    }
    // 'no-speech' and 'aborted' are normal during continuous recognition — ignore
  };

  rec.onend = () => {
    // Only restart if this exact session is still active
    if (meetRecognition !== rec) return;
    if (_meetingStopping) return;
    if (_meetingSessionId !== mySession) return;
    setTimeout(() => {
      if (meetRecognition !== rec || _meetingStopping || _meetingSessionId !== mySession) return;
      try {
        rec.start();
      } catch(e) {
        // Restart failed — show resume button
        meetRecognition = null;
        updateRecBtn(false);
        const t = document.getElementById('meet-status-txt');
        if (t) t.textContent = 'Avbruten — tryck Fortsätt';
      }
    }, 300);
  };

  // Assign to global ONLY after setting up all handlers
  meetRecognition = rec;

  try {
    rec.start();
  } catch(e) {
    meetRecognition = null;
    updateRecBtn(false);
    if (txt0) txt0.textContent = 'Kunde inte starta';
    alert('Kunde inte starta inspelning: ' + e.message);
  }
}

function clinicalPanelHTML(context) {

    : 'Börja skriva i något SOAP-fält — analysen startar automatiskt.';

      </div>

function toggleClinicalPanel() {

function triggerClinicalAnalysis(text) {
  clearTimeout(clinicalAnalysisDebounce);
  clinicalAnalysisDebounce = setTimeout(() => runClinicalAnalysis(text), 2500);
}

async function runClinicalAnalysis(text) {
  if (!text || text.trim().length < 30) return;
  if (text.trim() === lastAnalyzedText.trim()) return;
  lastAnalyzedText = text.trim();
  const key = getKey();
  if (!key) return;
  const panel = document.getElementById('clinical-panel-body');
  if (!panel) return;

  // Update status indicator
  const pulse = document.getElementById('clin-pulse');
  const status = document.getElementById('clin-status');
  if (pulse) pulse.style.background = '#4a9aaa';
  if (status) status.textContent = '— analyserar...';

  panel.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:12px;color:#4a9aaa;font-size:12px"><div style="width:6px;height:6px;border-radius:50%;background:#4a9aaa;animation:pulse 1s infinite"></div>Analyserar...</div>`;
  const patInfo = S.pat ? (() => {
    const p = S.pat;
    const prevVisits = (p.visits||[]).slice(0,3).map(v => {
      const soap = v.journal?.soap || v.soap || {};
      const d = v.date||'';
      return `Besök ${d}: ${[soap.A,soap.P].filter(Boolean).join(' | ')}`;
    }).filter(s=>s.length>10).join('\n');
    return `Patient: ${p.name}, f.${p.birthdate||p.birthYear||'?'}, diagnos: ${p.diagnosis||'okänd'}${prevVisits?'\nTidigare besök:\n'+prevVisits:''}`;
  })() : '';
  const prompt = `Du är erfaren klinisk fysioterapeut som handleder en kollega i realtid. Analysera materialet nedan. Svara ENBART med JSON utan backticks.\n\n${patInfo}\n\nTEXT/TRANSKRIPT:\n${text.slice(-2000)}\n\nJSON-format:\n{"tentativeDiagnosis":[{"name":"Diagnos","icd10":"M54.5","probability":"Hög","reasoning":"kortfattad motivering"}],"redFlags":[],"missingInfo":["fråga 1","fråga 2"],"priorityTests":[{"test":"Testnamn","rationale":"varför","finding":"förväntat fynd"}],"treatmentGuidelines":["riktlinje 1","riktlinje 2"],"nextStep":"Vad du bör göra härnäst"}\n\nViktigt: icd10 ska vara exakt ICD-10 kod (t.ex. M54.5, M75.1, S83.2). Inkludera alltid icd10 i varje diagnos.`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL_HAIKU,max_tokens:1200,system:"Svara ALLTID med giltig JSON. Inga backticks.",messages:[{role:"user",content:prompt}]})});
    const data = await res.json();
    const txt = (data.content||[]).map(b=>b.text||'').join('');
    const cleaned = txt.replace(/```json|```/g,'').trim();
    if (!cleaned) throw new Error('Tomt API-svar (stop_reason: '+(data.stop_reason||'?')+')');
    const result = JSON.parse(cleaned);
    renderClinicalPanel(result);
  } catch(err) {
    console.error('Clinical AI error:', err);
    if (panel) panel.innerHTML = `<div style="padding:12px;font-size:11px;color:#8a9aaa">Analys misslyckades: ${e(err.message||'okänt fel')}</div>`;
  }
}

function renderClinicalPanel(r) {
  const panel = document.getElementById('clinical-panel-body');
  if (!panel) return;
  const pulse = document.getElementById('clin-pulse');
  const status = document.getElementById('clin-status');
  if (pulse) { pulse.style.background = '#4af0a0'; pulse.style.animation = 'none'; }
  if (status) status.textContent = '— uppdaterad ' + new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  const probColor = {'Hög':'#1a7a4a','Medel':'#8a6000','Låg':'#6a7a8a'};
  const probBg = {'Hög':'#e8f5ee','Medel':'#fff3cd','Låg':'#f0f2f4'};
  let h = '';
  if (r.redFlags&&r.redFlags.length) h+=`<div style="background:#fee;border-left:3px solid #c07070;padding:10px 12px;margin-bottom:10px;border-radius:0 6px 6px 0"><div style="font-size:9px;font-weight:700;color:#c07070;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Röda flaggor</div>${r.redFlags.map(f=>`<div style="font-size:12px;color:#8a2020;margin-bottom:2px">${e(f)}</div>`).join('')}</div>`;
  if (r.nextStep) h+=`<div style="background:#e8f4f6;border-left:3px solid var(--teal);padding:10px 12px;margin-bottom:10px;border-radius:0 6px 6px 0"><div style="font-size:9px;font-weight:700;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Nästa steg</div><div style="font-size:12px;color:#1a3a4a;line-height:1.5">${e(r.nextStep)}</div></div>`;
  if (r.tentativeDiagnosis&&r.tentativeDiagnosis.length){
    h+=`<div style="margin-bottom:10px"><div style="font-size:9px;font-weight:700;color:var(--navy);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">Differentialdiagnoser + ICD-10</div>`;
    r.tentativeDiagnosis.forEach(d=>{
      const col=probColor[d.probability]||'#6a7a8a', bg=probBg[d.probability]||'#f0f2f4';
      const icdCode = d.icd10 || '';
      const icdBtn = icdCode ? `<button onclick="setClinicalICD('${e(icdCode)}','${e(d.name)}')" style="margin-left:6px;background:#e8f0f8;border:1px solid #b0c8e0;border-radius:4px;font-size:9px;font-weight:700;color:#1a4a7a;padding:2px 6px;cursor:pointer;font-family:'DM Mono',monospace">→ Sätt ICD-10</button>` : '';
      h+=`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;padding:9px 11px;background:white;border-radius:8px;border:1px solid #e8ecf0">
        <span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:${bg};color:${col};flex-shrink:0;margin-top:2px">${e(d.probability)}</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:3px">
            <span style="font-size:12px;font-weight:600;color:var(--navy)">${e(d.name)}</span>
            ${icdCode?`<span style="font-size:10px;font-weight:700;font-family:'DM Mono',monospace;color:#1a7a8a;background:#e4f4f7;padding:2px 7px;border-radius:4px">${e(icdCode)}</span>`:''}
            ${icdBtn}
          </div>
          <div style="font-size:11px;color:#6a7a8a;line-height:1.45">${e(d.reasoning)}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  if (r.missingInfo&&r.missingInfo.length) h+=`<div style="margin-bottom:10px"><div style="font-size:9px;font-weight:700;color:var(--navy);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">Komplettera med</div>${r.missingInfo.map(q=>`<div style="font-size:12px;color:#2a3a4a;padding:6px 10px;background:white;border-radius:7px;border:1px solid #e8ecf0;margin-bottom:4px;line-height:1.4">→ ${e(q)}</div>`).join('')}</div>`;
  if (r.priorityTests&&r.priorityTests.length){h+=`<div style="margin-bottom:10px"><div style="font-size:9px;font-weight:700;color:var(--navy);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">Prioriterade tester</div>`;r.priorityTests.forEach((t,i)=>{h+=`<div style="padding:8px 10px;background:white;border-radius:7px;border:1px solid #e8ecf0;margin-bottom:4px"><div style="display:flex;gap:7px;align-items:center;margin-bottom:3px"><span style="font-size:9px;font-weight:700;background:var(--navy);color:white;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span><span style="font-size:12px;font-weight:600;color:var(--navy)">${e(t.test)}</span></div><div style="font-size:11px;color:#6a7a8a;padding-left:23px;line-height:1.4">${e(t.rationale)}</div><div style="font-size:11px;color:#4a9aaa;padding-left:23px;margin-top:2px">Fynd: ${e(t.finding)}</div></div>`;});h+=`</div>`;}
  if (r.treatmentGuidelines&&r.treatmentGuidelines.length) h+=`<div><div style="font-size:9px;font-weight:700;color:var(--navy);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">Behandlingsriktlinjer</div>${r.treatmentGuidelines.map(g=>`<div style="font-size:12px;color:#2a3a4a;padding:6px 10px;background:white;border-radius:7px;border:1px solid #e8ecf0;margin-bottom:4px;line-height:1.4">${e(g)}</div>`).join('')}</div>`;
  panel.innerHTML = h||'<div style="padding:12px;font-size:12px;color:#8a9aaa">Fortsätt berätta — analysen uppdateras automatiskt.</div>';
}

function setClinicalICD(code, diagName) {
  // Set in all active ICD-10 fields (works in both meeting SOAP and manual SOAP)
  ['ms-icd','sbs-focus'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.placeholder && el.placeholder.includes('ICD')) { el.value = code; el.dispatchEvent(new Event('input')); }
  });
  // Direct currentSOAP update
  if (typeof currentSOAP !== 'undefined') {
    currentSOAP.icd10 = code;
    currentSOAP.icd10desc = diagName;
    // Update visible fields

async function saveSOAPToVisit(goToPlan) {
  const p = S.pat;
  if (!p || !currentSOAP) return;
  const diag = currentSOAP.diagnosis || p.diagnosis || '';

  // Read SOAP from live DOM if available, otherwise from currentSOAP
  const liveSoap = {};
  ['S','O','A','P'].forEach(l => {
    const el = document.getElementById('soap-'+l) || document.getElementById('ms-'+l) || document.getElementById('sbs-'+l);
    liveSoap[l] = (el && el.value) || (currentSOAP.soap && currentSOAP.soap[l]) || '';
  });
  const mergedSoap = {...(currentSOAP.soap||{}), ...liveSoap};
  const soapText = ['S','O','A','P'].map(l => `${l}: ${mergedSoap[l]||''}`).join('\n\n');

  // If adding to an existing visit, update it in place
  const existingId = currentSOAP.existingVisitId;
  let vid;
  let updVisits;
  if (existingId && (p.visits||[]).find(v => v.id === existingId)) {
    vid = existingId;
    updVisits = (p.visits||[]).map(v => v.id === existingId
      ? {...v, soap: mergedSoap, note: soapText, transcript: currentSOAP.transcript, soapMeta: {...currentSOAP, soap: mergedSoap}}
      : v
    );
  } else {
    vid = 'v_' + Date.now();
    const svc = window._pendingService || {};
    const newVisit = {
      id: vid,
      date: currentSOAP.date,
      form: null, plan: null, status: 'Aktiv',
      note: soapText,
      soap: mergedSoap,
      transcript: currentSOAP.transcript,
      soapMeta: {...currentSOAP, soap: mergedSoap},
      service: svc.name || '',
      servicePrice: svc.price || 0,
    };
    window._pendingService = null;
    updVisits = [newVisit, ...(p.visits||[])];
  }

  const isFirstVisit = !(p.visits||[]).length;
  const updPat = {...p, diagnosis: diag, visits: updVisits};
  const saved = savePat(updPat);
  S.pat = saved;
  S.visitId = vid;

  if (isFirstVisit || !(p.diagnoses||[]).length) {
    setTimeout(() => aiExtractDiagnoses(saved.id), 1500);
  }

  if (goToPlan) {
    // Pre-fill form from SOAP analysis
    S.form = {
      name: p.name || '',
      birthdate: p.birthdate || "", birthYear: p.birthYear || 1980,
      diagnosis: currentSOAP.diagnosis || diag,
      customDiag: currentSOAP.customDiagnosis || '',
      pain: currentSOAP.pain || 5,
      history: currentSOAP.history || 'ingen',
      knowledge: currentSOAP.knowledge || 'låg',
      location: currentSOAP.location || 'hem',
      motivation: currentSOAP.motivation || 6,
      exercises: currentSOAP.exercises || 5,
      followup: currentSOAP.followup || 4,
      notes: currentSOAP.clinicalFocus || ''
    };
    resetMeeting();
    go('form');
  }
}

JSON:
{"pain":5,"motivation":6,"history":"ingen","knowledge":"låg","location":"hem","exercises":5,"followup":4,"clinicalFocus":"specifika fynd och fokusområden"}

pain 0-10, motivation 1-10, history: ingen/sporadisk/regelbunden, knowledge: låg/medel/hög, location: hem/gym`;

function checkMeetDraft() {
  if (!S.pat) return null;

    const d = JSON.parse(raw);
    if (!d || d.patId !== S.pat.id) return null;
    if (Date.now() - d.savedAt > 8*60*60*1000) return null; // 8h expiry
    if (!d.transcript || !d.transcript.length) return null;
    return d;
  } catch { return null; }
}

function clearMeetDraft() {
  if (S.pat) try { localStorage.removeItem('hael:meetdraft:'+S.pat.id); } catch {}
}

function startMeeting() {
  if (!S.pat) return;

  // Check for a saved draft from a previous crashed/interrupted session
  const draft = checkMeetDraft();
  if (draft) {
    const mins = Math.round((Date.now() - draft.savedAt) / 60000);
    const timeAgo = mins < 60 ? `${mins} min sedan` : `${Math.round(mins/60)} tim sedan`;
    const ov = document.createElement('div');
    ov.id = 'meet-draft-overlay';

}

function restoreMeetDraft(draft) {
  const ov = document.getElementById('meet-draft-overlay');
  if (ov) ov.remove();
  meetConsented = true;
  meetTranscript = draft.transcript || [];
  meetNote = draft.note || '';
  meetSeconds = 0;
  meetInterim = '';
  go('meeting');
  meetTimer = setInterval(() => {
    meetSeconds++;
    const el = document.getElementById('meet-clock');
    if (el) {
      const mins = String(Math.floor(meetSeconds/60)).padStart(2,'0');
      const secs = String(meetSeconds%60).padStart(2,'0');
      el.textContent = mins+':'+secs;
    }
  }, 1000);
  showAutoSaveToast('Transkript återställt — '+meetTranscript.length+' rader');
}

// ── PAIN CHART ────────────────────────────────────────────────────────────────
function renderPainChart(visits) {
  const pts = [...visits].reverse().filter(v=>v.form&&v.form.pain!=null).slice(0,10);
  if (pts.length < 2) return '';
  const W=340, H=70, PAD=10;
  const vals = pts.map(v=>v.form.pain);
  const min=0, max=10;
  const xStep = (W-PAD*2)/(pts.length-1);
  const yScale = (H-PAD*2)/(max-min);
  const points = vals.map((v,i)=>({
    x: PAD+i*xStep,
    y: H-PAD-(v-min)*yScale
  }));
  const path = points.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');
  const area = path + ` L${points[points.length-1].x},${H-PAD} L${PAD},${H-PAD} Z`;
  const dots = points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${vals[i]>=7?'#c07070':vals[i]>=4?'#c8a030':'#5a9860'}"/>`).join('');
  const labels = points.map((p,i)=>`<text x="${p.x}" y="${H}" font-size="7" fill="#3a4a5a" text-anchor="middle">${pts[i].date.slice(5)}</text>`).join('');
  return `<div class="chart-wrap">
    <div class="chart-title">Smärtutveckling (NRS)</div>
    <div class="chart-svg-wrap">
      <svg width="100%" viewBox="0 0 ${W} ${H+12}" preserveAspectRatio="xMidYMid meet">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a7a8a" stop-opacity="0.18"/><stop offset="100%" stop-color="#2a7a8a" stop-opacity="0"/></linearGradient></defs>
        <line x1="${PAD}" y1="${PAD}" x2="${PAD}" y2="${H-PAD}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        ${[0,5,10].map(v=>`<text x="${PAD-3}" y="${H-PAD-(v-min)*yScale+3}" font-size="7" fill="#3a4a5a" text-anchor="end">${v}</text>`).join('')}
        <path d="${area}" fill="url(#ag)"/>
        <path d="${path}" fill="none" stroke="#2a7a8a" stroke-width="1.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>
  </div>`;
}

const CONSENT_TYPES = [

  {key:'inspelning', label:'Inspelning & transkription'},

function renderConsentBlock(p) {
  const consents = p.consents || [];
  const rows = CONSENT_TYPES.map(ct => {
    const c = consents.find(x=>x.type===ct.key);
    if (c) {
      return `<div class="consent-row">
        <div class="consent-dot" style="background:var(--green)"></div>
        <div class="consent-type">${ct.label}</div>
        <div class="consent-date">${c.date}</div>

    } else {
      return `<div class="consent-row">

  }).join('');
  return `<div class="consent-wrap">
    <div class="consent-hdr">
      <div class="consent-hdr-title">Samtycken (GDPR)</div>
    </div>

function addConsent(type) {
  if (!S.pat) return;
  const consents = (S.pat.consents||[]).filter(c=>c.type!==type);
  consents.push({type, date:new Date().toISOString().slice(0,10), revokedAt:null});
  S.pat = savePat({...S.pat, consents});
  rDetail();
}
function revokeConsent(type) {
  if (!S.pat || !confirm('Återkalla samtycke för '+CONSENT_TYPES.find(c=>c.key===type)?.label+'?')) return;
  S.pat = savePat({...S.pat, consents:(S.pat.consents||[]).filter(c=>c.type!==type)});
  rDetail();
}

function renderPaymentBlock(p) {
  const visits = (p.visits||[]).filter(v => v.plan);
  if (!visits.length) return '';

  const rows = visits.slice(0,3).map(v => {
    const access = zpCheckAccess(v);
    const tierDef = PAYMENT_TIERS[access.tier];
    const tierName = tierDef?.name || (access.tier === 'free' ? 'Fri period' : access.tier === 'expired' ? 'Utgången' : access.tier === 'manual' ? 'Manuell' : access.tier);
    const badgeClass = access.tier === 'expired' ? 'expired' : access.tier === 'free' ? 'free' : access.tier === 'manual' ? 'manual' : 'active';
    const expStr = access.expiresAt
      ? ' · till ' + new Date(access.expiresAt).toLocaleDateString('sv-SE',{day:'numeric',month:'short',year:'numeric'})
      : access.freeUntil
      ? ' · fri till ' + new Date(access.freeUntil).toLocaleDateString('sv-SE',{day:'numeric',month:'short'})
      : '';
    const dotColor = badgeClass==='active'?'var(--green)':badgeClass==='expired'?'var(--red)':badgeClass==='manual'?'#c8a030':'var(--subtle)';

    // Tier selector for active/manual
    const tierSelect = (access.ok && access.tier !== 'free') ? `
      <select onchange="zpSetTier('${p.id}','${v.id}',this.value)"
        style="font-size:9px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;background:var(--surface2);color:var(--ink);cursor:pointer;font-family:var(--font)">
        ${Object.values(PAYMENT_TIERS).map(t =>
          `<option value="${t.id}" ${access.tier===t.id||(!PAYMENT_TIERS[access.tier]&&t.id==='bas')?'selected':''}>${t.name}</option>`
        ).join('')}
      </select>` : '';

    return `<div class="consent-row">
      <div class="consent-dot" style="background:${dotColor}"></div>
      <div class="consent-type">${v.date||'—'} · ${(v.plan.exercises||[]).length} övn</div>
      <div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end">
        <span class="pay-badge ${badgeClass}">${tierName}${expStr}</span>

      </div>
    </div>`;
  }).join('');

  return `<div class="consent-wrap" style="margin-top:12px">
    <div class="consent-hdr">
      <div class="consent-hdr-title">Tillgång & betalning</div>
      <button onclick="togSettings()" style="font-size:10px;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:600;font-family:var(--font);padding:0">Konfigurera Stripe →</button>
    </div>
    ${rows}
  </div>`;
}

function zpExtendAndClose(patId, visitId, days, sendEmail, emailAddr) {
  const p = S.patients.find(x => x.id === patId) || S.pat;
  if (!p) return;
  const vIdx = (p.visits||[]).findIndex(v => v.id === visitId);
  if (vIdx < 0) return;
  // Remove unlimited override if set
  delete p.visits[vIdx].accessOverride;
  const from = p.visits[vIdx].paidUntil && new Date(p.visits[vIdx].paidUntil) > new Date()
    ? new Date(p.visits[vIdx].paidUntil) : new Date();
  from.setDate(from.getDate() + days);
  p.visits[vIdx].paidUntil = from.toISOString();
  if (!p.visits[vIdx].paymentTier) p.visits[vIdx].paymentTier = 'bas';
  // Save email if updated
  if (emailAddr && emailAddr !== p.email) { p.email = emailAddr; }
  savePat(p);
  if (S.pat?.id === patId) { S.pat = p; rDetail(); }
  document.getElementById('extend-panel-overlay')?.remove();
  showAutoSaveToast('Tillgång förlängd ' + days + ' dagar');
  if (sendEmail && emailAddr) {
    const expDate = from.toLocaleDateString('sv-SE');
    const subject = encodeURIComponent('Din Hael-plan har förlängts');
    const body = encodeURIComponent(`Hej ${(p.name||'').split(' ')[0]},

Din tillgång till Hael-planen har förlängts och är nu aktiv till och med ${expDate}.

Hälsningar,
${S.clinicName||'Din behandlare'}`);
    window.open(`mailto:${emailAddr}?subject=${subject}&body=${body}`);
  }
}

function exportBackup(silent) {
  // Collect all patients from both storage key formats
  const seen = new Set();
  const patients = [];
  S.patients.forEach(p => { if (p&&p.id&&!seen.has(p.id)) { seen.add(p.id); patients.push(p); } });
  // Also sweep localStorage for any orphaned keys
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k.startsWith('pat:') || k.startsWith('kansei-data:') || k.startsWith('kpat_')) {
      try {
        const p = JSON.parse(localStorage.getItem(k));
        if (p&&p.id&&!seen.has(p.id)) { seen.add(p.id); patients.push(p); }
      } catch(e) {}
    }
  }
  // Also collect economics user entries
  const ekEntries = (() => { try { return JSON.parse(localStorage.getItem('kansei-ek:intakter')||'[]'); } catch(e){return[];} })();

  const data = {
    appName: 'Vela',
    version: 2,
    exported: new Date().toISOString(),
    exportedReadable: new Date().toLocaleString('sv-SE'),
    patientCount: patients.length,
    patients,
    
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
  a.download = `hael-export-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (!silent) showAutoSaveToast('Backup nedladdad');
  return patients.length;
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      // Support both old format (patients array) and new format (version 2)
      const patients = data.patients;
      if (!patients||!Array.isArray(patients)) { alert('Ogiltig backupfil — inga patienter hittades.'); return; }
      let count = 0;
      patients.forEach(p => {
        if (p&&p.id) {
          localStorage.setItem('kansei-data:'+p.id, JSON.stringify(p));
          localStorage.setItem('pat:'+p.id, JSON.stringify(p));
          count++;
        }
      });
      // Import economics user entries if present
      if (data.ekonomi&&data.ekonomi.userEntries&&Array.isArray(data.ekonomi.userEntries)) {
        localStorage.setItem('kansei-ek:intakter', JSON.stringify(data.ekonomi.userEntries));
      }
      alert(`${count} patienter importerade från backup (${data.exportedReadable||data.exported||'okänt datum'}).\n\nSidan laddas om.`);
      loadPats();
      go('dashboard');
    } catch(err) { alert('Kunde inte läsa filen: '+err.message); }
  };
  input.click();
}

        btn.style.color = '';
        btn.style.borderColor = '';
      }, 2500);

  }).catch(() => {

    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';

    document.body.appendChild(ta);

// ── SMÄRTGRAF ─────────────────────────────────────────────────────────────────

function renderPainGraph(pat) {
  const visits = (pat.visits||[]).slice().reverse(); // oldest first
  const painPoints = visits.filter(v => v.form && v.form.pain != null);
  if (painPoints.length < 2) return ''; // need at least 2 points

  const W = 280, H = 60, PAD = 8;
  const n = painPoints.length;
  const xs = painPoints.map((_, i) => PAD + (i / (n - 1)) * (W - PAD * 2));
  const ys = painPoints.map(v => PAD + ((10 - v.form.pain) / 10) * (H - PAD * 2));

  // polyline
  const pts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');

  // color: improving = green, worsening = red
  const first = painPoints[0].form.pain;
  const last = painPoints[painPoints.length-1].form.pain;
  const trend = last < first ? '#4a9860' : last > first ? '#c07070' : '#4a9aaa';

  // dots + labels
  let dots = '';
  painPoints.forEach((v, i) => {
    dots += `<circle cx="${xs[i]}" cy="${ys[i]}" r="3" fill="${trend}" opacity="0.9"/>`;
    if (i === 0 || i === n-1) {
      const anchor = i === 0 ? 'start' : 'end';
      dots += `<text x="${xs[i]}" y="${H - 1}" text-anchor="${anchor}" font-size="8" fill="#5a6a7a">${v.form.pain}/10</text>`;
      dots += `<text x="${xs[i]}" y="${H + 9}" text-anchor="${anchor}" font-size="7" fill="#8a9aaa">${v.date||''}</text>`;
    }
  });

  const arrow = last < first ? '↓ Förbättring' : last > first ? '↑ Försämring' : '→ Oförändrad';
  const diff = Math.abs(last - first);

  return `<div style="margin:12px 0 4px;padding:12px 14px;background:white;border:1px solid var(--border);border-radius:8px">
    <div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">
      Smärtutveckling (NRS) &nbsp;<span style="color:${trend};font-size:11px">${arrow} ${diff > 0 ? diff + ' enheter' : ''}</span>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H + 14}" style="overflow:visible">
      <polyline points="${pts}" fill="none" stroke="${trend}" stroke-width="2" stroke-linejoin="round" opacity="0.7"/>
      ${dots}
    </svg>
  </div>`;
}

function sendMailDialog(vid, encodedUrl) {

  const inclPdf = document.getElementById('md-pdf')?.checked ?? false;
  const toEmail = document.getElementById('md-email')?.value.trim() || '';

  const body = encodeURIComponent(buildMailBody(vid, liveUrl, inclLink, inclPdf));
  const mailto = `mailto:${encodeURIComponent(toEmail)}?subject=${subject}&body=${body}`;

  document.getElementById('mail-dialog-overlay')?.remove();

const RED_FLAGS = [
  {pattern: /nattsmärta|natt\s*smärta/i, label: 'Nattsmärta', msg: 'Smärta som väcker patienten på natten — kan indikera inflammatorisk artrit, infektion eller malignitet.'},
  {pattern: /oförklarlig\s*viktminskning|viktnedgång/i, label: 'Viktminskning', msg: 'Oförklarlig viktminskning — bör utredas för systemsjukdom.'},
  {pattern: /blåspåverkan|tarmpåverkan|inkontinens|urinretention/i, label: 'Blås/tarm', msg: 'Blås- eller tarmstörning — kan indikera cauda equina-syndrom. Akut remiss.'},
  {pattern: /sadelbedövning|perianal/i, label: 'Sadelbedövning', msg: 'Sadelbedövning — cauda equina-syndrom tills motsatsen bevisats. Akut remiss.'},
  {pattern: /feber|frossa|svettning\s*på\s*natten/i, label: 'Feber/svettning', msg: 'Feber eller kraftig svettning — kan indikera infektion eller systemsjukdom.'},
  {pattern: /steroidbehandling|immunosuppression|immundämpande/i, label: 'Immunosuppression', msg: 'Patient med immunosuppression — ökad risk för atypiska infektioner.'},
  {pattern: /cancer|tumör|malignitet|onkologi/i, label: 'Cancerhistorik', msg: 'Cancerhistorik — rygg-/ledsmärta kan vara metastas.'},
  {pattern: /neurologisk\s*bortfall|förlamning|pares|pareser/i, label: 'Neurologisk bortfall', msg: 'Neurologiska bortfall — prioritera neurologisk utredning.'},
  {pattern: /trauma|fall\s*från\s*höjd|trafikolycka/i, label: 'Allvarligt trauma', msg: 'Allvarligt trauma — uteslut fraktur.'},
  {pattern: /progressiv|tilltagande\s*svaghet/i, label: 'Progressiv svaghet', msg: 'Progressiv motorisk svaghet — neurologisk utredning prioriteras.'},
];

function checkRedFlags(soapText) {
  if (!soapText) return [];
  const found = [];
  RED_FLAGS.forEach(f => {
    if (f.pattern.test(soapText)) found.push(f);
  });
  return found;
}

function renderRedFlagBanner(flags) {
  if (!flags || !flags.length) return '';
  const items = flags.map(f => `<div class="rf-item"><strong>${f.label}:</strong> ${f.msg}</div>`).join('');
  return `<div class="rf-banner">
    <div class="rf-title">Röda flaggor detekterade — granska innan behandling</div>
    ${items}
  </div>`;
}

async function generateProgressNote(pat) {
  const visits = (pat.visits||[]).slice(); // newest first
  if (visits.length < 1) return null;
  const key = getKey();
  if (!key) return null;

  // Build a structured summary of ALL visits
  const visitSummaries = visits.map((v, i) => {
    const soap = v.soap ? Object.entries(v.soap).filter(([,val])=>val).map(([k,val])=>`  ${k}: ${val}`).join('\n') : '';
    const pain = v.form?.pain ?? v.soapMeta?.pain ?? '—';
    const diag = v.form?.diagnosis || v.plan?.diagnosis || '';
    const planSummary = v.plan?.exercises?.length
      ? `  Plan: ${v.plan.exercises.length} övningar (${v.plan.exercises.slice(0,3).map(e=>e.name).join(', ')}${v.plan.exercises.length>3?'...':''})`
      : '';
    return `Besök ${visits.length - i} (${v.date||'okänt datum'})${diag?' — '+diag:''}:\n  NRS: ${pain}/10\n${soap}${planSummary}`;
  }).join('\n\n');

  // Detect time gaps
  const dateFirst = visits[visits.length-1]?.date;
  const dateLast = visits[0]?.date;
  const totalMonths = (dateFirst && dateLast)
    ? Math.round((new Date(dateLast)-new Date(dateFirst)) / (1000*60*60*24*30))
    : null;

  const timeContext = totalMonths !== null
    ? (totalMonths > 12
        ? `Patienten har ett långt uppföljningsförlopp (${totalMonths} månader) med möjliga uppehåll. Ta hänsyn till tidsgapen mellan besök.`
        : `Besöken sträcker sig över ${totalMonths} månader.`)
    : '';

  const prompt = `Du är leg. fysioterapeut. Analysera patientens besökshistorik och svara ENBART med JSON utan backticks.

Patient: ${pat.name||'Okänd'}, ${pat.diagnosis||'—'}
${timeContext}

Besöksöversikt:
${visitSummaries}

JSON-format:
{
  "trend": "1-2 meningar om smärttrend och förlopp (NRS-värden, riktning)",
  "function": "1-2 meningar om funktionsutveckling och compliance med övningsprogram",
  "findings": "1-2 meningar om viktiga kliniska fynd eller varningssignaler (skriv 'Inga röda flaggor noterade.' om inget anmärkningsvärt)",
  "recommendation": "1-2 meningar om konkret rekommendation inför nästa besök",
  "phase": "Aktuell fas och motivering i en mening",
  "flag": true eller false (true om det finns röda flaggor eller remissbehov)
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:MODEL_HAIKU, max_tokens:700, messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    return JSON.parse(raw.replace(/```json|```/g,'').trim());
  } catch(e) {
    return null;
  }
}

let _authUser = null;
let _publicPlanCache = null;

async function sbSignIn(email, password) {
  try {
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.access_token) {
      _authUser = data.user;
      localStorage.setItem('kansei:auth', JSON.stringify({ token: data.access_token, user: data.user, exp: Date.now() + (data.expires_in||3600)*1000 }));
      return { ok: true };
    }
    return { ok: false, msg: data.error_description || data.msg || 'Fel e-post eller lösenord.' };
  } catch(e) {
    return { ok: false, msg: 'Anslutningsfel — kontrollera internet.' };
  }
}

async function sbSignOut() {
  localStorage.removeItem('kansei:auth');
  _authUser = null;
  rLogin();
}

function getStoredAuth() {
  try {
    const a = JSON.parse(localStorage.getItem('kansei:auth')||'null');
    if (a && a.exp > Date.now()) return a;
    return null;
  } catch { return null; }
}

  if (result.ok) {
    const tb = document.querySelector('.topbar');

    setTimeout(() => runInboxAgent(S.patients), 3500);

function selectSwapReason(idx, reason) {

async function doSwapWithReason(idx, reason) {
  const key = getKey();
  if (!key) { alert('API-nyckel saknas.'); return; }
  const ex = S.plan?.exercises?.[idx];
  if (!ex) return;
  const f = S.form || S.plan?.form || {};

  // Show inline spinner on the exercise card in editex
  const items = document.querySelectorAll('.ee-item');
  if (items[idx]) items[idx].style.opacity = '0.4';

  const prompt = `Du är fysioterapeut. Byt ut EN övning i ett rehabprogram.

Diagnos: ${S.plan?.diagnosis || f.diagnosis || ''}
Patient: f.${f.birthdate||f.birthYear||'?'}, NRS ${f.pain||'?'}/10, plats: ${f.location||'hem'}
Övning att byta: "${ex.name}"
Anledning: ${reason || 'Generellt byte'}
Övriga övningar i programmet: ${(S.plan?.exercises||[]).filter((_,i)=>i!==idx).map(e=>e.name).join(', ')}

Svara ENBART med JSON utan backticks — EN ny övning som ersätter den gamla:
{"name":"namn","purpose":"muskler och varför","startPosition":"exakt position","steps":["steg1","steg2","steg3","steg4"],"sets":3,"reps":"10","rest":"60 sek","tip":"säkerhetsanmärkning","correctFeel":"muskelaktivering","swapReason":"kort förklaring varför detta val"}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL_HAIKU,max_tokens:800,system:"Svara ALLTID med giltig JSON. Inga backticks.",messages:[{role:"user",content:prompt}]})});
    const data = await res.json();
    const txt = (data.content||[]).map(b=>b.text||'').join('');
    const newEx = JSON.parse(txt.replace(/```json|```/g,'').trim());
    S.plan.exercises[idx] = newEx;
    if (S.pat && S.visitId) {
      S.pat.visits = S.pat.visits.map(v=>v.id===S.visitId?{...v,plan:S.plan}:v);
      savePat(S.pat);
    }
    rEditEx();
    // Show brief success toast
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a7a4a;color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:700;animation:fadeInOv .2s ease';
    toast.textContent = `Bytt till "${newEx.name}"${newEx.swapReason ? ' — ' + newEx.swapReason : ''}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  } catch(err) {
    alert('Byte misslyckades: ' + err.message);
    if (items[idx]) items[idx].style.opacity = '1';
  }
}

REHABFAS: ${phase.label} — ${phase.name}

BEFINTLIG PLAN (${plan.exercises?.length||0} övningar):
${exList}

CHECK-IN DATA — ${recent.length} pass:
Smärta snitt: NRS ${avgPain}/10
Smärttrend: ${painTrend>0?`+${painTrend} (ökande)`:painTrend<0?`${painTrend} (minskande)`:'stabil'}
Genomförde alla: ${completionAll}/${recent.length} | Delvis: ${completionPartial}/${recent.length} | Bara några: ${completionFew}/${recent.length}
Låg energi: ${energyLow}/${recent.length} pass | Stelt: ${moveStiff}/${recent.length} pass
${patNotes?`\nPatientens noteringar:\n${patNotes}`:''}

Returnera ENBART giltig JSON utan backticks:
{"summary":"2-3 meningar som sammanfattar vad datan visar","urgency":"low|medium|high","adjustments":[{"type":"increase|decrease|replace|remove|add","exerciseIndex":0,"exerciseName":"namn","change":"Konkret ändring t.ex. Öka från 3×10 till 3×15","reason":"Varför — kopplat till check-in datan"}],"scheduleNote":"kommentar om frekvens eller tom sträng","messageToPatient":"kort uppmuntrande meddelande till patienten"}

urgency: high=smärta ökande/NRS>7, medium=låg genomförandegrad/stagnation, low=kan progrediera.
Max 3 förslag. Varje förslag = en specifik konkret åtgärd.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{

      body: JSON.stringify({model:MODEL_HAIKU, max_tokens:900, system:'Svara ALLTID med giltig JSON. Inga backticks.', messages:[{role:'user',content:prompt}]})
