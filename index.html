<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kansei Klinik</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root{
    --navy:#0f2744;
    --navy2:#1a3a5c;
    --navy3:#234878;
    --teal:#1a7a8a;
    --teal2:#2a9aaa;
    --teal3:#e8f6f8;
    --gold:#b8920a;
    --white:#ffffff;
    --bg:#f2f4f7;
    --bg2:#e8ebef;
    --border:#d0d8e4;
    --border2:#b8c4d4;
    --text:#1a2a3a;
    --text2:#3a4a5a;
    --text3:#6a7a8a;
    --text4:#9aabb8;
    --green:#1a7a4a;
    --green-bg:#e8f5ee;
    --amber:#8a6000;
    --amber-bg:#fdf3d8;
    --red:#8a2020;
    --red-bg:#fde8e8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}

  /* ── TOPBAR ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 16px;height:52px;background:var(--navy);border-bottom:1px solid var(--navy3);position:sticky;top:0;z-index:100;}
  .topbar-logo{height:32px;display:block;}
  .topbar-right{display:flex;gap:4px;align-items:center;}

  /* ── BUTTONS ── */
  .btn{padding:7px 16px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border2);background:white;color:var(--text2);transition:all .15s;white-space:nowrap;}
  .btn:hover{background:var(--bg);border-color:var(--teal);color:var(--teal);}
  .btn-p{background:var(--teal);border-color:var(--teal);color:white;font-weight:600;}
  .btn-p:hover{background:var(--teal2);border-color:var(--teal2);color:white;}
  .btn-navy{background:var(--navy);border-color:var(--navy);color:white;font-weight:600;}
  .btn-navy:hover{background:var(--navy2);}
  .btn-d{background:white;border-color:#f0c0c0;color:var(--red);}
  .btn-d:hover{background:var(--red-bg);}
  .btn-ghost{background:transparent;border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);}
  .btn-ghost:hover{background:rgba(255,255,255,0.08);color:white;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ── LAYOUT ── */
  .main{max-width:1100px;margin:0 auto;padding:28px 24px 80px;}
  .screen{display:none;}.screen.active{display:block;}

  /* ── DASHBOARD ── */
  .dash-greeting{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--navy);font-weight:300;margin-bottom:2px;}
  .dash-date{font-size:12px;color:var(--text3);margin-bottom:24px;}
  .dash-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
  .dash-action{background:white;border:1px solid var(--border);border-radius:10px;padding:20px;cursor:pointer;transition:all .2s;text-align:left;}
  .dash-action:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(26,122,138,0.1);transform:translateY(-1px);}
  .dash-action.primary{background:var(--navy);border-color:var(--navy);}
  .dash-action.primary:hover{background:var(--navy2);}
  .da-icon{font-size:22px;margin-bottom:10px;}
  .da-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px;}
  .dash-action.primary .da-title{color:white;}
  .da-sub{font-size:11px;color:var(--text3);line-height:1.5;}
  .dash-action.primary .da-sub{color:rgba(255,255,255,0.5);}
  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dash-panel{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .dash-panel-hdr{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .dash-panel-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);}
  .dash-panel-body{padding:0;}
  .dash-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
  .dash-row:last-child{border-bottom:none;}
  .dash-row:hover{background:var(--teal3);}
  .dr-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:white;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Mono',monospace;}
  .dr-info{flex:1;min-width:0;}
  .dr-name{font-size:13px;font-weight:500;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-diag{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dr-badge{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;}
  .dr-date{font-size:10px;color:var(--text4);font-family:'DM Mono',monospace;flex-shrink:0;}
  .dash-empty{padding:24px 16px;text-align:center;font-size:12px;color:var(--text4);}

  /* ── PATIENT LIST ── */
  .page-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;}
  .page-title{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--navy);font-weight:400;}
  .page-sub{font-size:12px;color:var(--text3);margin-top:2px;}
  .search-inp{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:16px;}
  .search-inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,0.08);}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
  .pcard{background:white;border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:all .18s;position:relative;}
  .pcard:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(26,122,138,0.09);transform:translateY(-1px);}
  .pc-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--border2);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:3px;}
  .pc-del:hover{color:var(--red);background:var(--red-bg);}
  .pc-name{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--navy);margin-bottom:2px;padding-right:20px;font-weight:400;}
  .pc-diag{font-size:11px;color:var(--teal);margin-bottom:10px;font-style:italic;}
  .pc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
  .pc-tag{font-size:10px;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:3px;border:1px solid var(--border);}
  .pc-bot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
  .pc-visits{font-size:10px;color:var(--text4);}
  .pc-status{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .empty{text-align:center;padding:60px 20px;}
  .empty-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text3);margin-bottom:12px;font-weight:300;}

  /* ── DETAIL ── */
  .det-hdr{background:white;border:1px solid var(--border);border-radius:10px;padding:22px 24px;margin-bottom:18px;}
  .det-name{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--navy);font-weight:400;margin-bottom:2px;}
  .det-diag{font-size:13px;color:var(--teal);font-style:italic;margin-bottom:14px;}
  .det-meta{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px;}
  .dml{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--text4);margin-bottom:3px;}
  .dmv{font-size:12px;color:var(--navy);font-family:'DM Mono',monospace;font-weight:500;}
  .det-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border);}
  .vlbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;font-weight:600;}
  .vcard{background:white;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .vcard.latest{border-color:var(--teal);border-left:3px solid var(--teal);}
  .vhdr{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;}
  .vhdr:hover{background:var(--teal3);}
  .vnum{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);width:20px;}
  .vinfo{flex:1;}
  .vdate{font-size:13px;color:var(--navy);font-weight:500;}
  .vexs{font-size:11px;color:var(--text3);margin-top:1px;}
  .vstatus{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .vchev{color:var(--text4);font-size:14px;transition:transform .2s;}
  .vchev.open{transform:rotate(90deg);}
  .vbody{padding:0 15px 15px;border-top:1px solid var(--border);}
  .vex-item{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--bg2);font-size:12px;}
  .vex-item:last-child{border-bottom:none;}
  .vex-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);}
  .vex-name{color:var(--text);}
  .vex-dose{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}
  .rf-banner{background:#fff3cd;border:1.5px solid #f5c842;border-radius:10px;padding:14px 16px;margin:12px 0;color:#7a5000}
  .rf-title{font-weight:700;font-size:12px;margin-bottom:8px;color:#6a3000;letter-spacing:.02em}
  .rf-item{font-size:12px;margin-bottom:5px;line-height:1.5;padding-left:8px;border-left:2px solid #f5c842}
  .note-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin:11px 0 5px;}
  .note-inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:55px;}
  .note-inp:focus{border-color:var(--teal);}
  .srow{display:flex;align-items:center;gap:7px;margin-top:8px;}
  .slbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
  .ssel{background:white;border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:11px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;}
  .vactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  /* ── SOAP IN VISIT ── */
  .soap-card{margin-top:10px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .soap-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--teal3);border-bottom:1px solid var(--border);}
  .soap-card-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:600;}
  .soap-card-icd{font-family:'DM Mono',monospace;font-size:10px;color:var(--navy);background:white;padding:2px 7px;border-radius:3px;border:1px solid var(--border);}
  .soap-row{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bg2);font-size:11px;align-items:baseline;}
  .soap-row:last-child{border-bottom:none;}
  .soap-l{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .soap-l.S{background:#dceef8;color:#1a5a8a;}
  .soap-l.O{background:#dcf0e4;color:#1a6a3a;}
  .soap-l.A{background:#fdf3d8;color:#7a5a00;}
  .soap-l.P{background:#ede0f8;color:#5a20a0;}
  .soap-t{color:var(--text2);line-height:1.55;}

  /* ── FORM ── */
  .fw{max-width:600px;margin:0 auto;}
  .ftit{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);margin-bottom:3px;font-weight:400;}
  .fsub{color:var(--text3);font-size:12px;margin-bottom:22px;}
  .slabel{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:7px;margin-top:18px;display:block;font-weight:600;}
  .field{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;}
  .field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,0.08);}
  .field option{background:white;}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .slwrap{margin-bottom:11px;}
  .slhd{display:flex;justify-content:space-between;margin-bottom:4px;}
  .sllbl{font-size:12px;color:var(--text2);}
  .slval{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;color:var(--navy);}
  input[type=range]{width:100%;accent-color:var(--teal);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .chip{padding:5px 13px;border-radius:4px;border:1px solid var(--border);background:white;color:var(--text3);font-size:12px;cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif;}
  .chip.on{border-color:var(--teal);background:var(--teal3);color:var(--teal);font-weight:600;}
  .hint{font-size:11px;color:var(--text3);margin-bottom:5px;line-height:1.6;}
  .genbtn{width:100%;margin-top:20px;padding:13px;background:var(--navy);border:none;border-radius:7px;font-family:'Cormorant Garamond',serif;font-size:17px;color:white;cursor:pointer;letter-spacing:.04em;font-weight:400;}
  .genbtn:hover:not(:disabled){background:var(--navy2);}
  .genbtn:disabled{opacity:.4;cursor:not-allowed;}
  .errbox{background:var(--red-bg);border:1px solid #f0c0c0;border-radius:6px;padding:9px 12px;color:var(--red);margin-bottom:12px;font-size:12px;}

  /* ── EDIT EX ── */
  .eelist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .eeitem{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:7px;border:1px solid;transition:all .18s;}
  .eeitem.lk{border-color:var(--teal);background:var(--teal3);}
  .eeitem.ul{border-color:var(--border);background:white;}
  .eenum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;flex-shrink:0;border:1px solid;}
  .lk .eenum{background:white;color:var(--teal);border-color:var(--teal);}
  .ul .eenum{background:var(--bg);color:var(--text4);border-color:var(--border);}
  .eeinfo{flex:1;}
  .eename{font-size:13px;font-weight:500;}
  .lk .eename{color:var(--navy);}.ul .eename{color:var(--text3);}
  .eedose{font-size:10px;color:var(--text4);margin-top:2px;font-family:'DM Mono',monospace;}
  .eest{font-size:9px;margin-top:2px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
  .lk .eest{color:var(--teal);}.ul .eest{color:var(--text4);}
  .lkbtn{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;font-family:'DM Sans',sans-serif;}
  .lkbtn.on{border-color:var(--teal);background:white;color:var(--teal);}
  .lkbtn.off{border-color:var(--border);background:var(--bg);color:var(--text3);}
  .rinfo{background:var(--teal3);border:1px solid var(--teal);border-radius:6px;padding:7px 12px;font-size:12px;color:var(--teal);text-align:center;margin-bottom:12px;}

  /* ── LOADING ── */
  .ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:13px;}
  .spin{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--teal);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ldtit{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--navy);font-weight:300;letter-spacing:.04em;}
  .ldst{font-size:12px;display:flex;align-items:center;gap:8px;transition:color .3s;}
  .ldst.done{color:var(--green);}.ldst.act{color:var(--teal);}.ldst.wait{color:var(--text4);}

  /* ── SETTINGS ── */
  .swrap{max-width:480px;margin:0 auto;}
  .stit{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);font-weight:400;margin-bottom:3px;}
  .ssub{font-size:12px;color:var(--text3);margin-bottom:22px;line-height:1.6;}
  .akwrap{position:relative;margin-bottom:7px;}
  .akinp{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 44px 9px 12px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;outline:none;}
  .akinp:focus{border-color:var(--teal);}
  .aktgl{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;}
  .akst{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:6px;}
  .akdot{width:6px;height:6px;border-radius:50%;}
  .akhint{font-size:11px;color:var(--text3);line-height:1.7;margin-bottom:12px;}
  .akhint a{color:var(--teal);}
  .svconf{font-size:11px;color:var(--green);margin-left:9px;opacity:0;transition:opacity .3s;}
  .svconf.show{opacity:1;}

  /* ── MODAL ── */
  .modal-ov{display:none;position:fixed;inset:0;background:rgba(15,39,68,0.5);align-items:center;justify-content:center;z-index:200;}
  .modal-ov.open{display:flex;}
  .modal{background:white;border:1px solid var(--border);border-radius:12px;padding:26px;max-width:380px;width:90%;box-shadow:0 8px 32px rgba(15,39,68,0.15);}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--navy);margin-bottom:6px;font-weight:400;}
  .modal-text{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:18px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  /* ── MEETING ── */
  .meet-wrap{max-width:680px;margin:0 auto;}
  .meet-consent{background:var(--teal3);border:1px solid var(--teal);border-radius:8px;padding:18px 22px;margin-bottom:20px;}
  .meet-consent-title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--navy);margin-bottom:7px;font-weight:400;}
  .meet-consent-txt{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:13px;}
  .meet-consent-btn{display:flex;gap:9px;}
  .meet-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);font-weight:400;margin-bottom:3px;}
  .meet-sub{font-size:12px;color:var(--text3);margin-bottom:20px;}
  .meet-status{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 15px;border-radius:7px;background:white;border:1px solid var(--border);}
  .meet-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .meet-dot.listening{background:#c03030;animation:pulse 1.2s ease-in-out infinite;}
  .meet-dot.idle{background:var(--border2);}
  .meet-dot.processing{background:var(--amber);animation:pulse .8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .meet-status-txt{font-size:12px;color:var(--text2);flex:1;}
  .meet-timer{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);}
  .transcript-box{background:white;border:1px solid var(--border);border-radius:7px;padding:14px;min-height:180px;max-height:320px;overflow-y:auto;margin-bottom:14px;font-size:12px;color:var(--text2);line-height:1.8;}
  .transcript-line{margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--bg2);}
  .transcript-line:last-child{border-bottom:none;}
  .tl-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);margin-right:8px;}
  .tl-text{color:var(--text);}
  .tl-text.interim{color:var(--text3);font-style:italic;}
  .meet-controls{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;}
  .rec-btn{padding:11px 20px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;transition:all .18s;flex:1;}
  .rec-btn.start{background:#c03030;color:white;}
  .rec-btn.start:hover{background:#d04040;}
  .rec-btn.stop{background:var(--red-bg);border:1px solid #f0c0c0;color:var(--red);}
  .meet-note{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:65px;margin-bottom:13px;line-height:1.6;}
  .meet-note:focus{border-color:var(--teal);}
  .meet-done-btn{width:100%;padding:13px;background:var(--navy);border:none;border-radius:7px;font-family:'Cormorant Garamond',serif;font-size:17px;color:white;cursor:pointer;letter-spacing:.04em;}
  .meet-done-btn:hover:not(:disabled){background:var(--navy2);}
  .meet-done-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ── SOAP NOTE (review) ── */
  .soap-wrap{max-width:640px;margin:0 auto;}
  .soap-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);font-weight:400;margin-bottom:3px;}
  .soap-sub{font-size:12px;color:var(--text3);margin-bottom:20px;}
  .soap-section{background:white;border:1px solid var(--border);border-radius:7px;margin-bottom:10px;overflow:hidden;}
  .soap-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);}
  .soap-letter{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;width:21px;height:21px;border-radius:4px;display:flex;align-items:center;justify-content:center;}
  .soap-letter.S{background:#dceef8;color:#1a5a8a;}
  .soap-letter.O{background:#dcf0e4;color:#1a6a3a;}
  .soap-letter.A{background:#fdf3d8;color:#7a5a00;}
  .soap-letter.P{background:#ede0f8;color:#5a20a0;}
  .soap-hdr-title{font-size:12px;color:var(--text2);font-weight:500;}
  .soap-body{padding:11px 14px;}
  .soap-edit{width:100%;background:transparent;border:none;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:58px;line-height:1.7;}
  .soap-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;}
  .soap-diag-row{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap;}
  .soap-diag-field{flex:1;background:white;border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
  .soap-diag-field:focus{border-color:var(--teal);}
  .soap-diag-lbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;font-weight:600;}

  /* ── MANUAL SOAP ── */
  .msoap-wrap{max-width:620px;margin:0 auto;}
  .msoap-hint{background:var(--teal3);border:1px solid var(--teal);border-radius:7px;padding:10px 14px;font-size:12px;color:var(--text2);margin-bottom:18px;line-height:1.6;}
  .msoap-section{margin-bottom:13px;}
  .msoap-hdr{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .msoap-lbl{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .msoap-lbl.S{background:#dceef8;color:#1a5a8a;}
  .msoap-lbl.O{background:#dcf0e4;color:#1a6a3a;}
  .msoap-lbl.A{background:#fdf3d8;color:#7a5a00;}
  .msoap-lbl.P{background:#ede0f8;color:#5a20a0;}
  .msoap-name{font-size:12px;color:var(--text2);}
  .msoap-ta{width:100%;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:70px;line-height:1.65;}
  .msoap-ta:focus{border-color:var(--teal);}
  .msoap-diag-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:5px;}

  /* ── EDIT PATIENT ── */
  .edit-wrap{max-width:540px;margin:0 auto;}

  /* ── CHART ── */
  .chart-wrap{background:white;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;}
  .chart-title{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;font-weight:600;}

  /* ── DOC (rehab plan print) ── */
  .doc-outer{background:var(--bg2);min-height:100vh;}
  .dcontrols{background:var(--navy);padding:9px 28px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--navy3);}
  .dhint{font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;}
  .document{max-width:794px;margin:0 auto;background:white;font-family:'DM Sans',sans-serif;color:#2a2520;border:1px solid #ccc;}
  .dochdr{background:white;padding:32px 48px 22px;border-bottom:2px solid var(--teal);}
  .dhtop{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #e0dbd4;margin-bottom:14px;}
  .dlogo{height:48px;}
  .dlogo-sub{font-size:9px;color:#9a9490;margin-top:4px;letter-spacing:.12em;text-transform:uppercase;text-align:right;}
  .dtag{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:5px;}
  .dpname{font-family:'Cormorant Garamond',serif;font-size:28px;color:#0f2744;font-weight:400;line-height:1.1;}
  .ddiag{font-size:12px;color:#6a7a8a;margin-top:3px;font-style:italic;}
  .dmeta{display:flex;gap:22px;flex-wrap:wrap;}
  .dml{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#9a9490;margin-bottom:2px;}
  .dmv{font-size:12px;color:#0f2744;font-family:'DM Mono',monospace;font-weight:500;}
  .dbody{padding:30px 48px;}
  .dgreet{font-family:'Cormorant Garamond',serif;font-size:14px;line-height:1.85;color:#4a4540;font-style:italic;font-weight:300;border-left:3px solid var(--teal);padding-left:15px;margin-bottom:28px;}
  .dsec{font-family:'Cormorant Garamond',serif;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:11px;padding-bottom:6px;border-bottom:2px solid var(--teal);}
  .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:26px;border:1px solid #ddd;}
  .gcell{padding:13px;border-right:1px solid #ddd;}
  .gcell:last-child{border-right:none;}
  .glbl{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;font-weight:600;}
  .gtxt{font-size:12px;color:#2a2520;line-height:1.55;font-weight:300;}
  .excard{margin-bottom:14px;page-break-inside:avoid;border:1px solid #ddd;}
  .exhdr{display:grid;grid-template-columns:38px 1fr auto;align-items:center;border-bottom:1px solid #ddd;}
  .exnum{display:flex;align-items:center;justify-content:center;height:36px;border-right:1px solid #ddd;font-family:'DM Mono',monospace;font-size:13px;color:var(--teal);font-weight:700;}
  .exname{padding:0 13px;font-family:'Cormorant Garamond',serif;font-size:15px;color:#0f2744;}
  .exdose{padding:0 13px;font-size:10px;color:var(--teal);font-family:'DM Mono',monospace;white-space:nowrap;font-weight:600;}
  .exbody{padding:13px 17px;}
  .expurp{font-size:11px;color:#6a6560;margin-bottom:9px;line-height:1.6;font-style:italic;border-bottom:1px solid #eee;padding-bottom:9px;}
  .exsp-lbl{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#4a4540;font-weight:600;display:block;margin-bottom:2px;}
  .exsp{font-size:11px;color:#6a6560;margin-bottom:9px;line-height:1.5;}
  .exsteps{list-style:none;margin-bottom:9px;}
  .exsteps li{display:grid;grid-template-columns:17px 1fr;gap:6px;margin-bottom:4px;font-size:11px;color:#2a2520;line-height:1.55;padding-bottom:4px;border-bottom:1px solid #f0ece4;}
  .exsteps li:last-child{border-bottom:none;margin-bottom:0;}
  .stepn{font-family:'DM Mono',monospace;font-size:9px;color:var(--teal);font-weight:600;}
  .exnote{border-left:3px solid #c8a84b;padding:6px 10px;font-size:10px;color:#5a4a20;margin-bottom:5px;line-height:1.5;background:#fffdf5;}
  .exnote-lbl{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:#c8a84b;display:block;margin-bottom:2px;font-weight:600;}
  .exok{border-left:3px solid #2a8a40;padding:6px 10px;font-size:10px;color:#1a4a20;line-height:1.5;background:#f5fff7;}
  .exok-lbl{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:#2a8a40;display:block;margin-bottom:2px;font-weight:600;}
  .scgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-bottom:26px;border:1px solid #ddd;}
  .scday{text-align:center;padding:9px 3px;border-right:1px solid #ddd;}
  .scday:last-child{border-right:none;}
  .scday.act{border-top:3px solid var(--teal);}
  .scday .dn{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#9a9490;margin-bottom:2px;}
  .scday.act .dn{color:var(--teal);font-weight:600;}
  .scday .dt{font-size:9px;color:#6a6560;line-height:1.35;}
  .scday.act .dt{color:#0f2744;font-weight:500;}
  .pgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:26px;border:1px solid #ddd;}
  .pcell{padding:12px;border-right:1px solid #ddd;}
  .pcell:last-child{border-right:none;}
  .phead{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .pdot{width:7px;height:7px;border-radius:50%;}
  .plbl{font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;}
  .pcell.gr .pdot{background:#2a8a40;}.pcell.gr .plbl{color:#2a8a40;}
  .pcell.ye .pdot{background:#c8a030;}.pcell.ye .plbl{color:#c8a030;}
  .pcell.re .pdot{background:#c05050;}.pcell.re .plbl{color:#c05050;}
  .ptxt{font-size:10px;color:#4a4540;line-height:1.55;font-weight:300;}
  .lifelist{list-style:none;margin-bottom:26px;}
  .lifelist li{display:grid;grid-template-columns:13px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid #eee;font-size:11px;color:#2a2520;line-height:1.55;font-weight:300;}
  .lifelist li::before{content:"—";color:var(--teal);font-weight:600;}
  .fubanner{border-left:3px solid var(--teal);padding:13px 17px;margin-bottom:26px;background:#f4f9fa;}
  .futxt{font-family:'Cormorant Garamond',serif;font-size:13px;color:#0f2744;line-height:1.7;font-weight:300;font-style:italic;}
  .dftr{border-top:2px solid var(--teal);padding:13px 48px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:12px;}
  .ftrlogo{height:32px;filter:brightness(0);opacity:0.35;}
  .ftrclinic{font-size:9px;color:#8a8580;line-height:1.8;margin-top:3px;}
  .ftrclinic strong{color:#4a4540;font-weight:600;display:block;font-size:10px;}
  .ftrr{text-align:right;font-size:9px;color:#8a8580;line-height:1.8;}
  .ftrslog{font-style:italic;color:var(--teal);margin-bottom:1px;font-weight:500;}

  /* ── JOURNAL DOC ── */
  .jdoc{max-width:794px;margin:0 auto;background:white;font-family:'DM Sans',sans-serif;color:#2a2520;border:1px solid #ccc;}
  .jdoc-hdr{background:white;padding:26px 48px 17px;border-bottom:2px solid var(--teal);display:flex;justify-content:space-between;align-items:flex-start;}
  .jdoc-title{font-family:'Cormorant Garamond',serif;font-size:25px;color:#0f2744;font-weight:400;}
  .jdoc-sub{font-size:12px;color:#6a7a8a;margin-top:2px;}
  .jdoc-meta{display:flex;gap:18px;margin-top:9px;flex-wrap:wrap;}
  .jdoc-body{padding:26px 48px;}
  .jdoc-sec{font-family:'Cormorant Garamond',serif;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:9px;padding-bottom:5px;border-bottom:2px solid var(--teal);margin-top:20px;}
  .jdoc-sec:first-child{margin-top:0;}
  .jdoc-soap{border:1px solid #ddd;margin-bottom:5px;}
  .jdoc-soap-hdr{display:grid;grid-template-columns:30px 1fr;align-items:center;border-bottom:1px solid #ddd;}
  .jdoc-soap-l{display:flex;align-items:center;justify-content:center;height:30px;border-right:1px solid #ddd;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;}
  .jdoc-soap-l.S{color:#1a5a8a;}.jdoc-soap-l.O{color:#1a6a3a;}.jdoc-soap-l.A{color:#7a5a00;}.jdoc-soap-l.P{color:#5a20a0;}
  .jdoc-soap-title{padding:0 11px;font-size:11px;color:#4a4540;font-style:italic;}
  .jdoc-soap-body{padding:9px 13px;font-size:11px;color:#2a2520;line-height:1.7;white-space:pre-wrap;}
  .jdoc-icd{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;background:#f4f9fa;border:1px solid #d0e8ec;border-radius:4px;margin-bottom:14px;}
  .jdoc-icd-code{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--teal);}
  .jdoc-icd-desc{font-size:12px;color:#4a4540;}
  .jdoc-ftr{border-top:2px solid var(--teal);padding:11px 48px;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#8a8580;}
  .jdoc-ftr-logo{height:26px;filter:brightness(0);opacity:0.3;}

  
  /* ── PHASES ── */
  .phase-bar{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:18px;}
  .phase-step{flex:1;padding:12px 10px;text-align:center;cursor:pointer;transition:all .15s;border-right:1px solid var(--border);background:white;}
  .phase-step:last-child{border-right:none;}
  .phase-step:hover{background:var(--bg);}
  .phase-step.active{background:var(--navy);color:white;}
  .phase-step.done{background:var(--teal3);}
  .ps-icon{font-size:14px;margin-bottom:3px;}
  .ps-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:1px;}
  .phase-step.active .ps-label{color:rgba(255,255,255,0.6);}
  .phase-step.done .ps-label{color:var(--teal);}
  .ps-name{font-size:11px;font-weight:600;color:var(--navy);}
  .phase-step.active .ps-name{color:white;}
  .phase-step.done .ps-name{color:var(--teal);}
  .ps-desc{font-size:9px;color:var(--text3);margin-top:2px;line-height:1.4;}
  .phase-step.active .ps-desc{color:rgba(255,255,255,0.5);}
  .phase-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;}
  .phase-next{background:var(--teal3);border:1px solid var(--teal);border-radius:8px;padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .phase-next-txt{font-size:12px;color:var(--text2);line-height:1.5;}
  .phase-next-txt strong{color:var(--navy);display:block;margin-bottom:2px;}
@media print{
    .tb,.dcontrols{display:none!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    .doc-outer,.jdoc{background:white;}
    .document,.jdoc{max-width:100%;border:none;}
  }

  /* ── EKONOMI ── */

  /* ── INTAG-FLÖDE ── */
  .ipb-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);color:white;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ipb-name{font-size:14px;font-weight:600;color:white;}
  .ipb-meta{font-size:11px;color:rgba(255,255,255,0.5);}
  .ipb-change{font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;margin-left:auto;text-decoration:underline;}
  .ipb-change:hover{color:white;}
  .svc-chip{padding:10px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;background:white;display:flex;justify-content:space-between;align-items:center;}
  .svc-chip:hover{border-color:var(--teal);color:var(--teal);}
  .svc-chip.selected{background:var(--navy);border-color:var(--navy);color:white;}
  .svc-chip-price{font-size:10px;opacity:.6;font-family:'DM Mono',monospace;}
  .channel-chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:11px;font-weight:500;transition:all .12s;background:white;}
  .channel-chip:hover{border-color:var(--teal);}
  .channel-chip.selected{background:var(--teal);border-color:var(--teal);color:white;}
  .ina-btn{padding:14px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all .15s;text-align:left;}
  .ina-btn:hover{border-color:var(--teal);background:var(--teal3);}
  .ina-btn.primary{background:var(--navy);border-color:var(--navy);color:white;}
  .ina-btn.primary:hover{background:var(--navy2);}
  .ina-icon{font-size:18px;margin-bottom:6px;display:block;}
  .ina-sub{font-size:10px;color:var(--text3);margin-top:2px;font-weight:400;}
  .ina-btn.primary .ina-sub{color:rgba(255,255,255,0.5);}
  .intakt-saved-banner{background:#e8f5ee;border:1px solid #a0d8b0;border-radius:6px;padding:9px 14px;font-size:12px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;}

  /* ── SIDE-BY-SIDE SOAP ── */
  .sbs-wrap{max-width:1200px;margin:0 auto;}
  .sbs-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .sbs-col-label{padding:8px 14px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  .sbs-col-label.prev{background:var(--amber-bg);color:var(--amber);border:1px solid #e0c860;}
  .sbs-col-label.curr{background:var(--teal3);color:var(--teal);border:1px solid var(--teal);}
  .sbs-col-detail{font-size:12px;font-weight:400;color:var(--text3);margin-left:auto;text-transform:none;letter-spacing:0;}
  .sbs-section{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  .sbs-panel{background:white;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .sbs-phdr{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);}
  .sbs-letter{width:22px;height:22px;border-radius:4px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sbs-letter.S{background:#ffe8e8;color:#a03030;}
  .sbs-letter.O{background:#e8eeff;color:#2030a0;}
  .sbs-letter.A{background:var(--amber-bg);color:var(--amber);}
  .sbs-letter.P{background:var(--green-bg);color:var(--green);}
  .sbs-pname{font-size:10px;color:var(--text3);}
  .sbs-prev-body{padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.7;min-height:80px;background:#fefcf0;font-style:italic;}
  .sbs-curr-ta{width:100%;padding:10px 12px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);line-height:1.7;min-height:80px;border:none;outline:none;resize:vertical;background:white;}
  .sbs-curr-ta:focus{background:#f8fcff;}
  .sbs-prev-exlist{padding:8px 12px;background:#fefcf0;}
  .sbs-ex-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);}
  .sbs-ex-row:last-child{border-bottom:none;}
  .sbs-ex-n{width:16px;height:16px;border-radius:3px;background:var(--amber-bg);color:var(--amber);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sbs-goals-prev{padding:10px 12px;background:#fefcf0;}
  .sbs-goal-row{margin-bottom:6px;font-size:11px;}
  .sbs-goal-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);}
  .sbs-goal-val{color:var(--text2);font-style:italic;margin-top:1px;}
  .sbs-pain-compare{display:flex;gap:10px;margin-bottom:14px;}
  .sbs-pain-box{flex:1;background:white;border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;}
  .sbs-pain-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--navy);}
  .sbs-pain-lbl{font-size:10px;color:var(--text3);margin-top:2px;}
  .sbs-delta{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:4px;display:inline-block;}
  .sbs-delta.better{background:var(--green-bg);color:var(--green);}
  .sbs-delta.worse{background:var(--red-bg);color:var(--red);}
  .sbs-delta.same{background:var(--bg);color:var(--text3);}
  @media(max-width:750px){
    .sbs-section,.sbs-top{grid-template-columns:1fr;}
    }
  /* ── BETALSTATUS ── */
  .pay-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:opacity .12s;user-select:none;}
  .pay-badge:hover{opacity:.8;}
  .pay-badge.paid{background:#e8f5ee;color:#1a7a4a;border-color:#a0d8b0;}
  .pay-badge.unpaid{background:#fde8e8;color:#a03030;border-color:#f0b0b0;}
  .pay-badge.invoiced{background:#fdf3d8;color:#8a6000;border-color:#e0c060;}
  .pay-popup{position:fixed;z-index:200;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);min-width:160px;overflow:hidden;}
  .pay-opt{padding:10px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .pay-opt:hover{background:var(--bg);}
  /* ── SAMTYCKE ── */
  .consent-wrap{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-top:12px;}
  .consent-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .consent-hdr-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);}
  .consent-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .consent-row:last-child{border-bottom:none;}
  .consent-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .consent-type{flex:1;color:var(--text2);}
  .consent-date{font-size:10px;color:var(--text3);font-family:monospace;}
  .consent-rev{font-size:10px;color:var(--red);cursor:pointer;text-decoration:underline;margin-left:6px;}
  /* ── PATIENTJOURNAL PDF ── */
  .pjdoc{max-width:800px;margin:0 auto;background:white;}
  .pjdoc-cover{padding:48px 48px 28px;border-bottom:3px solid var(--navy);}
  .pjdoc-clinic-name{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
  .pjdoc-patient-name{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--navy);font-weight:400;margin-bottom:4px;}
  .pjdoc-diag{font-size:13px;color:var(--text3);}
  .pjdoc-meta-row{display:flex;gap:24px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border);}
  .pjdoc-mi .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text4);margin-bottom:2px;}
  .pjdoc-mi .val{font-size:13px;font-weight:600;color:var(--navy);}
  .pjdoc-section{padding:24px 48px;border-bottom:1px solid var(--border);}
  .pjdoc-sec-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--teal);margin-bottom:14px;}
  .pjdoc-visit-block{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--bg2);}
  .pjdoc-visit-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .pjdoc-visit-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .pjdoc-visit-n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pjdoc-visit-date{font-weight:700;color:var(--navy);font-size:13px;}
  .pjdoc-soap-row{display:grid;grid-template-columns:22px 1fr;gap:8px;margin-bottom:6px;}
  .pjdoc-sl{width:20px;height:20px;border-radius:3px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .pjdoc-sl.S{background:#ffe8e8;color:#a03030;}
  .pjdoc-sl.O{background:#e8eeff;color:#2030a0;}
  .pjdoc-sl.A{background:var(--amber-bg);color:var(--amber);}
  .pjdoc-sl.P{background:var(--green-bg);color:var(--green);}
  .pjdoc-soap-text{font-size:12px;line-height:1.7;color:var(--text2);padding-top:1px;white-space:pre-wrap;}
  .pjdoc-exercises{margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:6px;}
  .pjdoc-ex-row{display:flex;gap:8px;font-size:11px;padding:2px 0;color:var(--text2);}
  .pjdoc-ex-n{color:var(--text4);font-family:monospace;flex-shrink:0;width:20px;}
  .pjdoc-ftr{padding:20px 48px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--navy);}
  .pjdoc-ftr-txt{font-size:10px;color:var(--text3);line-height:1.8;}
  .login-wrap{max-width:360px;margin:80px auto;padding:0 20px}
  .login-logo{height:48px;margin-bottom:24px}
  .login-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--navy);font-weight:400;margin-bottom:4px}
  .login-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
  .login-field{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;margin-bottom:10px;background:white}
  .login-field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,0.08)}
  .login-btn{width:100%;padding:13px;background:var(--navy);color:white;border:none;border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:4px;font-weight:600;letter-spacing:.02em}
  .login-btn:hover{background:#2a4a5a}
  .login-err{font-size:12px;color:#c07070;margin-top:8px;min-height:18px}
  .login-hint{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}
  .pub-wrap{max-width:600px;margin:0 auto;padding:0 0 40px}
  .pub-loading{text-align:center;padding:80px 20px;color:#8a9aaa;font-size:14px}
  @media print{
    .dcontrols{display:none!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    .pjdoc-section{page-break-inside:avoid;}
  }
</style>
</head>

async function sbUpsertPat(pat) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients', {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ id: pat.id, data: pat, updated_at: new Date().toISOString() })
    });
    return res.ok;
  } catch(e) { return false; }
}

async function sbDeletePat(id) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders()
    });
    return res.ok;
  } catch(e) { return false; }
}

async function sbLoadAll() {
  try {
    const res = await fetch(SB_URL + '/rest/v1/patients?select=id,data,updated_at&order=updated_at.desc', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.map(r => r.data).filter(Boolean);
  } catch(e) { return null; }
}

async function syncToCloud() {
  if (_sbSyncing) return;
  _sbSyncing = true;
  setSyncStatus('syncing', 'Sparar...');
  let ok = true;
  for (const p of S.patients) {
    const r = await sbUpsertPat(p);
    if (!r) { ok = false; break; }
  }
  _sbSyncing = false;
  if (ok) {
    setSyncStatus('ok', 'Synkad');
    setTimeout(() => setSyncStatus('idle', ''), 3000);
  } else {
    setSyncStatus('error', 'Synkfel');
  }
}

async function syncFromCloud() {
  setSyncStatus('syncing', 'Hämtar...');
  const cloudPats = await sbLoadAll();
  if (!cloudPats) { setSyncStatus('error', 'Anslutningsfel'); return; }

  // Merge: cloud wins if newer
  const local = {};
  S.patients.forEach(p => local[p.id] = p);

  cloudPats.forEach(cp => {
    const lp = local[cp.id];
    if (!lp || (cp.updatedAt||0) > (lp.updatedAt||0)) {
      local[cp.id] = cp;
      try { localStorage.setItem('kansei-data:'+cp.id, JSON.stringify(cp)); } catch {}
    }
  });

  S.patients = Object.values(local).sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0));
  setSyncStatus('ok', cloudPats.length + ' patienter');
  setTimeout(() => setSyncStatus('idle', ''), 3000);

  // Re-render current screen
  if (S.screen === 'dashboard') rDashboard();
  else if (S.screen === 'list') rList();
}

function loadPats(){
  const seen=new Set();
  const pats=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k)continue;
    // Match ALL patient key formats: kansei-data:xxx, pat:xxx, pat_xxx, kpat_xxx
    const isPatKey=k.startsWith('kansei-data:')||k.startsWith('pat:')||
                   (k.startsWith('pat_')&&!k.includes(':'))||
                   (k.startsWith('kpat_')&&!k.includes(':'));
    if(isPatKey){
      try{
        const v=localStorage.getItem(k);
        if(!v)continue;
        const p=JSON.parse(v);
        if(p&&p.id&&typeof p.id==='string'&&!seen.has(p.id)){
          seen.add(p.id);pats.push(p);
        }
      }catch{}
    }
  }
  S.patients=pats;
  S.patients.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  // Re-save under canonical key so future loads are consistent
  S.patients.forEach(p=>{try{localStorage.setItem('kansei-data:'+p.id,JSON.stringify(p));}catch{}});
}

  const upcoming = S.patients.filter(p => {
    if (!p.visits||!p.visits[0]||!p.visits[0].form) return false;
    const fw = p.visits[0].form.followup||4;

    const pph=PHASES[(p.phase||1)-1];

// ── PHASE MANAGEMENT ──────────────────────────────────────────────────────────
function getCurrentPhase(pat) {
  return pat.phase || 1;
}

function setPhase(phaseId) {
  if (!S.pat) return;
  S.pat = savePat({...S.pat, phase: phaseId});
  rDetail();
}

function getPhasePromptAddition(phase) {
  const additions = {
    1: `\n\nBEHANDLINGSFAS: Fas 1 — Smärtlindring
Fokusera på: smärtlindrande övningar, lätt rörlighetsträning, avlastning, andning och avspänning.
UNDVIK: tung belastning, uthållighetsövningar, styrkeövningar.
Övningarna ska vara skonsamma, 0-3 NRS under och efter träning.`,
    2: `\n\nBEHANDLINGSFAS: Fas 2 — Stabilisering
Fokusera på: muskelstyrka, neuromuskulär kontroll, stabilisering, funktionella rörelsemönster.
Progressiv belastning är OK. Inkludera proprioception och balansövningar.
Bygga upp kapacitet steg för steg.`,
    3: `\n\nBEHANDLINGSFAS: Fas 3 — Underhåll & friskvård
Fokusera på: upprätthålla styrka och rörlighet, förebygga återfall, generell friskvård.
Varierande träning, aerob kondition, livsstilsråd för långsiktig hälsa.
Patienten ska kunna självhantera.`
  };
  return additions[phase] || '';
}

function renderPhaseBar(pat) {
  const cur = getCurrentPhase(pat);
  return `<div class="phase-bar">
    ${PHASES.map(p => {
      const isDone = p.id < cur;
      const isActive = p.id === cur;
      return `<div class="phase-step ${isActive?'active':''} ${isDone?'done':''}" onclick="setPhase(${p.id})" title="Klicka för att sätta fas">
        <div class="ps-icon">${isDone?'✓':p.icon}</div>
        <div class="ps-label">${p.label}</div>
        <div class="ps-name">${p.name}</div>
        <div class="ps-desc">${p.desc}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderPhaseNext(pat) {
  const cur = getCurrentPhase(pat);
  const ph = PHASES[cur-1];
  const next = PHASES[cur]; // next phase (may be undefined)

  const lastVisit = pat.visits && pat.visits[0];
  const lastDate = lastVisit && lastVisit.date;
  const fw = lastVisit && lastVisit.form && lastVisit.form.followup;
  let nextDue = '';
  if (lastDate && fw) {
    const d = new Date(lastDate); d.setDate(d.getDate() + fw*7);
    nextDue = d.toLocaleDateString('sv-SE');
  }

  const nextPhaseHint = next
    ? `<button class="btn btn-p" style="font-size:11px;padding:5px 12px;flex-shrink:0" onclick="setPhase(${next.id})">Avancera till ${next.label} →</button>`
    : `<span style="font-size:11px;color:var(--green);font-weight:600">✓ Behandling slutförd</span>`;

  return `<div class="phase-next">
    <div class="phase-next-txt">
      <strong>Aktuell fas: ${ph.icon} ${ph.label} — ${ph.name}</strong>
      ${ph.desc}${nextDue ? ` · Återbesök planerat ${nextDue}` : ''}
    </div>
    ${nextPhaseHint}
  </div>`;
}

function rDetail(){const p=S.pat;if(!p){go("list");return;}const age=new Date().getFullYear()-(p.birthYear||0);let h=renderPhaseBar(p)+renderPhaseNext(p)+`<div class="det-hdr"><div><div class="det-name">${e(p.name||"Namnlös")}</div><div class="det-diag">${e(p.diagnosis||"")}</div><div class="det-meta"><div><div class="dml">Personnummer</div><div class="dmv">${p.pnr||"—"}</div></div><div><div class="dml">Födelseår</div><div class="dmv">${p.birthYear||"—"}</div></div><div><div class="dml">Ålder</div><div class="dmv">${age} år</div></div><div><div class="dml">Besök</div><div class="dmv">${(p.visits||[]).length}</div></div><div><div class="dml">Senast</div><div class="dmv">${(p.visits&&p.visits[0]&&p.visits[0].date)||"—"}</div></div></div></div><div class="det-actions">${S.visitId&&S.plan?`<button class="btn" onclick="go('doc')">← Tillbaka till plan</button>`:""}<button class="btn" onclick="go('patjournal')">📄 Exportera journal</button>${(p.visits||[]).length>=2?`<button class="btn" id="prog-btn-${p.id}" onclick="showProgressNote('${p.id}')">📊 Framstegsnotering</button>`:""}<button class="btn btn-d" onclick="confDel('pat','${p.id}','${e(p.name||"patienten")}')">Radera patient</button><button class="btn btn-p" onclick="newVisit()">+ Nytt besök</button></div></div><div class="vlbl">Besökshistorik</div>${renderPainGraph(p)}`;if(!p.visits||!p.visits.length){h+=`<div style="color:#4a5a6a;font-size:13px;padding:26px 0;text-align:center">Inga besök ännu. <a href="#" onclick="newVisit();return false" style="color:#4a9aaa">Skapa första besöket</a></div>`;}else{p.visits.forEach((v,idx)=>{const st=v.status||"Aktiv";const sc=SCOL[st]||{bg:'#eef0f3',col:'#5a6a7a'};const exp=v._exp||false;const pay=v.payStatus||'unpaid';const payLabel={paid:'✓ Betald',unpaid:'⚠ Obetald',invoiced:'📄 Fakturerad'}[pay];h+=`<div class="vcard ${idx===0?"latest":""}">
  <div class="vhdr" onclick="togVisit('${v.id}')">
    <span class="vnum">0${p.visits.length-idx}</span>
    <div class="vinfo">
      <div class="vdate">${v.date||"—"}</div>
      <div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap">
        <span style="font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;background:${v.soap&&(v.soap.S||v.soap.O||v.soap.A||v.soap.P)?"#e8f4f6":"#f0f0f0"};color:${v.soap&&(v.soap.S||v.soap.O||v.soap.A||v.soap.P)?"#1a7a8a":"#aaa"}">
          ${v.soap&&(v.soap.S||v.soap.O||v.soap.A||v.soap.P)?"📋 Journal":"📋 Ingen journal"}
        </span>
        <span style="font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;background:${v.plan?"#e8f5ee":"#f0f0f0"};color:${v.plan?"#1a7a4a":"#aaa"}">
          ${v.plan?"🏋 Rehabplan (${(v.plan.exercises||[]).length} övn)":"🏋 Ingen plan"}
        </span>
      </div>
    </div>
    <span class="vstatus" style="background:${sc.bg};color:${sc.col}">${st}</span>
    <span class="vchev ${exp?"open":""}" id="ch-${v.id}">›</span>
  </div><div id="vb-${v.id}" style="display:${exp?"block":"none"}"><div class="vbody"><div>`;if(v.plan&&v.plan.exercises)v.plan.exercises.forEach((ex,i)=>{h+=`<div class="vex-item"><span class="vex-num">0${i+1}</span><span class="vex-name">${e(ex.name)}</span><span class="vex-dose">${ex.sets}×${ex.reps}</span></div>`;});h+=`</div><div class="note-lbl">Kliniska noteringar</div><textarea class="note-inp" placeholder="Dina observationer..." onchange="updNote('${v.id}',this.value)">${e(v.note||"")}</textarea><div class="srow"><span class="slbl">Status</span><select class="ssel" onchange="updStatus('${v.id}',this.value)">${SOPTS.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></div><div class="vactions"> ${v.soap&&(v.soap.S||v.soap.O||v.soap.A||v.soap.P)?`<button class="btn btn-p" onclick="viewDoc('${v.id}')">📋 Visa journal</button>`:v.soap?`<button class="btn" style="opacity:.5;cursor:not-allowed" title="Journal sparad men tom">📋 Visa journal</button>`:""} ${v.plan?`<button class="btn" onclick="viewPlan('${v.id}')">🏋 Visa rehabplan</button><button class="btn btn-p" onclick="sharePlan('${v.id}')">🔗 Dela länk</button><button class="btn" onclick="mailPlan('${v.id}')">✉️ Maila</button>${v.plan?`<button class="btn" onclick="printHomeCard('${v.id}')">🏠 Hemkort</button>`:""}`:""}<button class="btn" onclick="editVisit('${v.id}')">Redigera</button><button class="btn btn-d" style="margin-left:auto" onclick="confDel('visit','${v.id}','besöket ${v.date}')">Radera besök</button></div></div></div></div>`;});}h+=renderConsentBlock(p);document.getElementById("s-detail").innerHTML=h;}
function togVisit(vid){const p=S.pat;if(!p||!p.visits)return;const v=p.visits.find(x=>x.id===vid);if(!v)return;v._exp=!v._exp;const b=document.getElementById("vb-"+vid);const c=document.getElementById("ch-"+vid);if(b)b.style.display=v._exp?"block":"none";if(c)c.classList.toggle("open",v._exp);}
function updNote(vid,note){if(!S.pat)return;S.pat.visits=S.pat.visits.map(v=>v.id===vid?{...v,note}:v);savePat(S.pat);S.pat=S.patients.find(x=>x.id===S.pat.id)||S.pat;}
function updStatus(vid,status){if(!S.pat)return;S.pat.visits=S.pat.visits.map(v=>v.id===vid?{...v,status}:v);savePat(S.pat);S.pat=S.patients.find(x=>x.id===S.pat.id)||S.pat;rDetail();}
function viewDoc(vid){
  const p=S.pat;if(!p)return;
  const v=p.visits.find(x=>x.id===vid);if(!v)return;
  S.visitId=vid;
  S.plan=v.plan||null;
  S.form=v.form||dform();
  if(v.soap && (v.soap.S||v.soap.O||v.soap.A||v.soap.P)){
    go('journaldoc');
  } else {
    alert('Ingen SOAP-journal finns sparad. Skriv en via Journal-knappen i topbaren.');
  }
}
function viewPlan(vid){
  // "Visa rehabplan" -> show doc (plan)

let meetRecognition = null;
let meetTranscript = [];
let meetInterim = "";
let meetTimer = null;
let meetSeconds = 0;
let meetConsented = false;
let meetNote = "";
let currentSOAP = null;

function rMeeting() {
  const p = S.pat;
  if (!p) { go("list"); return; }
  const el = document.getElementById("s-meeting");

  if (!meetConsented) {
    el.innerHTML = `<div class="meet-wrap">

        <div class="meet-consent-txt">

        </div>

          <button class="btn btn-p" onclick="giveConsent()">✓ Patienten har samtyckt — Starta möte</button>

  }

  el.innerHTML = `<div class="meet-wrap">

    <div class="meet-sub">${e(p.diagnosis||"")} · ${new Date().toLocaleDateString('sv-SE')}</div>
    <div class="meet-status">
      <div class="meet-dot ${isListening?'listening':'idle'}" id="meet-dot"></div>
      <span class="meet-status-txt" id="meet-status-txt">${isListening?'Lyssnar och transkriberar...':'Tryck Starta för att börja'}</span>

    </div>
    <div class="transcript-box" id="tbox">
      ${transcriptHtml}
      <div class="transcript-line" id="meet-interim-line" style="${meetInterim?'':'display:none'}">

      </div>

        ? `<button class="rec-btn stop" onclick="stopListening()">⏹ Pausa inspelning</button>`

      }
    </div>
    <div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#4a5a6a;margin-bottom:5px">Egna noteringar</div>

      Avsluta möte och skapa journal →

      Du kan avsluta även om inget transkriberats — skriv manuellt i noteringar ovan.

function giveConsent() {
  meetConsented = true;
  meetTranscript = [];
  meetInterim = "";
  meetSeconds = 0;
  meetNote = "";
  rMeeting();
  // Start timer — only update the clock element, not full re-render
  meetTimer = setInterval(() => {
    meetSeconds++;
    const el = document.getElementById('meet-clock');
    if (el) {
      const mins = String(Math.floor(meetSeconds/60)).padStart(2,'0');
      const secs = String(meetSeconds%60).padStart(2,'0');
      el.textContent = mins+':'+secs;
    }
  }, 1000);
  startListening();
}

function startListening() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Din webbläsare stöder inte röstinspelning. Använd Safari på Mac eller iPhone.');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  meetRecognition = new SR();
  meetRecognition.lang = 'sv-SE';
  meetRecognition.continuous = true;
  meetRecognition.interimResults = true;
  meetRecognition.maxAlternatives = 1;

  meetRecognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        const now = new Date();
        const time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
        meetTranscript.push({ time, text: transcript.trim() });
        meetInterim = '';
        // Append new line to transcript box without full re-render
        appendTranscriptLine(time, transcript.trim());
      } else {
        interim += transcript;
      }
    }
    meetInterim = interim;
    // Update interim display only
    const intEl = document.getElementById('meet-interim');
    if (intEl) intEl.textContent = interim;
    // Enable done button now that we have content
    updateDoneBtn();
  };

  meetRecognition.onerror = (event) => {
    console.warn('Speech error:', event.error);
    if (event.error === 'not-allowed') {
      alert('Mikrofontillstånd saknas. Gå till Systeminställningar → Safari → Mikrofon och tillåt.');
      meetRecognition = null;
    } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
      meetInterim = '';
      const intEl = document.getElementById('meet-interim');
      if (intEl) intEl.textContent = '';
    }
  };

  meetRecognition.onend = () => {
    // Only auto-restart if we haven't manually stopped
    if (meetRecognition) {
      setTimeout(() => {
        if (meetRecognition) {
          try { meetRecognition.start(); } catch(e) { console.warn('restart failed', e); }
        }
      }, 200);
    }
    // Update status dot
    const dot = document.getElementById('meet-dot');
    const txt = document.getElementById('meet-status-txt');
    if (meetRecognition) {
      if (dot) { dot.className = 'meet-dot listening'; }
      if (txt) txt.textContent = 'Lyssnar och transkriberar...';
    }
  };

  meetRecognition.onstart = () => {
    const dot = document.getElementById('meet-dot');
    const txt = document.getElementById('meet-status-txt');
    if (dot) dot.className = 'meet-dot listening';
    if (txt) txt.textContent = 'Lyssnar och transkriberar...';
    updateRecBtn(true);
  };

  meetRecognition.start();
  updateRecBtn(true);
}

function stopListening() {
  if (meetRecognition) {
    const r = meetRecognition;
    meetRecognition = null; // set null BEFORE calling stop so onend doesn't restart
    r.onend = null;
    r.onerror = null;
    try { r.stop(); } catch(e) {}
  }
  meetInterim = '';
  const intEl = document.getElementById('meet-interim');
  if (intEl) intEl.textContent = '';
  const dot = document.getElementById('meet-dot');
  const txt = document.getElementById('meet-status-txt');
  if (dot) dot.className = 'meet-dot idle';
  if (txt) txt.textContent = 'Inspelning pausad';
  updateRecBtn(false);
}

function appendTranscriptLine(time, text) {
  const tbox = document.getElementById('tbox');
  if (!tbox) return;
  // Remove the placeholder if present
  const placeholder = tbox.querySelector('div[style*="italic"]');
  if (placeholder) placeholder.remove();
  const div = document.createElement('div');
  div.className = 'transcript-line';
  div.innerHTML = `<span class="tl-time">${time}</span><span class="tl-text">${e(text)}</span>`;
  tbox.appendChild(div);
  tbox.scrollTop = tbox.scrollHeight;
  updateDoneBtn();
}

function updateDoneBtn() {
  const btn = document.getElementById('meet-done-btn');
  if (btn) btn.disabled = false; // always enable — user can finish even with empty transcript
}

function updateRecBtn(isListening) {
  const wrap = document.getElementById('meet-btn-wrap');
  if (!wrap) return;
  if (isListening) {
    wrap.innerHTML = `<button class="rec-btn stop" onclick="stopListening()">⏹ Pausa inspelning</button>`;
  } else {
    wrap.innerHTML = `<button class="rec-btn start" onclick="startListening()">⏺ ${meetTranscript.length?'Fortsätt':'Starta'} inspelning</button>`;
  }
}

function resetMeeting() {
  stopListening();
  if (meetTimer) { clearInterval(meetTimer); meetTimer = null; }
  meetConsented = false;
  meetTranscript = [];
  meetInterim = '';
  meetSeconds = 0;
  meetNote = '';
  currentSOAP = null;
}

async function finishMeeting() {
  stopListening();
  if (meetTimer) { clearInterval(meetTimer); meetTimer = null; }
  const key = getKey();
  if (!key) { alert('API-nyckel saknas. Gå till ⚙ Inställningar.'); return; }

  const fullTranscript = meetTranscript.map(t => `[${t.time}] ${t.text}`).join('\n');
  const extra = meetNote ? `\n\nEgna noteringar: ${meetNote}` : '';

  // If nothing captured at all, open manual SOAP instead
  if (!fullTranscript && !meetNote) {
    alert('Ingen transkription eller noteringar. Fyller i journalen manuellt.');
    go(S.pat ? 'detail' : 'list');
    startManualSOAP();
    return;
  }

  S.loadStep = 1;
  go('loading');

  const prompt = `Du är erfaren fysioterapeut och journalförare. Analysera detta medicinska samtal och skapa en strukturerad SOAP-journalanteckning på svenska.

TRANSKRIPTION:
${fullTranscript}${extra}

Returnera ENBART giltig JSON utan backticks:
{
  "soap": {
    "S": "Subjektivt — patientens berättelse, symtom, smärtbeskrivning, varaktighet, aggravations- och lindrande faktorer",
    "O": "Objektivt — undersökningsfynd, tester, rörelseomfång, palpation, neurologisk status",
    "A": "Bedömning — diagnos eller differentialdiagnos, funktionsnivå, prognos",
    "P": "Plan — behandlingsplan, åtgärder, hemprogram, uppföljning"
  },
  "diagnosis": "Mest trolig diagnos (välj från: Ländryggssmärta (ospecifik), Nacksmärta / cervikalt syndrom, Rotatorkuffproblem / axelsmärta, Knäartros, Höftartros, Tennisarmbåge (lateral epikondylit), Hälseneproblem (Achillestendinopati), Plantarfasciit, Frozen shoulder (adhesiv kapsulir), Diskbråck lumbal, Patellofemoralt smärtsyndrom, Fibromyalgi, Annan / fritext)",
  "customDiagnosis": "Om Annan/fritext — ange diagnos här, annars tom sträng",
  "pain": 5,
  "motivation": 6,
  "history": "ingen",
  "knowledge": "låg",
  "location": "hem",
  "exercises": 5,
  "followup": 4,
  "clinicalFocus": "Specifika kliniska fynd och fokusområden för rehabplanen",
  "icd10": "Mest trolig ICD-10 kod, t.ex. M54.5",
  "icd10desc": "Beskrivning av ICD-10 koden på svenska, t.ex. Ländryggssmärta"
}

pain ska vara 0-10 baserat på patientens beskrivning.
motivation ska vara 1-10 baserat på vad som framkom.
history: ingen/sporadisk/regelbunden baserat på träningsbakgrund.
knowledge: låg/medel/hög baserat på patientens förståelse.
location: hem/gym baserat på vad som diskuterades.
Filtrera bort allt som INTE är medicinskt relevant — vardagsprat, hälsningar, väder, mat etc ska INTE ingå i SOAP-anteckningen.`;

  try {
    S.loadStep = 2;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514", max_tokens: 6000,
        system: "Du är erfaren fysioterapeut. Svara ALLTID med giltig JSON. Inga backticks.",
        messages: [{role:"user", content:prompt}]
      })
    });
    S.loadStep = 3;
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('');
    let cleaned = text.replace(/```json|```/g,'').trim();
    console.log('RAW API RESPONSE:', JSON.stringify(data));
    console.log('CLEANED TEXT:', cleaned.slice(0,500));
    if(!cleaned.endsWith('}')){const lb=cleaned.lastIndexOf('}');if(lb>0)cleaned=cleaned.slice(0,lb+1);}
    if(!cleaned){throw new Error('Tomt svar från API. stop_reason: '+(data.stop_reason||'?'));}
    const result = JSON.parse(cleaned);
    currentSOAP = { ...result, transcript: meetTranscript, date: new Date().toISOString().slice(0,10), note: meetNote };
    go('soap');
  } catch(err) {

    go('meeting');

async function saveSOAPToVisit(goToPlan) {
  const p = S.pat;
  if (!p || !currentSOAP) return;
  const vid = 'v_' + Date.now();
  const diag = currentSOAP.diagnosis || p.diagnosis || '';

  // Build SOAP text for storage
  const soapText = ['S','O','A','P'].map(l =>
    `${l}: ${document.getElementById('soap-'+l)&&document.getElementById('soap-'+l).value || currentSOAP.soap[l] || ''}`
  ).join('\n\n');

  const newVisit = {
    id: vid,
    date: currentSOAP.date,
    form: null,
    plan: null,
    status: 'Aktiv',
    note: soapText,
    soap: currentSOAP.soap,
    transcript: currentSOAP.transcript,
    soapMeta: currentSOAP
  };

  const updPat = {...p, diagnosis: diag, visits: [newVisit, ...(p.visits||[])]};
  const saved = savePat(updPat);
  S.pat = saved;
  S.visitId = vid;

  if (goToPlan) {
    // Pre-fill form from SOAP analysis
    S.form = {
      name: p.name || '',
      birthYear: p.birthYear || 1980,
      diagnosis: currentSOAP.diagnosis || diag,
      customDiag: currentSOAP.customDiagnosis || '',
      pain: currentSOAP.pain || 5,
      history: currentSOAP.history || 'ingen',
      knowledge: currentSOAP.knowledge || 'låg',
      location: currentSOAP.location || 'hem',
      motivation: currentSOAP.motivation || 6,
      exercises: currentSOAP.exercises || 5,
      followup: currentSOAP.followup || 4,
      notes: currentSOAP.clinicalFocus || ''
    };
    resetMeeting();
    go('form');
  }
}

async function finishManualSOAP(goPlan) {
  // Read values
  const soap = {
    S: document.getElementById('ms-S').value.trim(),
    O: document.getElementById('ms-O').value.trim(),
    A: document.getElementById('ms-A').value.trim(),
    P: document.getElementById('ms-P').value.trim()
  };
  const diagnosis = document.getElementById('ms-diag').value;
  const customDiagnosis = document.getElementById('ms-custom').value.trim();
  const icd10 = document.getElementById('ms-icd').value.trim();
  const icd10desc = document.getElementById('ms-icddesc').value.trim();
  
  // If any SOAP content exists, use AI to extract rehab params
  const soapText = [soap.S,soap.O,soap.A,soap.P].filter(Boolean).join('\n');
  const key = getKey();
  
  if (soapText && key) {
    S.loadStep = 1; go('loading');
    try {
      S.loadStep = 2;
      const prompt = `Analysera denna SOAP-journalanteckning och extrahera rehabparametrar. Svara ENBART med JSON utan backticks.

SOAP:
S: ${soap.S}
O: ${soap.O}
A: ${soap.A}
P: ${soap.P}
Diagnos: ${diagnosis}

JSON:
{"pain":5,"motivation":6,"history":"ingen","knowledge":"låg","location":"hem","exercises":5,"followup":4,"clinicalFocus":"specifika fynd och fokusområden"}

pain 0-10, motivation 1-10, history: ingen/sporadisk/regelbunden, knowledge: låg/medel/hög, location: hem/gym`;
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,system:"Svara ALLTID med giltig JSON. Inga backticks.",messages:[{role:"user",content:prompt}]})});
      S.loadStep = 3;
      const data = await res.json();
      const text = (data.content||[]).map(b=>b.text||'').join('');
      const params = JSON.parse(text.replace(/```json|```/g,'').trim());
      currentSOAP = {...currentSOAP, ...params, soap, diagnosis, customDiagnosis, icd10, icd10desc};
    } catch(err) {
      // Fallback without AI params
      currentSOAP = {...currentSOAP, soap, diagnosis, customDiagnosis, icd10, icd10desc};
    }
  } else {
    currentSOAP = {...currentSOAP, soap, diagnosis, customDiagnosis, icd10, icd10desc};
  }

  if (goPlan) {
    await saveSOAPToVisit(true);
  } else {
    go('soap');
  }
}

// ── PAIN CHART ────────────────────────────────────────────────────────────────
function renderPainChart(visits) {
  const pts = [...visits].reverse().filter(v=>v.form&&v.form.pain!=null).slice(0,10);
  if (pts.length < 2) return '';
  const W=340, H=70, PAD=10;
  const vals = pts.map(v=>v.form.pain);
  const min=0, max=10;
  const xStep = (W-PAD*2)/(pts.length-1);
  const yScale = (H-PAD*2)/(max-min);
  const points = vals.map((v,i)=>({
    x: PAD+i*xStep,
    y: H-PAD-(v-min)*yScale
  }));
  const path = points.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');
  const area = path + ` L${points[points.length-1].x},${H-PAD} L${PAD},${H-PAD} Z`;
  const dots = points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${vals[i]>=7?'#c07070':vals[i]>=4?'#c8a030':'#5a9860'}"/>`).join('');
  const labels = points.map((p,i)=>`<text x="${p.x}" y="${H}" font-size="7" fill="#3a4a5a" text-anchor="middle">${pts[i].date.slice(5)}</text>`).join('');
  return `<div class="chart-wrap">
    <div class="chart-title">Smärtutveckling (NRS)</div>
    <div class="chart-svg-wrap">
      <svg width="100%" viewBox="0 0 ${W} ${H+12}" preserveAspectRatio="xMidYMid meet">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a7a8a" stop-opacity="0.18"/><stop offset="100%" stop-color="#2a7a8a" stop-opacity="0"/></linearGradient></defs>
        <line x1="${PAD}" y1="${PAD}" x2="${PAD}" y2="${H-PAD}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        ${[0,5,10].map(v=>`<text x="${PAD-3}" y="${H-PAD-(v-min)*yScale+3}" font-size="7" fill="#3a4a5a" text-anchor="end">${v}</text>`).join('')}
        <path d="${area}" fill="url(#ag)"/>
        <path d="${path}" fill="none" stroke="#2a7a8a" stroke-width="1.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>
  </div>`;
}

  if (!S.pat || !confirm('Återkalla samtycke för '+CONSENT_TYPES.find(c=>c.key===type)?.label+'?')) return;

}

function exportBackup(silent) {
  // Collect all patients from both storage key formats
  const seen = new Set();
  const patients = [];
  S.patients.forEach(p => { if (p&&p.id&&!seen.has(p.id)) { seen.add(p.id); patients.push(p); } });
  // Also sweep localStorage for any orphaned keys
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k.startsWith('pat:') || k.startsWith('kansei-data:') || k.startsWith('kpat_')) {
      try {
        const p = JSON.parse(localStorage.getItem(k));
        if (p&&p.id&&!seen.has(p.id)) { seen.add(p.id); patients.push(p); }
      } catch(e) {}
    }
  }
  // Also collect economics user entries
  const ekEntries = (() => { try { return JSON.parse(localStorage.getItem('kansei-ek:intakter')||'[]'); } catch(e){return[];} })();

  const data = {
    appName: 'Kansei Klinik',
    version: 2,
    exported: new Date().toISOString(),
    exportedReadable: new Date().toLocaleString('sv-SE'),
    patientCount: patients.length,
    patients,
    
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
  a.download = `kansei-klinik-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (!silent) showAutoSaveToast('💾 Backup nedladdad');
  return patients.length;
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      // Support both old format (patients array) and new format (version 2)
      const patients = data.patients;
      if (!patients||!Array.isArray(patients)) { alert('Ogiltig backupfil — inga patienter hittades.'); return; }
      let count = 0;
      patients.forEach(p => {
        if (p&&p.id) {
          localStorage.setItem('kansei-data:'+p.id, JSON.stringify(p));
          localStorage.setItem('pat:'+p.id, JSON.stringify(p));
          count++;
        }
      });
      // Import economics user entries if present
      if (data.ekonomi&&data.ekonomi.userEntries&&Array.isArray(data.ekonomi.userEntries)) {
        localStorage.setItem('kansei-ek:intakter', JSON.stringify(data.ekonomi.userEntries));
      }
      alert(`✓ ${count} patienter importerade från backup (${data.exportedReadable||data.exported||'okänt datum'}).\n\nSidan laddas om.`);
      loadPats();
      go('dashboard');
    } catch(err) { alert('Kunde inte läsa filen: '+err.message); }
  };
  input.click();
}

// ── SMÄRTGRAF ─────────────────────────────────────────────────────────────────

function renderPainGraph(pat) {
  const visits = (pat.visits||[]).slice().reverse(); // oldest first
  const painPoints = visits.filter(v => v.form && v.form.pain != null);
  if (painPoints.length < 2) return ''; // need at least 2 points

  const W = 280, H = 60, PAD = 8;
  const n = painPoints.length;
  const xs = painPoints.map((_, i) => PAD + (i / (n - 1)) * (W - PAD * 2));
  const ys = painPoints.map(v => PAD + ((10 - v.form.pain) / 10) * (H - PAD * 2));

  // polyline
  const pts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');

  // color: improving = green, worsening = red
  const first = painPoints[0].form.pain;
  const last = painPoints[painPoints.length-1].form.pain;
  const trend = last < first ? '#4a9860' : last > first ? '#c07070' : '#4a9aaa';

  // dots + labels
  let dots = '';
  painPoints.forEach((v, i) => {
    dots += `<circle cx="${xs[i]}" cy="${ys[i]}" r="3" fill="${trend}" opacity="0.9"/>`;
    if (i === 0 || i === n-1) {
      const anchor = i === 0 ? 'start' : 'end';
      dots += `<text x="${xs[i]}" y="${H - 1}" text-anchor="${anchor}" font-size="8" fill="#5a6a7a">${v.form.pain}/10</text>`;
      dots += `<text x="${xs[i]}" y="${H + 9}" text-anchor="${anchor}" font-size="7" fill="#8a9aaa">${v.date||''}</text>`;
    }
  });

  const arrow = last < first ? '↓ Förbättring' : last > first ? '↑ Försämring' : '→ Oförändrad';
  const diff = Math.abs(last - first);

  return `<div style="margin:12px 0 4px;padding:12px 14px;background:white;border:1px solid var(--border);border-radius:8px">
    <div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">
      Smärtutveckling (NRS) &nbsp;<span style="color:${trend};font-size:11px">${arrow} ${diff > 0 ? diff + ' enheter' : ''}</span>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H + 14}" style="overflow:visible">
      <polyline points="${pts}" fill="none" stroke="${trend}" stroke-width="2" stroke-linejoin="round" opacity="0.7"/>
      ${dots}
    </svg>
  </div>`;
}
