  if (plan.lifestyleTips?.length) {
    tipsHtml = `<div style="margin:12px 16px 0;background:white;border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.07)">
      <div style="font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:14px">Livsstilsråd</div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${plan.lifestyleTips.map(t=>`<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 14px;background:#f8f9fa;border-radius:9px">
          <div style="color:var(--teal);font-size:16px;flex-shrink:0;margin-top:1px;font-weight:700">→</div>
          <div style="font-size:14px;color:#3a4a5a;line-height:1.55">${e(t)}</div>
        </div>`).join('')}
      </div></div>`;
  }

  // ── FOLLOWUP BANNER ───────────────────────────────────────────────
  let followupHtml = '';
  if (plan.followupNote) {
    followupHtml = `<div style="margin:12px 16px 0;background:linear-gradient(135deg,#1a3a4a,#2a5a6a);border-radius:14px;padding:22px 20px">
      <div style="font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:10px">Nästa steg</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:17px;color:white;line-height:1.7;font-style:italic">${e(plan.followupNote)}</div>
    </div>`;
  }

  // ── FOOTER ────────────────────────────────────────────────────────
  const clinicLine = [CLINIC.name, CLINIC.phone, CLINIC.email].filter(Boolean).join(' · ');

  // ── PROGRESS GRAPH ────────────────────────────────────────────────
  const progressGraph = pat ? renderPublicPlanProgressGraph(pat) : '';

  // ── PASS COMPLETION BUTTON ────────────────────────────────────────
  const passBtn = `<div style="position:sticky;bottom:20px;padding:0 16px;margin-top:20px">
    <button id="pub-pass-btn" onclick="pubLogPassDone('${e(pat?.id||'')}','${e(plan.visitId||'')}');this.disabled=true"
      style="width:100%;background:var(--teal);color:white;font-size:16px;font-weight:700;padding:16px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(26,122,138,.4);-webkit-tap-highlight-color:transparent;transition:opacity .15s"
      ontouchstart="this.style.opacity='.8'" ontouchend="this.style.opacity='1'">
      Klar med dagens pass
    </button>
  </div>`;

  el.innerHTML = `<div style="background:var(--bg);min-height:100vh;padding-bottom:48px">

    <div style="background:var(--navy);padding:28px 20px 22px">
      <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:10px">Din rehabplan</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:30px;color:white;margin-bottom:4px;line-height:1.1">${e(plan.patientName||pat?.name||'')}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.55);margin-bottom:${chips?'14px':'0'}">${e(plan.diagnosis||'')}</div>
      ${chips?`<div style="display:flex;gap:7px;flex-wrap:wrap">${chips}</div>`:''}
    </div>

    ${progressGraph}

    ${plan.greeting?`<div style="margin:12px 16px 0;background:white;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.07);font-size:14px;color:#3a4a5a;line-height:1.75">${e(plan.greeting)}</div>`:''}

    ${goalsHtml}

    ${(plan.exercises||[]).length?`<div style="margin:12px 16px 0">
      <div style="font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;padding-left:2px">Övningsprogram</div>
      <div class="pub-exlist">${exHtml}</div>
    </div>`:''}

    ${painHtml}
    ${tipsHtml}
    ${followupHtml}

    ${passBtn}

    <div style="margin:20px 16px 0;background:var(--navy);border-radius:14px;padding:22px 20px;text-align:center">
      <img src="${LOGO}" style="height:26px;opacity:.7;margin-bottom:10px">
      <div style="font-size:12px;color:rgba(255,255,255,.45);line-height:1.9">${e(clinicLine)}</div>
      ${CLINIC.phone?`<a href="tel:${CLINIC.phone}" style="display:inline-block;margin-top:12px;background:rgba(255,255,255,.1);color:white;font-size:13px;font-weight:600;padding:10px 24px;border-radius:8px;text-decoration:none">Ring oss</a>`:''}
    </div>

  </div>`;
}

// ── CHECK FOR PUBLIC PLAN LINK (#plan=xxx&visit=yyy)
const _hashParams = new URLSearchParams(window.location.hash.replace('#',''));
const _hashPatId = _hashParams.get('plan');
const _hashVisitId = _hashParams.get('visit');

if (_hashPatId && _hashVisitId) {
  // Public plan view — no login needed
  const tb = document.querySelector('.topbar');
  if (tb) tb.style.display = 'none';
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s-public-plan').classList.add('active');
  document.getElementById('s-public-plan').innerHTML = '<div class="pub-loading">Hämtar din rehabplan...</div>';
  loadPublicPlan(_hashPatId, _hashVisitId);
} else {
  const _storedAuth = getStoredAuth();
  if (_storedAuth) {
    _authUser = _storedAuth.user;
    loadPats(); S.apiKey = getKey(); startAutoSave(); go('dashboard');
    setTimeout(() => syncFromCloud(), 1500);
  } else {
    const tb = document.querySelector('.topbar');
    if (tb) tb.style.display = 'none';
    rLogin();
  }
}

</script>
</body>
</html>
